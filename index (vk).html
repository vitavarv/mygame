// ============================================================================
// Яндекс: SDK подключается тегом <script> в <head>.
// VK: добавьте в <head> скрипт vk-bridge (см. README.txt) — игра сама его найдёт.
// Без платформы (тест в браузере) награды выдаются сразу, без рекламы.
let ysdk = null;
let yPlayer = null;
let platformName = 'web';
let lastInterstitialTime = performance.now();
const INTERSTITIAL_COOLDOWN_MS = 180000;
const LEADERBOARD_NAME = 'score'; // техническое имя лидерборда в консоли Яндекс Игр

function adUnavailable() {
    addFloatingScore(VW / 2, 420, L('Реклама сейчас недоступна — попробуйте позже', 'Ads are unavailable right now — try later'), '#fca5a5', 15);
}
function pauseForAd() { adPlaying = true; systemMuted = true; aiming = false; }
function resumeAfterAd() { adPlaying = false; systemMuted = false; lastFrame = performance.now(); }

function tryShowInterstitialAdWithCooldown() {
    const now = performance.now();
    if (now - lastInterstitialTime < INTERSTITIAL_COOLDOWN_MS) return;
    if (platformName === 'yandex' && ysdk && ysdk.adv) {
        lastInterstitialTime = now;
        pauseForAd();
        ysdk.adv.showFullscreenAdv({
            callbacks: {
                onClose: () => resumeAfterAd(),
                onError: () => resumeAfterAd()
            }
        });
    } else if (platformName === 'vk') {
        lastInterstitialTime = now;
        pauseForAd();
        window.vkBridge.send('VKWebAppShowNativeAds', { ad_format: 'interstitial' })
            .then(resumeAfterAd).catch(resumeAfterAd);
    }
}

function platformGameplayStart() {
    try { if (ysdk && ysdk.features && ysdk.features.GameplayAPI) ysdk.features.GameplayAPI.start(); } catch (e) {}
}
function platformGameplayStop() {
    try { if (ysdk && ysdk.features && ysdk.features.GameplayAPI) ysdk.features.GameplayAPI.stop(); } catch (e) {}
}

// Настоящий рейтинг площадки (если лидерборд создан в консоли)
function platformSubmitScore() {
    try {
        if (platformName !== 'yandex' || !ysdk) return;
        if (ysdk.leaderboards && ysdk.leaderboards.setScore) {
            ysdk.leaderboards.setScore(LEADERBOARD_NAME, score).catch(() => {});
        } else if (ysdk.getLeaderboards) {
            ysdk.getLeaderboards().then(lb => lb.setLeaderboardScore(LEADERBOARD_NAME, score)).catch(() => {});
        }
    } catch (e) {}
}

function platformSubmitDaily(depth) {
    try {
        if (platformName !== 'yandex' || !ysdk) return;
        if (ysdk.leaderboards && ysdk.leaderboards.setScore) ysdk.leaderboards.setScore('daily', depth).catch(() => {});
        else if (ysdk.getLeaderboards) ysdk.getLeaderboards().then(lb => lb.setLeaderboardScore('daily', depth)).catch(() => {});
    } catch (e) {}
}

// Облачные сохранения: прогресс не пропадёт при очистке браузера
function platformCloudSave() {
    try {
        if (yPlayer && lastSaveJson) yPlayer.setData({ save: lastSaveJson }, false).catch(() => {});
        else if (platformName === 'vk' && lastSaveJson.length < 4000) {
            window.vkBridge.send('VKWebAppStorageSet', { key: 'save', value: lastSaveJson }).catch(() => {});
        }
    } catch (e) {}
}

function applyCloudSaveIfNewer(raw) {
    try {
        if (!raw) return;
        const cloud = JSON.parse(raw);
        const local = lastSaveJson ? JSON.parse(lastSaveJson) : null;
        const better = !local || (cloud.currentLevel || 1) > (local.currentLevel || 1) ||
            ((cloud.currentLevel || 1) === (local.currentLevel || 1) && (cloud.savedAt || 0) > (local.savedAt || 0));
        if (better) {
            orbs = [];
            loadGameState(raw);
            saveGameState();
        }
    } catch (e) {}
}

function applyBoosterEffect(type) {
    const t = I18N[currentLang];
    if (type === 'wheelSpin') {
        startWheelSpin();
    } else if (type === 'dailyX2') {
        claimDailyReward(2);
    } else if (type === 'bottomBlast') {
        executeBottomRowBlast();
    } else if (type === 'shake') {
        executeTornadoShake();
    } else if (type === 'laserLink') {
        executeRemoteLaserLink();
    } else if (type === 'hammer') {
        hammerMode = true;
    } else if (type === 'picker') {
        pickerModalOpen = true;
    } else if (type === 'slot777') {
        finishSlotSpin();
    } else if (type === 'stageX3') {
        lastInterstitialTime = performance.now();
        advanceToNextLevel(2);
    } else if (type.startsWith('upg_')) {
        const k = type.replace('upg_', '');
        metaUpgrades[k]++;
        playJackpotFanfare();
        saveGameState();
    } else if (type === 'doubleTopOrb') {
        vipOffer.active = false;
        vipOffer.timer = 24;
        const normalOrbs = orbs.filter(o => !o.isStone);
        if (normalOrbs.length > 0) {
            let bestOrb = normalOrbs[0];
            normalOrbs.forEach(o => { if (o.tier > bestOrb.tier) bestOrb = o; });
            bestOrb.tier++;
            bestOrb.radius = getOrbRadius(bestOrb.tier);
            bestOrb.frozen = 0;
            bestOrb.scaleX = 0.35;
            bestOrb.scaleY = 1.6;
            if (bestOrb.tier > maxUnlockedTier) maxUnlockedTier = bestOrb.tier;
            fireRivalMissile(bestOrb.x, bestOrb.y, 1200, '#fbbf24');
            spawnSubtleStarburst(bestOrb.x, bestOrb.y, 3);
            fireFourCornerCannons();
            playJackpotFanfare();
            addFloatingScore(bestOrb.x, bestOrb.y - 20, t.vipUpgraded, '#fbbf24', 18);
        }
        saveGameState();
    } else if (type.startsWith('chestSkip')) {
        const i = Number(type.replace('chestSkip', ''));
        if (chestSlots[i]) chestSlots[i].readyAt -= 30 * 60000;
        saveGameState();
    } else if (type.startsWith('questX2_')) {
        claimQuest(Number(type.replace('questX2_', '')), 2);
    } else if (type === 'perkReroll') {
        perkModal.choices = rollPerkChoices();
        perkModal.rerolled = true;
        perkModal.t = 0.2;
    } else if (type === 'chestX2') {
        claimChest(2);
    } else if (type === 'revive') {
        if (gameOverReason === 'drops') rival.dropsLeft += 15;
        if (gameOverReason === 'time') rival.timeLeft += 25;
        outOfDropsT = 0;
        orbs.forEach(o => { o.frozen = 0; });
        orbs = orbs.filter(o => !o.isStone);
        orbs.sort((a, b) => a.y - b.y);
        const toRemove = gameOverReason === 'overflow' ? Math.min(8, orbs.length) : Math.min(3, orbs.length);
        for (let i = 0; i < toRemove; i++) {
            const o = orbs[i];
            spawnParticles(o.x, o.y, getOrbColors(o.tier).color1, 14);
        }
        orbs.splice(0, toRemove);
        revivesThisLevel++;
        lavaTimer = 0;
        dangerTimer = 0;
        isGameOver = false;
        platformGameplayStart();
        canDrop = true;
        dropCooldown = 0;
        playPopSound(7, 4);
        saveGameState();
    }
}

function watchRewardedAd(type) {
    if (platformName === 'yandex' && ysdk && ysdk.adv) {
        pauseForAd();
        let rewarded = false;
        ysdk.adv.showRewardedVideo({
            callbacks: {
                onRewarded: () => { rewarded = true; lastInterstitialTime = performance.now(); },
                onClose: () => { resumeAfterAd(); if (rewarded) applyBoosterEffect(type); },
                onError: () => { resumeAfterAd(); adUnavailable(); }
            }
        });
    } else if (platformName === 'vk') {
        pauseForAd();
        window.vkBridge.send('VKWebAppCheckNativeAds', { ad_format: 'reward', use_waterfall: false })
            .then(chk => {
                if (!chk || !chk.result) { resumeAfterAd(); adUnavailable(); return; }
                return window.vkBridge.send('VKWebAppShowNativeAds', { ad_format: 'reward', use_waterfall: false })
                    .then(data => { resumeAfterAd(); if (data && data.result) { lastInterstitialTime = performance.now(); applyBoosterEffect(type); } else adUnavailable(); });
            })
            .catch(() => { resumeAfterAd(); adUnavailable(); });
    } else {
        applyBoosterEffect(type);
    }
}

function resetGame() {
    orbs = [];
    combo = 0;
    dangerTimer = 0;
    isGameOver = false;
    canDrop = true;
    dropCooldown = 0;
    initRivalForLevel(currentLevel);
    saveGameState();
    platformGameplayStart();
    tryShowInterstitialAdWithCooldown();
}

loadGameState();
tryLoadMusicFiles();

if (typeof YaGames !== 'undefined') {
    platformName = 'yandex';
    YaGames.init().then(_sdk => {
        ysdk = _sdk;
        const envLang = ysdk.environment.i18n.lang;
        currentLang = (envLang === 'ru' || envLang === 'be' || envLang === 'kk' || envLang === 'uk') ? 'ru' : 'en';
        if (ysdk.features && ysdk.features.LoadingAPI) ysdk.features.LoadingAPI.ready();
        // Пауза при сворачивании и при показе рекламы из меню платформы
        try {
            ysdk.on && ysdk.on('game_api_pause', () => { systemMuted = true; adPlaying = true; });
            ysdk.on && ysdk.on('game_api_resume', () => resumeAfterAd());
        } catch (e) {}
        ysdk.getPlayer().then(p => {
            yPlayer = p;
            return p.getData(['save']);
        }).then(d => { if (d && d.save) applyCloudSaveIfNewer(d.save); }).catch(() => {});
    }).catch(() => { platformName = 'web'; });
} else if (window.vkBridge) {
    platformName = 'vk';
    // Правила VK: интерфейс должен открываться на русском
    currentLang = 'ru';
    window.vkBridge.send('VKWebAppInit').catch(() => {});
    // Правила VK: звук должен останавливаться, когда игру сворачивают или закрывают
    try {
        window.vkBridge.subscribe(function (e) {
            const t = e && e.detail && e.detail.type;
            if (t === 'VKWebAppViewHide') systemMuted = true;
            else if (t === 'VKWebAppViewRestore') systemMuted = document.hidden || adPlaying;
        });
    } catch (e) {}
    window.vkBridge.send('VKWebAppStorageGet', { keys: ['save'] })
        .then(r => { const v = r && r.keys && r.keys[0] && r.keys[0].value; if (v) applyCloudSaveIfNewer(v); })
        .catch(() => {});
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
