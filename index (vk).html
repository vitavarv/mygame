            playCoinClink();
            flyingStars.splice(i, 1);
        }
    }

    for (let i = wallRipples.length - 1; i >= 0; i--) {
        wallRipples[i].life -= dt;
        if (wallRipples[i].life <= 0) wallRipples.splice(i, 1);
    }
    for (let i = cornerStreamers.length - 1; i >= 0; i--) {
        const cs = cornerStreamers[i];
        cs.vy += 260 * dt;
        cs.x += cs.vx * dt;
        cs.y += cs.vy * dt;
        cs.life -= dt;
        if (cs.life <= 0) cornerStreamers.splice(i, 1);
    }
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.vy += 520 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = confetti.length - 1; i >= 0; i--) {
        const c = confetti[i];
        c.vy += 420 * dt;
        c.x += c.vx * dt;
        c.y += c.vy * dt;
        c.rot += c.vRot * dt;
        c.life -= dt;
        if (c.life <= 0) confetti.splice(i, 1);
    }
    for (let i = shockRings.length - 1; i >= 0; i--) {
        const s = shockRings[i];
        s.r += 260 * dt;
        if (s.r >= s.maxR) shockRings.splice(i, 1);
    }
    for (let i = laserLinkBeams.length - 1; i >= 0; i--) {
        laserLinkBeams[i].life -= dt;
        if (laserLinkBeams[i].life <= 0) laserLinkBeams.splice(i, 1);
    }
    for (let i = floatingLabels.length - 1; i >= 0; i--) {
        const fl = floatingLabels[i];
        fl.y -= 48 * dt;
        fl.life -= dt;
        if (fl.life <= 0) floatingLabels.splice(i, 1);
    }

    jarShakeX *= 0.85;
    jarShakeY *= 0.85;

    renderScene(dt, now);
}

function traceWorldShapePath(ctx, r, worldType) {
    ctx.beginPath();
    if (worldType === 0) {
        // МИР 1 (Киберпанк): Идеальная неоновая Кибер-Сфера
        ctx.arc(0, 0, r, 0, Math.PI * 2);
    } else if (worldType === 1) {
        // МИР 2 (Вегас): Скругленный кубик (подогнан под круглую физику)
        const side = r * 1.62;
        ctx.roundRect(-side / 2, -side / 2, side, side, r * 0.46);
    } else if (worldType === 2) {
        // МИР 3 (Сатурн): Планета (кольцо рисуется отдельно)
        ctx.arc(0, 0, r * 0.94, 0, Math.PI * 2);
    } else if (worldType === 6) {
        // МИР 7 (Северное сияние): Ледяной кристалл-ромб со скруглениями
        const pts = [{ x: 0, y: -r * 1.08 }, { x: r * 0.98, y: 0 }, { x: 0, y: r * 1.08 }, { x: -r * 0.98, y: 0 }];
        ctx.moveTo((pts[0].x + pts[3].x) / 2, (pts[0].y + pts[3].y) / 2);
        for (let i = 0; i < 4; i++) {
            const next = pts[(i + 1) % 4];
            ctx.arcTo(pts[i].x, pts[i].y, next.x, next.y, r * 0.3);
        }
        ctx.closePath();
    } else if (worldType === 7) {
        // МИР 8 (Конфеты): Мармеладный цветок с 8 лепестками
        const petals = 8;
        for (let i = 0; i <= 64; i++) {
            const a = (i / 64) * Math.PI * 2;
            const rr = r * (0.93 + 0.08 * Math.cos(a * petals));
            const px = Math.cos(a) * rr;
            const py = Math.sin(a) * rr;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
    } else if (worldType === 3) {
        // МИР 4 (Атлантида): 5-гранный Аква-Кристалл (Пентагон)
        const pr = r * 1.06;
        const pts = [];
        for (let i = 0; i < 5; i++) {
            const a = -Math.PI / 2 + (i * Math.PI * 2) / 5;
            pts.push({ x: Math.cos(a) * pr, y: Math.sin(a) * pr });
        }
        ctx.moveTo((pts[0].x + pts[4].x) / 2, (pts[0].y + pts[4].y) / 2);
        for (let i = 0; i < 5; i++) {
            const next = pts[(i + 1) % 5];
            ctx.arcTo(pts[i].x, pts[i].y, next.x, next.y, r * 0.24);
        }
        ctx.closePath();
    } else if (worldType === 4) {
        // МИР 5 (Токио): 6-гранная Неоновая Сота (Гексагон)
        for (let i = 0; i < 6; i++) {
            const a = (i * Math.PI) / 3;
            const px = Math.cos(a) * (r * 1.04);
            const py = Math.sin(a) * (r * 1.04);
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
    } else {
        // МИР 6 (Вулкан Императора): 8-гранный Императорский Бриллиант (Октагон)
        for (let i = 0; i < 8; i++) {
            const a = (i * Math.PI) / 4 + Math.PI / 8;
            const px = Math.cos(a) * (r * 1.04);
            const py = Math.sin(a) * (r * 1.04);
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
    }
}

// 11 УНИКАЛЬНЫХ ЭФФЕКТОВ СВЕЧЕНИЯ И ГОРЕНИЯ ДЛЯ КАЖДОГО ЦВЕТА!
function drawUniqueTierAura(ctx, r, tier, pal, now, isHotTarget) {
    const colorIdx = Math.abs(tier) % 11;
    const tSec = now * 0.003;

    ctx.save();
    // Базовое мягкое свечение цвета
    ctx.fillStyle = isHotTarget ? '#fde047' : pal.color1;
    ctx.globalAlpha = isHotTarget ? 0.28 : 0.16;
    ctx.beginPath();
    ctx.arc(0, 0, r + 4.5 + Math.sin(tSec * 2) * 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.85;

    if (colorIdx === 0) {
        // 2 (Голубой): Бегущие по контуру электрические дуги
        ctx.strokeStyle = '#7dd3fc';
        ctx.lineWidth = 1.6;
        for (let k = 0; k < 3; k++) {
            const a = tSec * 2.5 + k * 2.1;
            ctx.beginPath();
            ctx.arc(0, 0, r + 3, a, a + 0.55);
            ctx.stroke();
        }
    } else if (colorIdx === 1) {
        // 4 (Изумрудный): Всплывающие неоновые био-пузырьки
        ctx.fillStyle = '#86efac';
        for (let k = 0; k < 4; k++) {
            const a = tSec * 1.6 + k * 1.57;
            const dist = r + 3 + Math.sin(tSec * 3 + k) * 2.5;
            ctx.beginPath();
            ctx.arc(Math.cos(a) * dist, Math.sin(a) * dist, 2.3, 0, Math.PI * 2);
            ctx.fill();
        }
    } else if (colorIdx === 2) {
        // 8 (Желтый): Пульсирующая солнечная корона из 8 лучей
        ctx.strokeStyle = '#fef08a';
        ctx.lineWidth = 2;
        for (let k = 0; k < 8; k++) {
            const a = tSec + (k * Math.PI) / 4;
            const len = r + 3 + ((k % 2 === 0) ? 4 : 2);
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * (r + 1), Math.sin(a) * (r + 1));
            ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len);
            ctx.stroke();
        }
    } else if (colorIdx === 3) {
        // 16 (Оранжевый): Живые языки пламени вокруг фигуры
        ctx.fillStyle = '#fb923c';
        for (let k = 0; k < 6; k++) {
            const a = -tSec * 2.2 + (k * Math.PI) / 3;
            const flameR = r + 4 + Math.sin(tSec * 5 + k) * 2.5;
            ctx.beginPath();
            ctx.arc(Math.cos(a) * flameR, Math.sin(a) * flameR, 3.2, 0, Math.PI * 2);
            ctx.fill();
        }
    } else if (colorIdx === 4) {
        // 32 (Рубиновый): Расходящийся неоновый пульс-сердцебиение
        const pulseR = r + 2 + ((now * 0.015) % 8);
        ctx.strokeStyle = '#fda4af';
        ctx.lineWidth = 2;
        ctx.globalAlpha = 1 - (((now * 0.015) % 8) / 8);
        ctx.beginPath();
        ctx.arc(0, 0, pulseR, 0, Math.PI * 2);
        ctx.stroke();
    } else if (colorIdx === 5) {
        // 64 (Фиолетовый): Вращающийся гравитационный вихрь
        ctx.strokeStyle = '#d8b4fe';
        ctx.lineWidth = 2.2;
        ctx.setLineDash([7, 5]);
        ctx.rotate(-tSec * 2);
        ctx.beginPath();
        ctx.arc(0, 0, r + 5, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
    } else if (colorIdx === 6) {
        // 128 (Бирюзовый): Сверкающие кристаллы льда на орбите
        ctx.fillStyle = '#99f6e4';
        for (let k = 0; k < 4; k++) {
            const a = tSec * 2 + (k * Math.PI) / 2;
            const cx = Math.cos(a) * (r + 5);
            const cy = Math.sin(a) * (r + 5);
            ctx.fillRect(cx - 2.5, cy - 2.5, 5, 5);
        }
    } else if (colorIdx === 7) {
        // 256 (Синий): Двойной плазменный радар-щит
        ctx.strokeStyle = '#93c5fd';
        ctx.lineWidth = 2.4;
        ctx.rotate(tSec * 2.6);
        ctx.beginPath(); ctx.arc(0, 0, r + 5, 0, Math.PI * 0.7); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, r + 5, Math.PI, Math.PI * 1.7); ctx.stroke();
    } else if (colorIdx === 8) {
        // 512 (Пурпурный): Звездные 4-конечные вспышки
        ctx.strokeStyle = '#f9a8d4';
        ctx.lineWidth = 2;
        for (let k = 0; k < 4; k++) {
            const a = -tSec * 1.5 + (k * Math.PI) / 2;
            const sx = Math.cos(a) * (r + 5);
            const sy = Math.sin(a) * (r + 5);
            ctx.beginPath();
            ctx.moveTo(sx - 4, sy); ctx.lineTo(sx + 4, sy);
            ctx.moveTo(sx, sy - 4); ctx.lineTo(sx, sy + 4);
            ctx.stroke();
        }
    } else if (colorIdx === 9) {
        // 1024 (Золотой): Королевский золотой нимб со спутниками
        ctx.strokeStyle = '#fde047';
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(0, 0, r + 5.5, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = '#ffffff';
        for (let k = 0; k < 3; k++) {
            const a = tSec * 3 + (k * Math.PI * 2) / 3;
            ctx.beginPath();
            ctx.arc(Math.cos(a) * (r + 5.5), Math.sin(a) * (r + 5.5), 3.2, 0, Math.PI * 2);
            ctx.fill();
        }
    } else {
        // 2048+ (Сверхновая): Радужная корона сверхновой!
        const hue = (now * 0.25) % 360;
        ctx.strokeStyle = `hsl(${hue}, 95%, 65%)`;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, r + 6, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
}

// ============================================================================
// СУПЕР-ЖИВЫЕ 3D-ШАРИКИ И ФИГУРКИ (6 Форм Миров + 11 Эффектов Свечения!)
// ============================================================================
// Кристальный стиль: лица выключены по умолчанию (включаются в меню или вместе с аксессуаром)
let facesOn = false;
const glowCache = {};
function hexToRgb(h) {
    const v = parseInt(h.replace('#', ''), 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}
// Готовая «капля света» для свечения: рисуется один раз и переиспользуется
function getGlowSprite(color) {
    if (glowCache[color]) return glowCache[color];
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const g = c.getContext('2d');
    const [rr, gg, bb] = hexToRgb(color);
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, `rgba(${rr},${gg},${bb},0.85)`);
    gr.addColorStop(0.38, `rgba(${rr},${gg},${bb},0.32)`);
    gr.addColorStop(1, `rgba(${rr},${gg},${bb},0)`);
    g.fillStyle = gr;
    g.fillRect(0, 0, 128, 128);
    glowCache[color] = c;
    return c;
}

function drawGlossyOrb(o, isPreview = false) {
    const pal = getOrbColors(o.tier);
    const now = performance.now();
    const shapeMode = themeIdx % WORLD_COUNT;

    if (!isPreview && o.trail && o.trail.length > 0) {
        o.trail.forEach((tr, idx) => {
            ctx.fillStyle = pal.color1;
            ctx.globalAlpha = (idx + 1) * 0.06;
            ctx.beginPath();
            ctx.arc(tr.x, tr.y, tr.r, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;
    }

    ctx.save();
    const shiverX = (o.frozen > 0) ? Math.sin(now * 0.06) * 1.5 : 0;
    const breath = isPreview ? 0 : Math.sin(o.breathPhase || 0) * 0.025;
    ctx.translate(o.x + shiverX, o.y);
    ctx.scale((o.scaleX || 1) + breath, (o.scaleY || 1) - breath);

    const r = o.radius;

    if (o.isStone) {
        const cGrad = ctx.createRadialGradient(-5, -5, 2, 0, 0, r);
        cGrad.addColorStop(0, '#64748b');
        cGrad.addColorStop(1, '#0f172a');
        ctx.fillStyle = cGrad;
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.font = '900 19px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🔒', 0, 0);
        ctx.restore();
        return;
    }

    const isCounterHint = !isPreview && rival.tele && o.tier === rival.tele.needTier - 1;
    if (o.isGolden) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.8;
        const gsz = r * 4.2;
        ctx.drawImage(getGlowSprite('#fde047'), -gsz / 2, -gsz / 2, gsz, gsz);
        ctx.restore();
        ctx.save();
        ctx.rotate(now * 0.004);
        ctx.strokeStyle = '#fde047';
        ctx.lineWidth = 3;
        ctx.setLineDash([6, 5]);
        ctx.beginPath(); ctx.arc(0, 0, r + 7, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
    }
    const isHotTarget = (!isPreview && o.tier === rival.hotOrderTier) || isCounterHint;
    const accId = o.acc !== undefined ? o.acc : equippedAcc;
    if (isCounterHint) {
        ctx.save();
        ctx.strokeStyle = '#4ade80';
        ctx.lineWidth = 3;
        ctx.globalAlpha = 0.6 + Math.sin(now * 0.015) * 0.35;
        ctx.beginPath(); ctx.arc(0, 0, r + 8, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
    }
    // Рисуем индивидуальный эффект горения для каждого из 11 цветов!
    const showFace = facesOn || accId !== 'none' || o.forceFace;
    // Неоновое свечение вокруг сферы (сложение света)
    if (!o.isBomb) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = (o.tier >= 7 ? 0.75 : 0.5) + beatPulse * 0.1;
        const gs = r * (o.tier >= 7 ? 3.8 : 3.2);
        ctx.drawImage(getGlowSprite(pal.color1), -gs / 2, -gs / 2, gs, gs);
        ctx.restore();
    }
    drawUniqueTierAura(ctx, r, o.tier, pal, now, isHotTarget);

    ctx.save();
    if (!isPreview) ctx.rotate((o.rot || 0) * 0.35);

    const grad = ctx.createRadialGradient(-r * 0.34, -r * 0.34, r * 0.06, 0, 0, r);
    if (o.isBomb) {
        grad.addColorStop(0, '#fca5a5');
        grad.addColorStop(0.4, '#dc2626');
        grad.addColorStop(1, '#1e1b4b');
    } else if (o.isChest) {
        grad.addColorStop(0, '#fef08a');
        grad.addColorStop(0.4, '#f59e0b');
        grad.addColorStop(1, '#78350f');
    } else if (o.isRainbow) {
        const hue = (now * 0.18) % 360;
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.35, `hsl(${hue}, 95%, 65%)`);
        grad.addColorStop(0.75, `hsl(${(hue + 90) % 360}, 90%, 50%)`);
        grad.addColorStop(1, `hsl(${(hue + 180) % 360}, 90%, 35%)`);
    } else {
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.24, pal.color1);
        grad.addColorStop(0.84, pal.color2);
        grad.addColorStop(1, '#090d16');
    }

    // Сатурн: задняя половина кольца планеты
    if (shapeMode === 2 && !o.isBomb) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.lineWidth = Math.max(2, r * 0.09);
        ctx.beginPath();
        ctx.ellipse(0, 0, r * 1.18, r * 0.32, -0.35, Math.PI, Math.PI * 2);
        ctx.stroke();
    }

    ctx.fillStyle = grad;
    traceWorldShapePath(ctx, r, shapeMode);
    ctx.fill();

    // Сатурн: передняя половина кольца поверх планеты
    if (shapeMode === 2 && !o.isBomb) {
        ctx.strokeStyle = pal.color1;
        ctx.lineWidth = Math.max(2.5, r * 0.1);
        ctx.beginPath();
        ctx.ellipse(0, 0, r * 1.18, r * 0.32, -0.35, 0, Math.PI);
        ctx.stroke();
    }
    // Лёд: внутренние грани кристалла
    if (shapeMode === 6) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(0, -r * 0.9); ctx.lineTo(r * 0.3, 0); ctx.lineTo(0, r * 0.9); ctx.lineTo(-r * 0.3, 0); ctx.closePath();
        ctx.stroke();
    }
    // Конфеты: сахарные крапинки
    if (shapeMode === 7) {
        for (let k = 0; k < 6; k++) {
            const a = k * 1.05 + o.tier;
            ctx.fillStyle = ['#ffffff', '#fde047', '#86efac'][k % 3];
            ctx.fillRect(Math.cos(a) * r * 0.62 - 2, Math.sin(a) * r * 0.62 - 1, 4, 2);
        }
    }

    // Огранка кристалла: светлая и тёмная грани + лучи от центральной площадки
    if (!showFace && !o.isBomb) {
        ctx.save();
        traceWorldShapePath(ctx, r, shapeMode);
        ctx.clip();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.13)';
        ctx.beginPath(); ctx.moveTo(-r, -r); ctx.lineTo(r * 0.25, -r); ctx.lineTo(-r, r * 0.25); ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(0, 0, 0, 0.16)';
        ctx.beginPath(); ctx.moveTo(r, r); ctx.lineTo(-r * 0.15, r); ctx.lineTo(r, -r * 0.15); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let k = 0; k < 8; k++) {
            const a = (k * Math.PI) / 4 + Math.PI / 8;
            const ix = Math.cos(a) * r * 0.42, iy = Math.sin(a) * r * 0.42;
            ctx.moveTo(ix, iy); ctx.lineTo(Math.cos(a) * r * 1.1, Math.sin(a) * r * 1.1);
            const a2 = a + Math.PI / 4;
            ctx.moveTo(ix, iy); ctx.lineTo(Math.cos(a2) * r * 0.42, Math.sin(a2) * r * 0.42);
        }
        ctx.stroke();
        ctx.restore();
    }

    // Внутренняя ювелирная огранка / неоновый кант по форме мира
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.24)';
    ctx.lineWidth = 1.3;
    traceWorldShapePath(ctx, r * 0.76, shapeMode);
    ctx.stroke();

    ctx.strokeStyle = o.isBomb ? '#fef08a' : (isHotTarget ? '#fde047' : 'rgba(255, 255, 255, 0.65)');
    ctx.lineWidth = Math.max(1.8, r * 0.07);
    traceWorldShapePath(ctx, r - 1, shapeMode);
    ctx.stroke();
    ctx.restore();

    // Двойной стеклянный 3D-блик сверху и снизу
    ctx.save();
    ctx.rotate(-0.45);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.48)';
    ctx.beginPath();
    ctx.ellipse(0, -r * 0.54, r * 0.44, r * 0.18, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.16)';
    ctx.beginPath();
    ctx.ellipse(0, r * 0.62, r * 0.35, r * 0.09, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // СУПЕР-ВЫРАЗИТЕЛЬНОЕ ЖИВОЕ ЛИЦО ФИГУРКИ (если лица включены)!
    if (!o.isBomb && showFace) {
        const eyeOffsetX = r * 0.28;
        const eyeOffsetY = -r * 0.16;
        const eyeR = Math.max(3.2, r * 0.13);

        const isPanicking = !isPreview && o.age > 1.2 && (o.y - r < getDangerY() + 55);
        const isSad = !isPreview && !isPanicking && (o.unmergedTime > 12);
        const isExcited = (o.exprTimer > 0 && o.expression === 'excited') || combo >= 2 || feverActiveTimer > 0;

        ctx.fillStyle = isSad ? 'rgba(56, 189, 248, 0.35)' : 'rgba(244, 63, 94, 0.38)';
        ctx.beginPath();
        ctx.ellipse(-eyeOffsetX * 1.25, eyeOffsetY + eyeR * 1.15, eyeR * 0.75, eyeR * 0.45, 0, 0, Math.PI * 2);
        ctx.ellipse(eyeOffsetX * 1.25, eyeOffsetY + eyeR * 1.15, eyeR * 0.75, eyeR * 0.45, 0, 0, Math.PI * 2);
        ctx.fill();

        [-1, 1].forEach(dir => {
            const ex = dir * eyeOffsetX + (o.lookX || 0);
            const ey = eyeOffsetY + (o.lookY || 0);

            if (isExcited) {
                ctx.strokeStyle = '#090d16';
                ctx.lineWidth = 2.4;
                ctx.beginPath();
                ctx.arc(ex, ey + 2, eyeR * 0.95, Math.PI * 1.1, Math.PI * 1.9);
                ctx.stroke();
            } else if (o.isBlinking) {
                ctx.fillStyle = '#090d16';
                ctx.fillRect(ex - eyeR, ey, eyeR * 2, 2.2);
            } else {
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(ex, ey, isPanicking ? eyeR * 1.2 : eyeR, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#090d16';
                ctx.beginPath();
                ctx.arc(ex + (o.lookX || 0) * 0.25, ey + (o.lookY || 0) * 0.25, eyeR * 0.72, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(ex - eyeR * 0.28, ey - eyeR * 0.28, eyeR * 0.36, 0, Math.PI * 2);
                ctx.arc(ex + eyeR * 0.25, ey + eyeR * 0.25, eyeR * 0.16, 0, Math.PI * 2);
                ctx.fill();

                if (isSad) {
                    ctx.strokeStyle = '#090d16';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(ex - eyeR, ey - eyeR - (dir < 0 ? 0 : 3));
                    ctx.lineTo(ex + eyeR, ey - eyeR - (dir < 0 ? 3 : 0));
                    ctx.stroke();
                }
            }
        });

        if (o.tier >= 4 && o.tier <= 6 && !isSad && !isPanicking && accId === 'none' && facesOn) {
            ctx.strokeStyle = '#fde047';
            ctx.lineWidth = 1.6;
            ctx.strokeRect(-eyeOffsetX - eyeR * 1.1, eyeOffsetY - eyeR * 0.9, eyeR * 2.2, eyeR * 1.7);
            ctx.strokeRect(eyeOffsetX - eyeR * 1.1, eyeOffsetY - eyeR * 0.9, eyeR * 2.2, eyeR * 1.7);
        }

        if (isSad) {
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.arc(eyeOffsetX + eyeR * 1.1, eyeOffsetY + eyeR * 1.4, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.strokeStyle = '#090d16';
        ctx.fillStyle = '#090d16';
        ctx.lineWidth = Math.max(1.8, r * 0.06);
        ctx.lineCap = 'round';
        ctx.beginPath();

        if (o.frozen > 0) {
            ctx.moveTo(-r * 0.14, eyeOffsetY + r * 0.17);
            ctx.lineTo(r * 0.14, eyeOffsetY + r * 0.17);
            ctx.stroke();
        } else if (isPanicking) {
            ctx.arc(0, eyeOffsetY + r * 0.18, r * 0.09, 0, Math.PI * 2);
            ctx.fill();
        } else if (isSad) {
            ctx.arc(0, eyeOffsetY + r * 0.25, r * 0.11, Math.PI * 1.2, Math.PI * 1.8);
            ctx.stroke();
        } else if (isExcited) {
            ctx.arc(0, eyeOffsetY + r * 0.08, r * 0.15, 0, Math.PI);
            ctx.fill();
            ctx.fillStyle = '#f43f5e';
            ctx.beginPath();
            ctx.arc(0, eyeOffsetY + r * 0.16, r * 0.07, 0, Math.PI);
            ctx.fill();
        } else {
            ctx.arc(o.lookX || 0, eyeOffsetY + r * 0.09, r * 0.12, 0.15 * Math.PI, 0.85 * Math.PI);
            ctx.stroke();
        }
    }

    if (!o.isBomb && accId !== 'none') drawAccessory(accId, r, -r * 0.16, r * 0.28);

    if (o.tier >= 5 && !o.isBomb && accId === 'none' && showFace) {
        ctx.save();
        ctx.translate(0, -r + 2);
        ctx.fillStyle = '#fbbf24';
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-r * 0.35, 0);
        ctx.lineTo(-r * 0.42, -r * 0.28);
        ctx.lineTo(-r * 0.15, -r * 0.12);
        ctx.lineTo(0, -r * 0.34);
        ctx.lineTo(r * 0.15, -r * 0.12);
        ctx.lineTo(r * 0.42, -r * 0.28);
        ctx.lineTo(r * 0.35, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
    }

    // Крупные сферы (512+) искрятся вращающимися бликами
    if (o.tier >= 8 && !o.isBomb) {
        ctx.save();
        ctx.rotate(now * 0.0015);
        ctx.fillStyle = '#ffffff';
        for (let k = 0; k < 4; k++) {
            const a = (k * Math.PI) / 2;
            const sx = Math.cos(a) * r * 0.78, sy = Math.sin(a) * r * 0.78;
            const s = 2.5 + Math.sin(now * 0.008 + k) * 1.5;
            ctx.beginPath();
            ctx.moveTo(sx, sy - s * 2); ctx.lineTo(sx + s * 0.6, sy); ctx.lineTo(sx, sy + s * 2); ctx.lineTo(sx - s * 0.6, sy);
            ctx.closePath(); ctx.fill();
        }
        ctx.restore();
    }

    const label = o.isBomb ? '💣' : (o.isChest ? '🎁' : (o.isRainbow ? '★' : formatOrbNumber(o.tier)));
    // Без лица число крупное и по центру, с тёмной обводкой
    const ly = showFace ? r * 0.36 : 0;
    const fontSize = Math.max(10, Math.floor(r * (label.length >= 4 ? (showFace ? 0.42 : 0.5) : (showFace ? 0.52 : 0.68))));
    ctx.font = `900 ${fontSize}px 'Segoe UI', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (!showFace) {
        ctx.lineWidth = Math.max(2.5, fontSize * 0.16);
        ctx.strokeStyle = 'rgba(9, 13, 22, 0.75)';
        ctx.lineJoin = 'round';
        ctx.strokeText(label, 0, ly);
    } else {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.72)';
        ctx.fillText(label, 0, ly + 2);
    }
    ctx.fillStyle = '#ffffff';
    ctx.fillText(label, 0, ly);

    if (o.frozen > 0) {
        ctx.fillStyle = 'rgba(56, 189, 248, 0.42)';
        ctx.strokeStyle = '#bae6fd';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.roundRect(-r - 2, -r - 2, (r + 2) * 2, (r + 2) * 2, 10);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = '900 10px sans-serif';
        ctx.fillText(`❄️x${o.frozen}`, 0, -r + 8);
    }

    ctx.restore();
}

// ПРОКАЧАННЫЕ АНИМИРОВАННЫЕ БОССЫ С ЭМОЦИЯМИ, АТРИБУТАМИ И АУРОЙ ЯРОСТИ!
function drawUniqueWorldRivalAvatar(ctx, mode, now, isFlashing) {
    const isEnraged = rival.enraged;

    // Багровая пульсирующая аура в Фазе Ярости (<35% HP)
    if (isEnraged) {
        ctx.fillStyle = 'rgba(244, 63, 94, 0.35)';
        ctx.beginPath();
        ctx.arc(0, 0, 24 + Math.sin(now * 0.02) * 3, 0, Math.PI * 2);
        ctx.fill();
    }

    if (mode === 0) {
        // DJ НЕОН: Пульсирующие наушники + живой эквалайзер на визоре
        ctx.strokeStyle = '#ec4899';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(0, 0, 22, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
        ctx.fillStyle = '#38bdf8';
        const earPulse = beatPulse * 2.5;
        ctx.fillRect(-25 - earPulse, -7, 7, 15);
        ctx.fillRect(18 + earPulse, -7, 7, 15);
        ctx.fillStyle = isEnraged ? '#ef4444' : '#f59e0b';
        ctx.beginPath(); ctx.arc(0, 0, 18.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#090d16';
        ctx.beginPath(); ctx.roundRect(-15, -8, 30, 11, 4); ctx.fill();
        // Бегущий эквалайзер в очках DJ Неона
        for (let b = 0; b < 5; b++) {
            const bh = 3 + ((Math.floor(now / 80) + b) % 5);
            ctx.fillStyle = b % 2 === 0 ? '#38bdf8' : '#ec4899';
            ctx.fillRect(-11 + b * 5, -1 - bh, 3.5, bh + 2);
        }
    } else if (mode === 1) {
        // ЛЕДИ ВЕГАС: Парящие золотые карты за спиной + бриллиантовая корона
        ctx.fillStyle = '#fde047';
        ctx.fillRect(-24, -10, 8, 12);
        ctx.fillRect(16, -10, 8, 12);
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.moveTo(-14, -12); ctx.lineTo(-19, -27); ctx.lineTo(-6, -17);
        ctx.lineTo(0, -29); ctx.lineTo(6, -17); ctx.lineTo(19, -27); ctx.lineTo(14, -12);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = isEnraged ? '#dc2626' : '#f43f5e';
        ctx.beginPath(); ctx.arc(0, 0, 18.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fef08a';
        ctx.beginPath(); ctx.arc(-7, -3, 5, 0, Math.PI * 2); ctx.arc(7, -3, 5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#090d16';
        ctx.beginPath(); ctx.arc(-7, -3, 2.2, 0, Math.PI * 2); ctx.arc(7, -3, 2.2, 0, Math.PI * 2); ctx.fill();
    } else if (mode === 2) {
        // КИБОРГ ОРИОН: Механические антенны, броня и бегающий лазерный прицел
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(-12, -15); ctx.lineTo(-20, -27); ctx.moveTo(12, -15); ctx.lineTo(20, -27); ctx.stroke();
        ctx.fillStyle = '#f43f5e';
        ctx.beginPath(); ctx.arc(-20, -27, 3, 0, Math.PI * 2); ctx.arc(20, -27, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = isEnraged ? '#991b1b' : '#6366f1';
        ctx.beginPath(); ctx.arc(0, 0, 18.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#090d16';
        ctx.beginPath(); ctx.roundRect(-15, -8, 30, 12, 5); ctx.fill();
        const scanX = Math.sin(now * 0.01) * 9;
        ctx.fillStyle = '#f43f5e';
        ctx.beginPath(); ctx.arc(scanX, -2, 4.5, 0, Math.PI * 2); ctx.fill();
    } else if (mode === 3) {
        // ЦАРЬ ПОСЕЙДОН: Золотой трезубец, морская корона и светящиеся глаза
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-11, -15); ctx.lineTo(-13, -27);
        ctx.moveTo(0, -16);   ctx.lineTo(0, -30);
        ctx.moveTo(11, -15);  ctx.lineTo(13, -27);
        ctx.stroke();
        ctx.fillStyle = isEnraged ? '#be123c' : '#0d9488';
        ctx.beginPath(); ctx.arc(0, 0, 18.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ccfbf1';
        ctx.beginPath(); ctx.arc(-7, -3, 4.5, 0, Math.PI * 2); ctx.arc(7, -3, 4.5, 0, Math.PI * 2); ctx.fill();
    } else if (mode === 4) {
        // СЁГУН ДРИФТА: Скрещенные неоновые катаны за спиной и самурайский шлем
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-22, -22); ctx.lineTo(22, 16);
        ctx.moveTo(22, -22);  ctx.lineTo(-22, 16);
        ctx.stroke();
        ctx.strokeStyle = '#f43f5e';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(-8, -14); ctx.lineTo(-22, -26);
        ctx.moveTo(8, -14);  ctx.lineTo(22, -26);
        ctx.stroke();
        ctx.fillStyle = '#1e1b4b';
        ctx.strokeStyle = isEnraged ? '#fde047' : '#f43f5e';
        ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.arc(0, 0, 18.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#fde047';
        ctx.beginPath();
        ctx.moveTo(-12, -5); ctx.lineTo(-3, -1); ctx.lineTo(-12, 2);
        ctx.moveTo(12, -5);  ctx.lineTo(3, -1);  ctx.lineTo(12, 2);
        ctx.fill();
    } else if (mode === 6) {
        // СНЕЖНАЯ КОРОЛЕВА: ледяная корона-кристаллы и мерцающий иней
        ctx.fillStyle = '#e0f2fe';
        for (let k = -2; k <= 2; k++) {
            const h = 14 + (2 - Math.abs(k)) * 6;
            ctx.beginPath();
            ctx.moveTo(k * 7 - 4, -14); ctx.lineTo(k * 7, -14 - h); ctx.lineTo(k * 7 + 4, -14);
            ctx.closePath(); ctx.fill();
        }
        ctx.fillStyle = isEnraged ? '#7f1d1d' : '#0ea5e9';
        ctx.strokeStyle = '#e0f2fe';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, 18.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(-7, -3, 4.3, 0, Math.PI * 2); ctx.arc(7, -3, 4.3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#1e3a8a';
        ctx.beginPath(); ctx.arc(-7, -3, 2, 0, Math.PI * 2); ctx.arc(7, -3, 2, 0, Math.PI * 2); ctx.fill();
        for (let k = 0; k < 3; k++) {
            const a = now * 0.003 + k * 2.1;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(Math.cos(a) * 25 - 1.5, Math.sin(a) * 25 - 1.5, 3, 3);
        }
    } else if (mode === 7) {
        // БАРОН ЛЕДЕНЕЦ: цилиндр-леденец, усы и вращающаяся конфета
        ctx.fillStyle = '#1e1b4b';
        ctx.fillRect(-11, -34, 22, 20);
        ctx.fillRect(-17, -16, 34, 4);
        ctx.fillStyle = '#f43f5e';
        ctx.fillRect(-11, -22, 22, 4);
        ctx.fillStyle = isEnraged ? '#be123c' : '#f9a8d4';
        ctx.beginPath(); ctx.arc(0, 0, 18.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(-7, -4, 4.5, 0, Math.PI * 2); ctx.arc(7, -4, 4.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#090d16';
        ctx.beginPath(); ctx.arc(-7, -4, 2.2, 0, Math.PI * 2); ctx.arc(7, -4, 2.2, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#090d16';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-10, 4); ctx.quadraticCurveTo(-4, 1, 0, 3); ctx.quadraticCurveTo(4, 1, 10, 4); ctx.stroke();
        ctx.save();
        ctx.translate(23, 10);
        ctx.rotate(now * 0.006);
        ctx.fillStyle = '#facc15';
        ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#f43f5e';
        ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, Math.PI * 1.5); ctx.stroke();
        ctx.restore();
    } else {
        // ДРАКОН ИМПЕРИИ: Огненные крылья, золотые рога и пылающий взор
        const wingFlap = Math.sin(now * 0.012) * 4;
        ctx.fillStyle = '#f97316';
        ctx.beginPath();
        ctx.moveTo(-16, 0); ctx.lineTo(-28, -12 + wingFlap); ctx.lineTo(-24, 10); ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(16, 0);  ctx.lineTo(28, -12 + wingFlap);  ctx.lineTo(24, 10);  ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.moveTo(-12, -12); ctx.lineTo(-22, -28); ctx.lineTo(-4, -16);
        ctx.moveTo(12, -12);  ctx.lineTo(22, -28);  ctx.lineTo(4, -16);
        ctx.fill();
        ctx.fillStyle = '#b91c1c';
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(0, 0, 18.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#fef08a';
        ctx.beginPath(); ctx.arc(-7, -3, 4.8, 0, Math.PI * 2); ctx.arc(7, -3, 4.8, 0, Math.PI * 2); ctx.fill();
    }

    // Мимика рта Босса (Контузия при ударе, Оскал в ярости, Коварная ухмылка)
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    if (isFlashing) {
        ctx.arc(0, 7, 4.5, 0, Math.PI * 2);
    } else if (isEnraged) {
        ctx.moveTo(-7, 8); ctx.lineTo(-3, 5); ctx.lineTo(0, 8); ctx.lineTo(3, 5); ctx.lineTo(7, 8);
    } else {
        ctx.arc(0, 5, 6.5, 0.15 * Math.PI, 0.85 * Math.PI);
    }
    ctx.stroke();
}

function drawRivalBossPanel(t, now) {
    const mode = themeIdx % WORLD_COUNT;
    ctx.save();
    const bounceY = Math.sin(now * 0.005) * 2.5;
    ctx.translate(148 + rival.shakeX, 85 + bounceY);
    ctx.scale(rival.hitScale, rival.hitScale);
    ctx.translate(-148, -85);

    const isFlashing = rival.flashTimer > 0;
    drawRoundedPanel(14, 48, 274, 72, 16,
        isFlashing ? 'rgba(59, 130, 246, 0.85)' : 'rgba(15, 23, 42, 0.94)',
        rival.shieldActive ? '#38bdf8' : (isFlashing ? '#fef08a' : '#f43f5e'));

    const rx = 52;
    const ry = 88;
    ctx.save();
    // Замах перед атакой: босс дрожит и светится красным
    const teleShake = rival.tele ? Math.sin(now * 0.06) * (2 + (1 - rival.tele.t / rival.tele.total) * 3) : 0;
    ctx.translate(rx + teleShake, ry);
    if (rival.tele) {
        ctx.fillStyle = `rgba(239, 68, 68, ${0.35 + Math.sin(now * 0.02) * 0.2})`;
        ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI * 2); ctx.fill();
    }
    ctx.scale(1.45, 1.45);
    drawUniqueWorldRivalAvatar(ctx, mode, now, isFlashing);

    // Оглушён: глаза-крестики и звёздочки над головой
    if (rival.stunTimer > 0) {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.2;
        [-7, 7].forEach(ex => {
            ctx.beginPath();
            ctx.moveTo(ex - 3.5, -6.5); ctx.lineTo(ex + 3.5, 0.5);
            ctx.moveTo(ex + 3.5, -6.5); ctx.lineTo(ex - 3.5, 0.5);
            ctx.stroke();
        });
        ctx.font = '9px sans-serif';
        ctx.textAlign = 'center';
        for (let k = 0; k < 3; k++) {
            const a = now * 0.006 + k * 2.09;
            ctx.fillText('⭐', Math.cos(a) * 16, -24 + Math.sin(a) * 5);
        }
    }

    if (rival.shieldActive) {
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        ctx.setLineDash([5, 4]);
        ctx.beginPath();
        ctx.arc(0, 0, 24, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
    }
    ctx.restore();

    const rName = rival.isFinal ? L('👑 ИМПЕРАТОР НОЧИ', '👑 NIGHT EMPEROR') : t.rivalNames[mode].split(' (')[0];
    ctx.fillStyle = '#fef08a';
    ctx.font = '900 12.5px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`${t.lvlShort}${currentLevel} · ${rName}`, 98, 66);

    const hotStr = formatOrbNumber(rival.hotOrderTier);
    ctx.fillStyle = rival.shieldActive ? '#38bdf8' : '#4ade80';
    ctx.font = '900 11px sans-serif';
    ctx.fillText(
        rival.shieldActive ? '🛡️ x2 COMBO!' : `🔥 x2.5: ${hotStr}`,
        98, 83
    );

    const hpRatio = Math.max(0, Math.min(1, rival.hp / rival.maxHp));
    ctx.fillStyle = '#090d16';
    ctx.beginPath();
    ctx.roundRect(98, 90, 182, 20, 8);
    ctx.fill();

    const hpGrad = ctx.createLinearGradient(98, 90, 280, 90);
    hpGrad.addColorStop(0, '#ef4444');
    hpGrad.addColorStop(0.5, '#f97316');
    hpGrad.addColorStop(1, '#fbbf24');
    ctx.fillStyle = hpGrad;
    if (hpRatio > 0) {
        ctx.beginPath();
        ctx.roundRect(98, 90, Math.max(8, Math.floor(182 * hpRatio)), 20, 8);
        ctx.fill();
        // Блик на полоске HP
        ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.fillRect(102, 92, Math.max(0, Math.floor(182 * hpRatio) - 8), 5);
    }

    ctx.fillStyle = '#ffffff';
    ctx.font = '900 11.5px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`${Math.ceil(rival.hp).toLocaleString('ru-RU')} HP`, 189, 104.5);

    ctx.restore();

    // Всплывающие цифры урона у полоски HP
    bossDmgPops.forEach(p => {
        ctx.save();
        ctx.globalAlpha = Math.min(1, p.life * 2);
        ctx.font = `900 ${p.big ? 17 : 13}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillStyle = '#090d16';
        ctx.fillText(p.txt, p.x + 1.5, p.y + 1.5);
        ctx.fillStyle = p.big ? '#fde047' : '#ffffff';
        ctx.fillText(p.txt, p.x, p.y);
        ctx.restore();
    });

    if (rival.beamTimer > 0) {
        ctx.save();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(45, 85);
        ctx.lineTo(rival.beamX, rival.beamY);
        ctx.stroke();
        ctx.restore();
    }
}

function renderScene(dt, now) {
    const t = I18N[currentLang];

    ctx.save();
    ctx.fillStyle = '#04020a';
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    // 1. ЖИВОЙ МИР НА ФОНЕ — растянут на весь экран, без чёрных полос
    ctx.save();
    const coverScale = Math.max(window.innerWidth / VW, window.innerHeight / VH);
    ctx.translate((window.innerWidth - VW * coverScale) / 2, (window.innerHeight - VH * coverScale) / 2);
    ctx.scale(coverScale, coverScale);
    drawSixDistinctWorlds(now, dt);
    ctx.restore();
    // Затемнение по краям — глубина и фокус на стакане
    const vg = ctx.createRadialGradient(window.innerWidth / 2, window.innerHeight * 0.55, Math.min(window.innerWidth, window.innerHeight) * 0.3,
        window.innerWidth / 2, window.innerHeight * 0.55, Math.max(window.innerWidth, window.innerHeight) * 0.8);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    ctx.translate(offsetX + jarShakeX, offsetY + jarShakeY);
    ctx.scale(scale, scale);

    // 2. ЕСЛИ МЫ В ГЛАВНОМ МЕНЮ ЗАПУСКА — РИСУЕМ КРАСИВОЕ ГЛАВНОЕ МЕНЮ!
    if (inStartMenu) {
        renderMainMenuScreen(t, now);
        if (leaderboardModalOpen) renderLeaderboardModal(t, now);
        if (dailyModalOpen) renderDailyLoginModal(t, now);
        if (empireModalOpen) renderCityModal(t, now);
        if (upgModalOpen) renderMetaUpgradesModal(t, now);
        if (wheelModalOpen) renderLuckyWheelModal(t, now);
        if (collectionModalOpen) renderCollectionModal(t, now);
        if (questsModalOpen) renderQuestsModal(t, now);
        if (chestModal.open) renderChestModal(t, now);
        if (adConfirm.open) renderAdConfirmModal(t, now);
        confetti.forEach(c => {
            ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
            ctx.fillStyle = c.color; ctx.globalAlpha = Math.min(1, c.life);
            ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h); ctx.restore();
        });
        ctx.restore();
        return;
    }

    // 3. ВЕРХНИЙ БАНК В БОЮ + КНОПКИ (МЕНЮ, КОЛЕСО, ДЕНЬ 7, БАЗА, МИР)
    drawRoundedPanel(UI_BTN.homeTop.x, UI_BTN.homeTop.y, UI_BTN.homeTop.w, UI_BTN.homeTop.h, 12, 'rgba(30, 41, 59, 0.92)', '#94a3b8');
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(t.topMenuBtn, UI_BTN.homeTop.x + UI_BTN.homeTop.w / 2, UI_BTN.homeTop.y + 25);

    ctx.save();
    ctx.translate(170, 26);
    ctx.scale(hudBounceScale, hudBounceScale);
    ctx.translate(-170, -26);
    drawRoundedPanel(92, 6, 160, 40, 12, 'rgba(15, 23, 42, 0.92)', '#fbbf24');
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 17px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`${score.toLocaleString('ru-RU')}`, 102, 32);
    ctx.fillStyle = '#fbbf24';
    ctx.font = '900 12px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(`⭐${stars}`, 244, 31);
    ctx.restore();

    drawRoundedPanel(UI_BTN.music.x, UI_BTN.music.y, UI_BTN.music.w, UI_BTN.music.h, 12,
        musicEnabled ? 'rgba(16, 185, 129, 0.4)' : 'rgba(30, 41, 59, 0.85)',
        musicEnabled ? '#10b981' : '#475569');
    ctx.font = '900 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(musicEnabled ? '🎵' : '🚫', UI_BTN.music.x + UI_BTN.music.w / 2, UI_BTN.music.y + 27);

    drawRoundedPanel(UI_BTN.sfx.x, UI_BTN.sfx.y, UI_BTN.sfx.w, UI_BTN.sfx.h, 12,
        soundEnabled ? 'rgba(16, 185, 129, 0.4)' : 'rgba(30, 41, 59, 0.85)',
        soundEnabled ? '#10b981' : '#475569');
    ctx.fillText(soundEnabled ? '🔊' : '🔇', UI_BTN.sfx.x + UI_BTN.sfx.w / 2, UI_BTN.sfx.y + 27);

    drawRoundedPanel(UI_BTN.lang.x, UI_BTN.lang.y, UI_BTN.lang.w, UI_BTN.lang.h, 12, 'rgba(59, 130, 246, 0.4)', '#60a5fa');
    ctx.font = '900 12px sans-serif';
    ctx.fillText(currentLang.toUpperCase(), UI_BTN.lang.x + UI_BTN.lang.w / 2, UI_BTN.lang.y + 25);

    // 4. БОСС МИРА + СЛЕДУЮЩАЯ СФЕРА + ПОДАРОК
    drawRivalBossPanel(t, now);
    drawNextAndGiftPanel(t, now);

    // 5. ПРИЦЕЛ И СФЕРА В РУКЕ
    const anyModal = wheelModalOpen || dailyModalOpen || leaderboardModalOpen || empireModalOpen || stageWinModalOpen || upgModalOpen || pickerModalOpen || isGameOver || adConfirm.open;
    if (!anyModal && !hammerMode && koTimer <= 0) {
        ctx.save();
        ctx.strokeStyle = aiming ? 'rgba(253, 224, 71, 0.95)' : 'rgba(56, 189, 248, 0.5)';
        ctx.lineWidth = aiming ? 3.5 : 2.5;
        ctx.setLineDash([7, 7]);
        ctx.lineDashOffset = -(now * 0.04) % 14;
        ctx.beginPath();
        ctx.moveTo(aimX, 174);
        ctx.lineTo(aimX, JAR.y + JAR.h - 15);
        ctx.stroke();
        ctx.restore();

        drawGlossyOrb({
            x: aimX,
            y: 172,
            radius: getOrbRadius(currentOrbTier),
            tier: currentOrbTier,
            isRainbow: isRainbowCurrent,
            isBomb: isBombCurrent,
            isGolden: goldenCurrent,
            scaleX: 1, scaleY: 1,
            lookX: 0, lookY: 3
        }, true);
    }

    // 6. ЛЕТАЮЩИЙ ДРОН
    if (flyingDrone.active && !anyModal) {
        ctx.save();
        ctx.translate(flyingDrone.x, flyingDrone.y);
        const flash = Math.sin(now * 0.025) > 0;
        ctx.fillStyle = flash ? '#fbbf24' : '#f43f5e';
        ctx.beginPath();
        ctx.arc(0, 0, 22, 0, Math.PI * 2);
        ctx.fill();

        ctx.font = '900 21px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🛸', 0, 0);

        ctx.fillStyle = '#090d16';
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(-50, -36, 100, 16, 6);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#fef08a';
        ctx.font = '900 8.5px sans-serif';
        ctx.fillText(t.catchDrone, 0, -28);
        ctx.restore();
    }

    if (hammerMode) {
        drawRoundedPanel(25, 148, 430, 36, 14, 'rgba(225, 29, 72, 0.95)', '#fbbf24');
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(t.laserMode, VW / 2, 170);
    }

    // 7. 3D КИБЕР-СТАКАН + ПОДВИЖНЫЕ ПИНБОЛ-БАМПЕРЫ ⚡
    ctx.save();
    const jarGrad = ctx.createLinearGradient(JAR.x, JAR.y, JAR.x + JAR.w, JAR.y + JAR.h);
    jarGrad.addColorStop(0, 'rgba(15, 23, 42, 0.55)');
    jarGrad.addColorStop(0.5, 'rgba(9, 14, 28, 0.7)');
    jarGrad.addColorStop(1, 'rgba(6, 10, 20, 0.86)');
    ctx.fillStyle = jarGrad;
    ctx.beginPath();
    ctx.roundRect(JAR.x, JAR.y, JAR.w, JAR.h, [0, 0, 28, 28]);
    ctx.fill();

    const barW = (JAR.w - 20) / 16;
    for (let i = 0; i < 16; i++) {
        const bh = eqBars[i] * 185;
        const bx = JAR.x + 10 + i * barW;
        const by = JAR.y + JAR.h - bh;
        ctx.fillStyle = '#fbbf24';
        ctx.globalAlpha = 0.13;
        ctx.beginPath();
        ctx.roundRect(bx + 2, by, barW - 4, bh, [6, 6, 0, 0]);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ШКАЛА КЛУБНОГО КУРАЖА (FEVER MODE Х2) НАД СТАКАНОМ
    ctx.save();
    const fRatio = feverActiveTimer > 0 ? (feverActiveTimer / 8.0) : (feverMeter / 100);
    const hasGoal = rival.type === 'drops' || rival.type === 'timer';
    const fW = hasGoal ? JAR.w - 122 : JAR.w;
    ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
    ctx.strokeStyle = feverActiveTimer > 0 ? '#fde047' : '#475569';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(JAR.x, 125, fW, 17, 8);
    ctx.fill();
    ctx.stroke();

    if (fRatio > 0) {
        const fGrad = ctx.createLinearGradient(JAR.x, 125, JAR.x + fW, 125);
        fGrad.addColorStop(0, '#ec4899');
        fGrad.addColorStop(0.5, '#f97316');
        fGrad.addColorStop(1, '#fde047');
        ctx.fillStyle = fGrad;
        ctx.beginPath();
        ctx.roundRect(JAR.x + 2, 127, Math.max(10, (fW - 4) * fRatio), 13, 6);
        ctx.fill();
    }
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 9.5px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(
        feverActiveTimer > 0 ? `${t.FeverActiveLabel} ${feverActiveTimer.toFixed(1)}${t.sec} ${t.feverX2}` : `${t.FeverBarLabel} ${Math.floor(feverMeter)}%`,
        JAR.x + fW / 2, 136
    );
    // Счётчик цели уровня: броски или время
    if (hasGoal) {
        const low = rival.type === 'drops' ? rival.dropsLeft <= 10 : rival.timeLeft <= 15;
        const pulse = low ? 1 + Math.sin(now * 0.02) * 0.06 : 1;
        ctx.save();
        ctx.translate(JAR.x + fW + 61, 133);
        ctx.scale(pulse, pulse);
        drawRoundedPanel(-56, -12, 112, 24, 10, low ? 'rgba(185, 28, 28, 0.95)' : 'rgba(15, 23, 42, 0.92)', low ? '#fca5a5' : '#fde047');
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 13px sans-serif';
        ctx.textAlign = 'center';
        const tl = Math.ceil(rival.timeLeft);
        ctx.fillText(rival.type === 'drops' ? `🎯 ${t.goalDrops}: ${rival.dropsLeft}` : `⏱️ ${Math.floor(tl / 60)}:${String(tl % 60).padStart(2, '0')}`, 0, 5);
        ctx.restore();
    }
    ctx.restore();

    // УНИКАЛЬНЫЕ ИНТЕРАКТИВНЫЕ СВИСТОПЛЮШКИ В ЦЕНТРЕ КАЖДОЙ ЛОКАЦИИ
    const wMode = themeIdx % WORLD_COUNT;
    const worldBumperIcons = ['⚡', '🎲', '🪐', '🐚', '🏎️', '🐉', '❄️', '🍬'];
    const worldBumperCols = ['#0284c7', '#b45309', '#6d28d9', '#0d9488', '#be123c', '#991b1b', '#0369a1', '#db2777'];
    const worldBumperStrokes = ['#38bdf8', '#fde047', '#c084fc', '#2dd4bf', '#f43f5e', '#fbbf24', '#e0f2fe', '#fde68a'];

    ctx.save();
    ctx.translate(VW / 2, JAR.y + 215);
    ctx.globalAlpha = 0.28 + Math.sin(now * 0.004) * 0.08;
    ctx.rotate(now * 0.0012);
    ctx.strokeStyle = worldBumperStrokes[wMode];
    ctx.lineWidth = 2.5;
    ctx.setLineDash([8, 6]);
    ctx.beginPath();
    ctx.arc(0, 0, 44, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.rotate(-now * 0.0012);
    ctx.font = '900 22px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(worldBumperIcons[wMode], 0, 0);
    ctx.restore();

    PINBALL_BUMPERS.forEach(bmp => {
        ctx.save();
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.28)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(bmp.x, bmp.baseY - 82);
        ctx.lineTo(bmp.x, bmp.baseY + 82);
        ctx.stroke();

        ctx.fillStyle = bmp.glowTimer > 0 ? '#fef08a' : worldBumperCols[wMode];
        ctx.strokeStyle = worldBumperStrokes[wMode];
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(bmp.x, bmp.y, bmp.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = '900 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(worldBumperIcons[wMode], bmp.x, bmp.y);
        ctx.restore();
    });

    const floorGlow = 0.25 + floorLaserEffect * 0.75;
    ctx.strokeStyle = `rgba(244, 63, 94, ${floorGlow})`;
    ctx.lineWidth = 3 + floorLaserEffect * 5;
    ctx.beginPath();
    ctx.moveTo(JAR.x + 18, JAR.y + JAR.h - 6);
    ctx.lineTo(JAR.x + JAR.w - 18, JAR.y + JAR.h - 6);
    ctx.stroke();

    const dY = getDangerY();
    // Лава: светящаяся раскалённая полоса над стаканом
    if (lavaTimer > 0) {
        const lg = ctx.createLinearGradient(0, JAR.y, 0, dY);
        lg.addColorStop(0, 'rgba(249, 115, 22, 0.05)');
        lg.addColorStop(1, `rgba(239, 68, 68, ${0.28 + Math.sin(now * 0.01) * 0.08})`);
        ctx.fillStyle = lg;
        ctx.fillRect(JAR.x + JAR.wall, JAR.y, JAR.w - JAR.wall * 2, dY - JAR.y);
        ctx.fillStyle = '#fdba74';
        ctx.font = '900 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`${t.lavaWarn} ${lavaTimer.toFixed(1)}${t.sec}`, VW / 2, dY - 10);
    }
    const dangerAlpha = dangerTimer > 0 ? (0.5 + Math.sin(now * 0.02) * 0.45) : 0.3;
    ctx.strokeStyle = lavaTimer > 0 ? '#f97316' : `rgba(244, 63, 94, ${dangerAlpha})`;
    ctx.lineWidth = dangerTimer > 0 || lavaTimer > 0 ? 3.5 : 2;
    ctx.setLineDash([10, 8]);
    ctx.beginPath();
    ctx.moveTo(JAR.x + 10, dY);
    ctx.lineTo(JAR.x + JAR.w - 10, dY);
    ctx.stroke();
    ctx.setLineDash([]);

    if (dangerTimer > 0.1) {
        ctx.fillStyle = '#f43f5e';
        ctx.font = '900 15px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`${t.overflowWarn} ${Math.max(0, BALANCE.dangerSeconds - dangerTimer).toFixed(1)}${t.sec}`, VW / 2, dY + 22);
    }
    ctx.restore();

    // Лучи-вспышки за крупными слияниями
    burstRays.forEach(br => {
        ctx.save();
        ctx.translate(br.x, br.y);
        ctx.rotate(now * 0.002);
        ctx.globalAlpha = Math.min(0.55, br.life * 0.7);
        ctx.fillStyle = br.color;
        const len = 140 + (1 - Math.min(1, br.life)) * 90;
        for (let k = 0; k < 12; k++) {
            ctx.rotate(Math.PI / 6);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(len, -10);
            ctx.lineTo(len, 10);
            ctx.closePath();
            ctx.fill();
        }
        ctx.restore();
    });

    laserLinkBeams.forEach(lb => {
        ctx.save();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 6 * lb.life;
        ctx.beginPath();
        ctx.moveTo(lb.ax, lb.ay);
        ctx.lineTo(lb.bx, lb.by);
        ctx.stroke();
        ctx.restore();
    });

    orbs.forEach(o => drawGlossyOrb(o, false));

    ctx.save();
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = JAR.wall;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(JAR.x + JAR.wall / 2, JAR.y);
    ctx.lineTo(JAR.x + JAR.wall / 2, JAR.y + JAR.h - 24);
    ctx.arcTo(JAR.x + JAR.wall / 2, JAR.y + JAR.h - JAR.wall / 2, JAR.x + 30, JAR.y + JAR.h - JAR.wall / 2, 24);
    ctx.lineTo(JAR.x + JAR.w - 30, JAR.y + JAR.h - JAR.wall / 2);
    ctx.arcTo(JAR.x + JAR.w - JAR.wall / 2, JAR.y + JAR.h - JAR.wall / 2, JAR.x + JAR.w - JAR.wall / 2, JAR.y + JAR.h - 24, 24);
    ctx.lineTo(JAR.x + JAR.w - JAR.wall / 2, JAR.y);
    ctx.stroke();

    wallRipples.forEach(wr => {
        ctx.strokeStyle = wr.col;
        ctx.lineWidth = 4;
        ctx.globalAlpha = wr.life * 2.5;
        ctx.beginPath();
        ctx.moveTo(wr.x, wr.y - 25);
        ctx.lineTo(wr.x, wr.y + 25);
        ctx.stroke();
    });
    ctx.globalAlpha = 1;

    const bulbStep = Math.floor(now / 100);
    for (let b = 0; b < 12; b++) {
        const by = JAR.y + 22 + b * 39;
        const isLit = (b + bulbStep) % 2 === 0;
        ctx.fillStyle = isLit ? '#fef08a' : '#ec4899';
        ctx.beginPath();
        ctx.arc(JAR.x + 4.5, by, 3.8, 0, Math.PI * 2);
        ctx.arc(JAR.x + JAR.w - 4.5, by, 3.8, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();

    vaultMissiles.forEach(vm => {
        ctx.fillStyle = vm.color;
        ctx.beginPath();
        ctx.arc(vm.x, vm.y, 7.5, 0, Math.PI * 2);
        ctx.fill();
    });

    if (milestoneOverlay.timer > 0) {
        ctx.save();
        const alpha = Math.min(1, milestoneOverlay.timer * 1.5);
        ctx.globalAlpha = alpha;
        drawRoundedPanel(40, 390, 400, 72, 20, 'rgba(15, 23, 42, 0.94)', milestoneOverlay.color);
        ctx.fillStyle = milestoneOverlay.color;
        ctx.font = '900 21px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`${t.megaFusion} [${milestoneOverlay.numStr}]!`, VW / 2, 422);
        ctx.fillStyle = '#ffffff';
        ctx.font = '800 11.5px sans-serif';
        ctx.fillText(t.critBossSub, VW / 2, 446);
        ctx.restore();
    }

    drawRoundedPanel(18, 706, 444, 40, 12, 'rgba(15, 23, 42, 0.92)', '#475569');
    const startTier = Math.max(0, maxUnlockedTier - 7);
    for (let i = 0; i < 11; i++) {
        const tIdx = startTier + i;
        const cx = 42 + i * 39.5;
        const cy = 726;
        const unlocked = tIdx <= maxUnlockedTier;
        const pal = getOrbColors(tIdx);

        ctx.save();
        ctx.fillStyle = unlocked ? pal.color1 : '#1e293b';
        ctx.strokeStyle = unlocked ? '#ffffff' : '#475569';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(cx, cy, 13.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        const txt = formatOrbNumber(tIdx);
        ctx.fillStyle = unlocked ? '#ffffff' : '#94a3b8';
        ctx.font = `900 ${txt.length >= 4 ? 8 : 9.5}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(unlocked ? txt : '?', cx, cy + 1);
        ctx.restore();
    }


    shockRings.forEach(s => {
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 3.5;
        ctx.globalAlpha = Math.max(0, 1 - s.r / s.maxR);
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.stroke();
    });
    ctx.globalAlpha = 1;

    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;

    cornerStreamers.forEach(cs => {
        ctx.fillStyle = cs.color;
        ctx.globalAlpha = Math.min(1, cs.life);
        ctx.beginPath();
        ctx.arc(cs.x, cs.y, cs.size, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;

    flyingStars.forEach(fs => {
        if (fs.delay > 0) return;
        ctx.save();
        ctx.translate(fs.x, fs.y);
        ctx.rotate(fs.rot);
        ctx.globalAlpha = 0.85;
        ctx.font = '900 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(fs.kind === 'star' ? '⭐' : '✨', 0, 0);
        ctx.restore();
    });

    floatingLabels.forEach(fl => {
        ctx.font = `900 ${fl.size}px 'Segoe UI', sans-serif`;
        ctx.fillStyle = fl.color;
        ctx.textAlign = 'center';
        ctx.globalAlpha = Math.min(1, fl.life * 1.8);
        ctx.fillText(fl.txt, fl.x, fl.y);
    });
    ctx.globalAlpha = 1;

    drawProgressiveBoosterBtn(UI_BTN.bBlast,  'bottomBlast', '#b91c1c', '#f97316', t.b1_1, t.b1_2, t);
    drawProgressiveBoosterBtn(UI_BTN.bShake,  'shake',       '#0369a1', '#06b6d4', t.b2_1, t.b2_2, t);
    drawProgressiveBoosterBtn(UI_BTN.bLink,   'laserLink',   '#1d4ed8', '#38bdf8', t.b3_1, t.b3_2, t);
    drawProgressiveBoosterBtn(UI_BTN.bHammer, 'hammer',      '#7e22ce', '#ec4899', t.b4_1, t.b4_2, t);
    drawProgressiveBoosterBtn(UI_BTN.bPicker, 'picker',      '#b45309', '#eab308', t.b5_1, t.b5_2, t);

    if (screenFlashAlpha > 0) {
        ctx.fillStyle = `rgba(254, 240, 138, ${screenFlashAlpha})`;
        ctx.fillRect(0, 0, VW, VH);
    }

    renderPerkRow(now);
    renderJuiceOverlays(t, now);

    if (wheelModalOpen) renderLuckyWheelModal(t, now);
    if (dailyModalOpen) renderDailyLoginModal(t, now);
    if (leaderboardModalOpen) renderLeaderboardModal(t, now);
    if (empireModalOpen) renderCityModal(t, now);
    if (stageWinModalOpen) renderStageMapVictoryModal(t, now);
    if (pickerModalOpen) renderShapePickerModal(t, now);
    if (upgModalOpen) renderMetaUpgradesModal(t, now);
    if (perkModal.open) renderPerkModal(t, now);
    if (runEndModal.open) renderRunEndModal(t, now);
    if (endingModal.open) renderEndingModal(t, now);
    if (adConfirm.open) renderAdConfirmModal(t, now);

    if (isGameOver) {
        ctx.fillStyle = 'rgba(6, 5, 18, 0.9)';
        ctx.fillRect(0, 0, VW, VH);

        drawRoundedPanel(45, 250, 390, 340, 26, '#0f172a', '#f43f5e');
        ctx.fillStyle = '#f43f5e';
        ctx.font = '900 25px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(gameOverReason === 'drops' ? t.outDrops : gameOverReason === 'time' ? t.outTime : t.outOverflow, VW / 2, 305);

        ctx.fillStyle = '#e2e8f0';
        ctx.font = '800 16px sans-serif';
        ctx.fillText(`${t.yourScore} ${score}   |   ${t.best} #${currentLevel}`, VW / 2, 348);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '600 14px sans-serif';
        // «Почти победил»: сколько HP осталось боссу
        const leftPct = Math.max(1, Math.ceil(rival.hp / rival.maxHp * 100));
        ctx.fillStyle = '#fde047';
        ctx.font = '900 15px sans-serif';
        ctx.fillText(`${t.bossLeft} ${leftPct}% HP!`, VW / 2, 382);
        ctx.fillStyle = '#090d16';
        ctx.beginPath(); ctx.roundRect(100, 394, 280, 16, 8); ctx.fill();
        ctx.fillStyle = '#ef4444';
        ctx.beginPath(); ctx.roundRect(100, 394, Math.max(10, 280 * leftPct / 100), 16, 8); ctx.fill();

        drawRoundedPanel(UI_BTN.revive.x, UI_BTN.revive.y, UI_BTN.revive.w, UI_BTN.revive.h, 16, '#10b981', '#6ee7b7');
        ctx.fillStyle = '#052e16';
        ctx.font = '900 15px sans-serif';
        ctx.fillText(gameOverReason === 'drops' ? t.reviveDrops : gameOverReason === 'time' ? t.reviveTime : t.reviveBtn, VW / 2, UI_BTN.revive.y + 38);

        drawRoundedPanel(UI_BTN.restart.x, UI_BTN.restart.y, UI_BTN.restart.w, UI_BTN.restart.h, 12, '#1e293b', '#475569');
        ctx.fillStyle = '#cbd5e1';
        ctx.font = '800 14px sans-serif';
        ctx.fillText(t.endRun, VW / 2, UI_BTN.restart.y + 28);
    }

    confetti.forEach(c => {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.rot);
        ctx.fillStyle = c.color;
        ctx.globalAlpha = Math.min(1, c.life);
        ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
        ctx.restore();
    });

    ctx.restore();
}

// ============================================================================
// «СОК»: КОМБО-БАННЕРЫ, НОВАЯ СФЕРА, НОКАУТ, КРАСНАЯ ВИНЬЕТКА, ОБУЧЕНИЕ
// ============================================================================
function renderJuiceOverlays(t, now) {
    // Красная пульсирующая виньетка, когда стакан почти полон
    if (dangerVignette > 0.02) {
        const a = dangerVignette * (0.45 + Math.sin(now * 0.012) * 0.15);
        const vg = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.25, VW / 2, VH / 2, VH * 0.75);
        vg.addColorStop(0, 'rgba(239, 68, 68, 0)');
        vg.addColorStop(1, `rgba(239, 68, 68, ${a})`);
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, VW, VH);
    }

    // Предупреждение об атаке босса + задание, чтобы её отбить
    if (rival.tele && !isGameOver) {
        const tl = rival.tele;
        const k = tl.t / tl.total;
        const urgent = tl.t < 2;
        ctx.save();
        const sy = 306;
        drawRoundedPanel(26, sy, 428, 66, 16, urgent ? `rgba(127, 29, 29, ${0.92 + Math.sin(now * 0.03) * 0.06})` : 'rgba(69, 10, 10, 0.92)', '#f87171');
        ctx.fillStyle = '#fecaca';
        ctx.font = '900 15px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(`⚠️ ${t.teleNames[tl.move]} ${t.teleIn} ${tl.t.toFixed(1)}${t.sec}`, 42, sy + 24);
        // «Собери [128] чтобы отбить!» — число крупно и жёлтым, справа сама сфера
        let tx = 42;
        ctx.fillStyle = '#ffffff';
        ctx.font = '800 14px sans-serif';
        ctx.fillText(t.teleNeed + ' ', tx, sy + 49);
        tx += ctx.measureText(t.teleNeed + ' ').width;
        ctx.fillStyle = '#fde047';
        ctx.font = '900 18px sans-serif';
        const numTxt = formatOrbNumber(tl.needTier);
        ctx.fillText(numTxt, tx, sy + 50);
        tx += ctx.measureText(numTxt + ' ').width;
        ctx.fillStyle = '#4ade80';
        ctx.font = '900 14px sans-serif';
        ctx.fillText(t.teleNeed2, tx, sy + 49);
        drawGlossyOrb({ x: 418, y: sy + 30, radius: 22, tier: tl.needTier, scaleX: 1, scaleY: 1, acc: 'none', expression: 'excited', exprTimer: 1 }, true);
        // Тающая полоска времени
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(36, sy + 58, 408, 4);
        ctx.fillStyle = urgent ? '#f87171' : '#fbbf24';
        ctx.fillRect(36, sy + 58, 408 * k, 4);
        ctx.restore();
    }

    // Заставка уровня: тип задачи и цель
    if (levelIntroT > 0 && !inStartMenu) {
        const a = Math.min(1, levelIntroT * 2, (2.6 - levelIntroT) * 5);
        const goalTxt = rival.isFinal ? L('Император владеет атаками всех миров!', "The Emperor wields every world's attacks!") : t.typeGoal[rival.type].replace('{n}', rival.type === 'drops' ? rival.dropsLeft : Math.round(rival.timeLeft));
        ctx.save();
        ctx.globalAlpha = Math.max(0, a);
        drawRoundedPanel(40, 360, 400, 120, 24, 'rgba(15, 23, 42, 0.95)', rival.type === 'mega' ? '#f43f5e' : '#fde047');
        ctx.textAlign = 'center';
        ctx.fillStyle = '#94a3b8';
        ctx.font = '900 13px sans-serif';
        ctx.fillText(`${t.lvlShort} ${currentLevel} · ${t.worldNames[themeIdx % WORLD_COUNT]}`, VW / 2, 388);
        ctx.fillStyle = rival.type === 'mega' ? '#f87171' : '#fde047';
        ctx.font = '900 28px sans-serif';
        ctx.fillText(rival.isFinal ? L('👹 ФИНАЛЬНЫЙ БОСС', '👹 FINAL BOSS') : t.typeNames[rival.type], VW / 2, 426);
        ctx.fillStyle = '#ffffff';
        ctx.font = '800 13.5px sans-serif';
        ctx.fillText(goalTxt, VW / 2, 458);
        ctx.restore();
    }

    // Баннер комбо: выпрыгивает с пружинкой и тает
    if (comboBanner.t > 0) {
        const life = comboBanner.t / 1.1;
        const pop = life > 0.8 ? 1 + (life - 0.8) * 2.5 : 1;
        ctx.save();
        ctx.translate(VW / 2, rival.tele ? 470 : 330);
        ctx.rotate(-0.06);
        ctx.scale(pop, pop);
        ctx.globalAlpha = Math.min(1, life * 2.2);
        let size = Math.min(44, 26 + comboBanner.combo * 2.5);
        ctx.font = `900 ${size}px 'Segoe UI', sans-serif`;
        const w = ctx.measureText(comboBanner.text).width;
        if (w > 400) { size = Math.floor(size * 400 / w); ctx.font = `900 ${size}px 'Segoe UI', sans-serif`; }
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 7;
        ctx.strokeStyle = '#090d16';
        ctx.strokeText(comboBanner.text, 0, 0);
        ctx.fillStyle = comboBanner.color;
        ctx.fillText(comboBanner.text, 0, 0);
        ctx.restore();
    }

    // Карточка «Новая сфера открыта»
    if (newHeroOverlay.t > 0) {
        const life = newHeroOverlay.t / 1.8;
        const slide = life > 0.85 ? (life - 0.85) * 600 : 0;
        ctx.save();
        ctx.globalAlpha = Math.min(1, life * 3);
        ctx.translate(slide, 0);
        drawRoundedPanel(70, 460, 340, 84, 20, 'rgba(15, 23, 42, 0.95)', '#fde047');
        drawGlossyOrb({ x: 118, y: 502, radius: 30, tier: newHeroOverlay.tier, scaleX: 1, scaleY: 1, expression: 'excited', exprTimer: 1 }, true);

        ctx.font = '900 15px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(t.newHero, 160, 495);
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 22px sans-serif';
        ctx.fillText(formatOrbNumber(newHeroOverlay.tier), 160, 524);
        ctx.restore();
    }

    // НОКАУТ
    if (koTimer > 0) {
        const p = 1 - koTimer / 1.4;
        ctx.save();
        ctx.fillStyle = `rgba(0, 0, 0, ${Math.min(0.45, p * 0.8)})`;
        ctx.fillRect(0, 0, VW, VH);
        ctx.translate(VW / 2, 400);
        const s = p < 0.2 ? 0.3 + p * 4.5 : 1.2 - Math.min(0.2, (p - 0.2) * 0.5);
        ctx.scale(s, s);
        ctx.rotate(-0.08);
        ctx.font = "900 64px 'Segoe UI', sans-serif";
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 10;
        ctx.strokeStyle = '#7f1d1d';
        ctx.strokeText(t.koText, 0, 0);
        ctx.fillStyle = '#fde047';
        ctx.fillText(t.koText, 0, 0);
        ctx.restore();
    }

    // Обучение на первом уровне
    if (!tutorialDone && !isGameOver && !stageWinModalOpen) {
        const msg = [t.tut1, t.tut2, t.tut3][Math.min(2, tutorialStep)];
        ctx.save();
        drawRoundedPanel(30, 560, 420, 54, 16, 'rgba(15, 23, 42, 0.92)', '#38bdf8');
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 13.5px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(msg, VW / 2, 592);
        if (tutorialStep === 0) {

            ctx.font = '34px sans-serif';
            ctx.fillText('👆', hx, 230 + Math.abs(Math.sin(now * 0.006)) * 8);

        ctx.restore();
    }
}

function renderChestModal(t, now) {
    const cm = chestModal;
    ctx.fillStyle = 'rgba(6, 5, 18, 0.95)';
    ctx.fillRect(0, 0, VW, VH);
    const col = ['#fde047', '#38bdf8', '#e879f9'][cm.rarity];
    // Вращающиеся лучи за сундуком
    ctx.save();
    ctx.translate(VW / 2, 330);
    ctx.rotate(now * 0.0008);
    ctx.globalAlpha = cm.phase === 2 ? 0.35 : 0.15;
    ctx.fillStyle = col;
    for (let k = 0; k < 12; k++) {
        ctx.rotate(Math.PI / 6);
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(260, -18); ctx.lineTo(260, 18); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    ctx.fillStyle = col;
    ctx.font = '900 24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(t.chestNames[cm.rarity], VW / 2, 190);

    if (cm.phase < 2) {
        const shake = cm.phase === 1 ? Math.sin(cm.t * 60) * (4 + cm.t * 14) : Math.sin(now * 0.006) * 2;
        const sc = cm.phase === 1 ? 2.4 + cm.t * 0.6 : 2.4;
        ctx.save();
        ctx.translate(shake, 0);
        drawChestIcon(VW / 2, 330, sc, cm.rarity, now, true);
        ctx.restore();
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 16px sans-serif';
        ctx.globalAlpha = 0.6 + Math.sin(now * 0.008) * 0.4;
        ctx.fillText(t.tapToOpen, VW / 2, 470);
        ctx.globalAlpha = 1;
        return;
    }

    // Награды вылетают по очереди
    const rw = cm.rewards;
    const items = [{ icon: '⭐', txt: `+${rw.stars}` }];
    Object.keys(rw.charges).forEach(k => {
        const names = { bottomBlast: t.b1_1, shake: t.b2_1, laserLink: t.b3_1, hammer: t.b4_1, picker: t.b5_1 };
        items.push({ icon: '', txt: `${names[k]} x${rw.charges[k]}` });
    });
    items.forEach((it, i) => {
        const p = Math.max(0, Math.min(1, (cm.t - i * 0.18) / 0.2));
        if (p <= 0) return;
        ctx.save();
        ctx.globalAlpha = p;
        ctx.translate(VW / 2, 250 + i * 40);
        ctx.scale(0.6 + p * 0.4, 0.6 + p * 0.4);
        drawRoundedPanel(-150, -17, 300, 34, 12, 'rgba(30, 41, 59, 0.95)', col);
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 16px sans-serif';
        ctx.fillText(`${it.icon} ${it.txt}`, 0, 6);
        ctx.restore();
    });
    if (rw.acc) {
        const p = Math.max(0, Math.min(1, (cm.t - items.length * 0.18 - 0.2) / 0.3));
        if (p > 0) {
            ctx.save();
            ctx.globalAlpha = p;
            drawRoundedPanel(80, 250 + items.length * 40, 320, 92, 18, 'rgba(88, 28, 135, 0.95)', '#f0abfc');
            drawGlossyOrb({ x: 128, y: 296 + items.length * 40, radius: 28 * (0.5 + p * 0.5), tier: 6, scaleX: 1, scaleY: 1, acc: rw.acc, expression: 'excited', exprTimer: 1 }, true);
            ctx.fillStyle = '#f0abfc';
            ctx.font = '900 14px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(t.newAcc, 172, 288 + items.length * 40);
            ctx.fillStyle = '#ffffff';
            ctx.font = '900 16px sans-serif';
            ctx.fillText(t.accNames[rw.acc], 172, 312 + items.length * 40);
            ctx.textAlign = 'center';
            ctx.restore();
        }
    }
    if (cm.t > 0.8) {
        drawRoundedPanel(UI_BTN.chestX2.x, UI_BTN.chestX2.y, UI_BTN.chestX2.w, UI_BTN.chestX2.h, 16, '#10b981', '#ffffff');
        ctx.fillStyle = '#052e16';
        ctx.font = '900 17px sans-serif';
        ctx.fillText(t.claimX2, VW / 2, UI_BTN.chestX2.y + 36);
        drawRoundedPanel(UI_BTN.chestClaim.x, UI_BTN.chestClaim.y, UI_BTN.chestClaim.w, UI_BTN.chestClaim.h, 12, '#2563eb', '#93c5fd');
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 15px sans-serif';
        ctx.fillText(t.claim, VW / 2, UI_BTN.chestClaim.y + 29);
    }
}

function renderLuckyWheelModal(t, now) {
    ctx.fillStyle = 'rgba(6, 5, 18, 0.92)';

    ctx.fillStyle = '#cbd5e1';
    ctx.font = '700 13px sans-serif';
    ctx.fillText(t.wheelSub, VW / 2, 156);

    const cx = VW / 2;
    const cy = 355;
    const radius = 152;
    const numSectors = WHEEL_SECTORS.length;
    const arc = (Math.PI * 2) / numSectors;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(wheelAngle);

    for (let i = 0; i < numSectors; i++) {
        const s = WHEEL_SECTORS[i];
        const startA = i * arc;
        const endA = startA + arc;

        ctx.fillStyle = s.color;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, startA, endA);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.save();
        ctx.rotate(startA + arc / 2);
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 13px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(currentLang === 'ru' ? s.ru : s.en, radius - 18, 5);
        ctx.font = '900 20px sans-serif';
        ctx.fillText(s.icon, radius - 92, 7);
        ctx.restore();
    }

    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.arc(0, 0, radius + 4, 0, Math.PI * 2);
    ctx.stroke();

    for (let p = 0; p < numSectors * 2; p++) {
        const pa = (p * Math.PI) / numSectors;
        const px = Math.cos(pa) * (radius + 4);
        const py = Math.sin(pa) * (radius + 4);
        ctx.fillStyle = (p + Math.floor(now / 150)) % 2 === 0 ? '#ffffff' : '#f43f5e';
        ctx.beginPath();
        ctx.arc(px, py, 4.5, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    ctx.arc(0, 0, 26, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#090d16';
    ctx.font = '900 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🎁', 0, 1);
    ctx.restore();

    ctx.save();
    ctx.translate(cx, cy - radius - 14);
    ctx.rotate(wheelFlapperAngle);
    ctx.fillStyle = '#fbbf24';
    ctx.strokeStyle = '#78350f';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-14, -10);
    ctx.lineTo(14, -10);
    ctx.lineTo(0, 26);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    if (wheelPrizeBanner) {

function drawRoundedPanel(x, y, w, h, r, fill, stroke) {
    ctx.save();
    ctx.fillStyle = fill;
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
}

function upgradeCost(lvl) {
    return Math.round(80 * Math.pow(lvl + 1, 1.5) / 10) * 10;
}
