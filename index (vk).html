function formatOrbNumber(tier) {
    const val = Math.pow(2, tier + 1);
    if (tier < 11) return val.toString();
    if (tier < 19) return Math.round(val / 1024) + 'K';
    if (tier < 29) return Math.round(val / 1048576) + 'M';
    if (tier < 39) return Math.round(val / 1073741824) + 'B';
    return Math.round(val / 1099511627776) + 'T';
}

function degFreq(song, deg, octMul) {
    const sc = SCALES[song.scale];
    const n = sc.length;
    const o = Math.floor(deg / n);
    const idx = ((deg % n) + n) % n;
    return song.root * octMul * Math.pow(2, (sc[idx] + 12 * o) / 12);
}

function vibrateDevice(ms = 15) {

function canPlay(isMusic) {
    return actx && masterIn && actx.state === 'running' && !systemMuted && (isMusic ? musicEnabled : soundEnabled);
}

// Нота в точное время when (ноты сами удаляются из памяти после звучания)
// opt: { rev: 0..1 доля в реверб, dly: 0..1 доля в эхо, atk: атака (с), duck: false — мимо компрессии под бочку }
function toneAt(when, type, freqStart, freqEnd, duration, volume, isMusic = false, opt = null) {
    if (!canPlay(isMusic)) return;
    try {
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freqStart, when);
        if (freqEnd !== freqStart) {
            osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), when + duration);
        }
        const atk = opt && opt.atk ? opt.atk : 0.006;
        gain.gain.setValueAtTime(0.0001, when);
        gain.gain.linearRampToValueAtTime(volume, when + atk);
        gain.gain.exponentialRampToValueAtTime(0.002, when + Math.max(duration, atk + 0.02));
        osc.connect(gain);
        const out = !isMusic ? masterIn : (opt && opt.duck === false ? musicDry : musicBus);
        gain.connect(out);
        const extra = [];
        if (isMusic && opt && opt.rev > 0 && reverbIn) {
            const sg = actx.createGain(); sg.gain.value = opt.rev; gain.connect(sg); sg.connect(reverbIn); extra.push(sg);
        }
        if (isMusic && opt && opt.dly > 0 && delayIn) {
            const sg = actx.createGain(); sg.gain.value = opt.dly; gain.connect(sg); sg.connect(delayIn); extra.push(sg);
        }
        osc.onended = () => { try { osc.disconnect(); gain.disconnect(); extra.forEach(x => x.disconnect()); } catch (e) {} };
        osc.start(when);
        osc.stop(when + Math.max(duration, atk + 0.02) + 0.02);
    } catch (e) {}
}

function noiseAt(when, duration, volume, hpFreq, isMusic = false, rev = 0) {
    if (!canPlay(isMusic) || !noiseBuf) return;
    try {
        const src = actx.createBufferSource();
        src.buffer = noiseBuf;
        src.playbackRate.value = 0.8 + Math.random() * 0.4;
        const f = actx.createBiquadFilter();
        f.type = 'highpass';
        f.frequency.value = hpFreq;
        const g = actx.createGain();
        g.gain.setValueAtTime(volume, when);
        g.gain.exponentialRampToValueAtTime(0.001, when + duration);
        src.connect(f); f.connect(g); g.connect(isMusic ? musicBus : masterIn);
        let sg = null;
        if (isMusic && rev > 0 && reverbIn) { sg = actx.createGain(); sg.gain.value = rev; g.connect(sg); sg.connect(reverbIn); }
        src.onended = () => { try { src.disconnect(); f.disconnect(); g.disconnect(); if (sg) sg.disconnect(); } catch (e) {} };
        src.start(when);
        src.stop(when + duration + 0.02);
    } catch (e) {}
}

function playSafeTone(type, freqStart, freqEnd, duration, volume) {
    if (!actx) return;
    toneAt(actx.currentTime, type, freqStart, freqEnd, duration, volume, false);
}

function unlockAndStartAudio() {
    try {
        if (!actx) actx = new AudioCtx();
        if (!masterIn) {
            const comp = actx.createDynamicsCompressor();
            comp.threshold.value = -14;
            comp.ratio.value = 4;
            const master = actx.createGain();
            master.gain.value = 0.9;
            master.connect(comp);
            comp.connect(actx.destination);
            masterIn = master;
            // Музыкальная шина: приглушается под бочку (эффект «качания»)
            musicDuck = actx.createGain();
            musicDuck.connect(master);
            musicBus = actx.createGain();
            musicBus.gain.value = 0.85;
            musicBus.connect(musicDuck);
            musicDry = actx.createGain();
            musicDry.gain.value = 0.85;
            musicDry.connect(master);
            // Реверб из сгенерированного «зала»
            const len = Math.floor(actx.sampleRate * 2.4);
            const ir = actx.createBuffer(2, len, actx.sampleRate);
            for (let ch = 0; ch < 2; ch++) {
                const dd = ir.getChannelData(ch);
                for (let i = 0; i < len; i++) dd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
            }
            const conv = actx.createConvolver();
            conv.buffer = ir;
            const revOut = actx.createGain();
            revOut.gain.value = 0.5;
            conv.connect(revOut); revOut.connect(musicDuck);
            reverbIn = conv;
            // Эхо (длина подстраивается под темп мира)
            delayNode = actx.createDelay(1.5);
            delayNode.delayTime.value = 0.35;
            const fb = actx.createGain(); fb.gain.value = 0.35;
            const dlyF = actx.createBiquadFilter(); dlyF.type = 'lowpass'; dlyF.frequency.value = 2600;
            delayNode.connect(dlyF); dlyF.connect(fb); fb.connect(delayNode);
            dlyF.connect(musicDuck);
            delayIn = delayNode;
            noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
            const d = noiseBuf.getChannelData(0);
            for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        }
        if (actx.state === 'suspended') actx.resume();
        if (!audioUnlocked) {
            audioUnlocked = true;
            startBouncyHouseLoop();
        }
    } catch (e) {}
}

const USE_MUSIC_FILES = false;
function tryLoadMusicFiles() {
    if (!USE_MUSIC_FILES) return;
    for (let w = 0; w < WORLD_COUNT; w++) {
        try {
            const a = new Audio();
            a.loop = true;
            a.preload = 'auto';
            a.volume = 0.6;
            a.oncanplaythrough = () => { musicFiles[w] = a; };
            a.onerror = () => {};
            a.src = `music/world${w + 1}.mp3`;
        } catch (e) {}
    }
}

function updateFileMusic() {
    const w = themeIdx % WORLD_COUNT;
    const want = (musicEnabled && !systemMuted && musicFiles[w]) ? musicFiles[w] : null;
    if (currentFileTrack && currentFileTrack !== want) { try { currentFileTrack.pause(); } catch (e) {} currentFileTrack = null; }
    if (want && currentFileTrack !== want) {
        currentFileTrack = want;
        try { want.currentTime = 0; want.play().catch(() => {}); } catch (e) {}
    }
}

function schedulerTick() {
    if (!actx) return;
    updateFileMusic();
    const song = SONGS[themeIdx % SONGS.length];
    const stepDur = 60 / song.bpm / 4;
    if (delayNode) delayNode.delayTime.value = stepDur * 3;
    if (nextNoteTime < actx.currentTime - 0.25) nextNoteTime = actx.currentTime + 0.05;
    while (nextNoteTime < actx.currentTime + 0.12) {
        scheduleMusicStep(musicStep, nextNoteTime, song, stepDur);
        nextNoteTime += stepDur;
        musicStep++;
    }
}

function scheduleMusicStep(step, tRaw, song, stepDur) {
    const st = step % 16;
    const bar = Math.floor(step / 16) % 8;
    const w = themeIdx % WORLD_COUNT;
    const sty = SONG_STYLE[w];
    if (st % 4 === 0) {
        beatPulse = 1.0;
        for (let i = 0; i < 16; i++) eqBars[i] = 0.4 + Math.random() * 0.6;
    } else {
        for (let i = 0; i < 16; i++) if (Math.random() < 0.4) eqBars[i] = 0.2 + Math.random() * 0.5;
    }
    if (!canPlay(true) || musicFiles[w]) return;

    // Свинг: слабые шестнадцатые чуть запаздывают
    const t = tRaw + (st % 2 === 1 ? sty.swing * stepDur : 0);
    const chord = song.prog[bar % 4];
    const isFill = (bar === 7 && st >= 12);

    // Бочка + «качание» музыки под неё
    if (st % 4 === 0 && !isFill) {
        toneAt(t, 'sine', 150, 40, 0.18, 0.26 * sty.kick, true, { duck: false });
        if (sty.heavy) noiseAt(t, 0.05, 0.06, 3000, true);
        if (musicDuck) {
            musicDuck.gain.cancelScheduledValues(t);
            musicDuck.gain.setValueAtTime(1 - 0.35 * sty.kick, t);
            musicDuck.gain.linearRampToValueAtTime(1, t + stepDur * 2.5);
        }
    }
    // Малый / хлопок / щётка
    if ((st === 4 || st === 12) && bar >= 1 && !isFill) {
        if (sty.hats === 'brush') {
            noiseAt(t, 0.22, 0.05, 2500, true, 0.3);
        } else {
            noiseAt(t, 0.14, 0.08, 1500, true, sty.rev * 0.6);
            toneAt(t, 'triangle', 230, 170, 0.07, 0.05, true);
        }
    }
    // Сбивка в конце фразы (в Вулкане — томы)
    if (isFill) {
        if (sty.heavy) toneAt(t, 'sine', 180 - (st - 12) * 25, 60, 0.2, 0.18, true);
        else noiseAt(t, 0.08, 0.05 + (st - 12) * 0.015, 1200, true, 0.2);
    }
    // Хэты
    if (sty.hats === 'straight') {
        if (st % 2 === 1) noiseAt(t, 0.03, 0.03, 7000, true);
        if (st % 4 === 2 && bar >= 2) noiseAt(t, 0.09, 0.02, 6000, true);
    } else if (sty.hats === 'brush') {
        if (st % 4 === 2 || st % 4 === 3) noiseAt(t, 0.12, 0.018, 5000, true);
    } else {
        if (st % 4 === 2) noiseAt(t, 0.05, 0.015, 8000, true, 0.4);
    }

    // Бас: шагающий (джаз) или по рисунку
    if (sty.walking) {
        if (st % 4 === 0) {
            const walk = [0, 2, 4, 5][(st / 4) | 0];
            const f = degFreq(song, chord + walk, 1);
            toneAt(t, 'triangle', f * 2, f * 2, stepDur * 3.5, 0.12, true);
        }
    } else if (song.bass[st]) {
        const f = degFreq(song, chord + (st >= 12 && bar % 2 === 1 ? 4 : 0), 1);
        toneAt(t, sty.bassWave, f, f, stepDur * 0.9, sty.heavy ? 0.07 : 0.045, true);
        toneAt(t, 'sine', f * 2, f, stepDur * 1.1, 0.13, true);
    }

    // Пэды (длинные аккорды) или стабы
    if (sty.pad && st === 0) {
        [0, 2, 4].forEach(k => {
            const f = degFreq(song, chord + k, 4);
            toneAt(t, sty.pad, f, f, stepDur * 16, sty.padVol, true, { atk: stepDur * 4, rev: sty.rev });
            toneAt(t, sty.pad, f * 1.004, f * 1.004, stepDur * 16, sty.padVol * 0.7, true, { atk: stepDur * 4 });
        });
    } else if (!sty.pad && (st === 0 || st === 8 || (bar >= 4 && st === 14))) {
        [0, 2, 4].forEach(k => {
            const f = degFreq(song, chord + k, 4);
            toneAt(t, 'triangle', f, f, stepDur * (sty.walking ? 3 : 5), 0.022, true, { rev: sty.rev });
        });
    }

    // Мелодия: со 2-го такта, во второй половине — припев
    if (bar >= 2) {
        const motif = bar >= 4 ? song.B : song.A;
        const d = motif[st];
        if (d !== null && d !== undefined) {
            const f = degFreq(song, chord + d, 4);
            const vol = { square: 0.032, sawtooth: 0.028, triangle: 0.06, sine: 0.07 }[song.lead] || 0.05;
            const fx = { atk: sty.leadAtk, rev: sty.rev, dly: sty.dly };
            if (sty.bell) {
                // Колокольчик: основной тон + негармонический обертон
                toneAt(t, 'sine', f * 2, f * 2, stepDur * sty.leadLen * 2, 0.06, true, fx);
                toneAt(t, 'sine', f * 2 * 2.76, f * 2 * 2.76, stepDur * 1.2, 0.018, true, fx);
            } else if (sty.marimba) {
                toneAt(t, 'sine', f, f, stepDur * 1.2, 0.08, true, fx);
                toneAt(t, 'sine', f * 4, f * 4, stepDur * 0.3, 0.02, true, fx);
            } else if (sty.pluck) {
                toneAt(t, 'triangle', f * 2, f * 1.98, stepDur * 1.3, 0.07, true, fx);
                toneAt(t, 'sawtooth', f * 2, f * 2, stepDur * 0.25, 0.015, true, fx);
            } else {
                toneAt(t, song.lead, f, f, stepDur * sty.leadLen, vol, true, fx);
                if (bar >= 6) toneAt(t, 'sine', f * 2, f * 2, stepDur * 1.2, vol * 0.4, true, fx);
            }
        }
    }

    // Арпеджио во время Куража
    if (feverActiveTimer > 0) {
        const arp = [0, 2, 4, 7][st % 4];
        const f = degFreq(song, chord + arp, 8);
        toneAt(t, 'square', f, f, stepDur * 0.8, 0.02, true, { dly: 0.3 });
    }
}

function drawSixDistinctWorlds(now, dt) {
    const mode = themeIdx % WORLD_COUNT;

    if (mode === 0) {
        // МИР 1: КИБЕРПАНК-СИТИ (Неоновые голограммы, летающий трафик, ретро-солнце, 3D-сетка)
        const horizonY = 365;
        const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
        skyGrad.addColorStop(0, '#070112');
        skyGrad.addColorStop(0.55, '#240b36');
        skyGrad.addColorStop(1, '#c31432');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, VW, horizonY);

        ctx.save();
        ctx.globalAlpha = 0.16;
        ctx.fillStyle = '#38bdf8';
        const sw1 = Math.sin(now * 0.0015) * 140;
        ctx.beginPath(); ctx.moveTo(80, horizonY); ctx.lineTo(140 + sw1, 0); ctx.lineTo(220 + sw1, 0); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ec4899';
        ctx.beginPath(); ctx.moveTo(400, horizonY); ctx.lineTo(260 - sw1, 0); ctx.lineTo(340 - sw1, 0); ctx.closePath(); ctx.fill();
        ctx.restore();

        const sunY = horizonY - 25;
        const sunGrad = ctx.createLinearGradient(0, sunY - 110, 0, sunY + 90);
        sunGrad.addColorStop(0, '#fde047');
        sunGrad.addColorStop(0.5, '#f97316');
        sunGrad.addColorStop(1, '#ec4899');
        ctx.fillStyle = sunGrad;
        ctx.beginPath();
        ctx.arc(VW / 2, sunY, 108 + beatPulse * 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#1e082b';
        for (let s = 0; s < 7; s++) {

    } else if (mode === 1) {
        // МИР 2: ГРАНД-КАЗИНО ВЕГАС (Неоновые арки, 3D-рулетка с красно-черными секторами, прожекторы и золотые фишки)

    } else if (mode === 2) {

    } else if (mode === 3) {

    } else if (mode === 4) {

        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(0, 0, 185 + beatPulse * 8, 0, Math.PI * 2); ctx.stroke();
        for (let s = 0; s < 4; s++) {
            ctx.rotate(Math.PI / 4);
            ctx.strokeRect(-130, -130, 260, 260);
        }
        ctx.restore();

        VOLCANO_EMBERS.forEach(em => {
            em.y -= em.vy * dt;
            em.wobble += dt * 4;
            if (em.y < -20) { em.y = VH + 20; em.x = Math.random() * VW; }
            const ex = em.x + Math.sin(em.wobble) * 16;
            ctx.fillStyle = em.r > 3.5 ? '#fde047' : '#f97316';
            ctx.globalAlpha = 0.65;
            ctx.beginPath();
            ctx.arc(ex, em.y, em.r, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;
    }
}

function awardChest(rarity) {
    const idx = chestSlots.findIndex(s => !s);
    if (idx < 0) {
        stars += [40, 120, 300][rarity];
        lastChestEarned = -2;
        return;
    }
    chestSlots[idx] = { rarity, readyAt: Date.now() + CHEST_TIMES[rarity] };
    lastChestEarned = rarity;
}

function chestIsReady(s) { return s && Date.now() >= s.readyAt; }

function fmtLeft(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return h > 0 ? `${h}ч ${m}м` : `${m}:${String(sec).padStart(2, '0')}`;
}

function genChestRewards(rarity) {
    const r = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
    const rw = { stars: [r(40, 80), r(120, 200), r(300, 500)][rarity], charges: {}, acc: null };
    const unlocked = Object.keys(BOOSTER_UNLOCK_LVL).filter(k => currentLevel >= BOOSTER_UNLOCK_LVL[k]);
    const nCharges = [1, 3, 5][rarity];
    for (let i = 0; i < nCharges; i++) {
        const k = unlocked[Math.floor(Math.random() * unlocked.length)];
        rw.charges[k] = (rw.charges[k] || 0) + 1;
    }
    const locked = ACCS.filter(a => !ownedAcc.includes(a));
    if (locked.length && Math.random() < [0.12, 0.45, 0.85][rarity]) {
        rw.acc = locked[Math.floor(Math.random() * locked.length)];
    }
    return rw;
}

function openChestSlot(i) {
    const s = chestSlots[i];
    if (!s) return;
    chestModal = { open: true, rarity: s.rarity, phase: 0, t: 0, rewards: genChestRewards(s.rarity), slot: i };
}

function claimChest(mult) {
    const rw = chestModal.rewards;
    if (!rw) return;
    stars += Math.round(rw.stars * mult * (1 + perkLvl('greed') * 0.5));
    Object.keys(rw.charges).forEach(k => { boosterCharges[k] = (boosterCharges[k] || 0) + rw.charges[k] * mult; });
    if (rw.acc && !ownedAcc.includes(rw.acc)) { ownedAcc.push(rw.acc); equippedAcc = rw.acc; newAccBadge = true; }
    if (chestModal.slot >= 0) chestSlots[chestModal.slot] = null;
    questEvent('chest', 1);
    chestModal = { open: false, rarity: 0, phase: 0, t: 0, rewards: null, slot: -1 };
    playJackpotFanfare();
    saveGameState();
    platformCloudSave();
}

function perkLvl(id) { return runPerks[id] || 0; }
// Урон в процентах от HP босса не усиливается бонусом империи (иначе поздние уровни становятся слишком лёгкими)
function pctHp(p) { return Math.round(rival.maxHp * p / (1 + (currentLevel - 1) * BALANCE.empireBonusPerLvl)); }
function perkDef(id) { return PERKS.find(p => p.id === id); }
function perkText(p, lvl) {
    const tr = currentLang === 'ru' ? p.ru : p.en;
    return [tr[0], tr[1].replace('{n}', p.n(lvl))];
}

function rollPerkChoices() {
    const pool = PERKS.filter(p => perkLvl(p.id) < p.max && (p.unlock || 0) <= bestDepth);
    const picks = [];
    while (picks.length < 3 && pool.length) {
        // Редкие выпадают реже
        const weights = pool.map(p => [6, 3, 1.4][p.rar]);
        let r = rnd() * weights.reduce((a, b) => a + b, 0);
        let i = 0;
        while (r > weights[i]) { r -= weights[i]; i++; }
        picks.push(pool[i].id);
        pool.splice(i, 1);
    }
    return picks;
}

    for (let i = rest.length - 1; i > 0; i--) {

        [rest[i], rest[j]] = [rest[j], rest[i]];
    }
    runOrder = [0].concat(rest);
}

    if (dailyMode) { ensureDaily(); if (depth > daily.best) { daily.best = depth; dailyBestNow = true; } platformSubmitDaily(daily.best); }
    const reward = Math.round(depth * 25 * (1 + perkLvl('greed') * 0.5));

function seedFromStr(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function ensureQuests() {
    const key = todayKey();
    if (quests.date === key && quests.list.length === 3) return;
    const rng = mulberry32(seedFromStr('q' + key));
    const pool = QUEST_POOL.slice();
    const list = [];
    while (list.length < 3) { const i = Math.floor(rng() * pool.length); list.push({ id: pool[i].id, p: 0, claimed: false }); pool.splice(i, 1); }
    quests = { date: key, list, bonusClaimed: false };
}
function questDef(id) { return QUEST_POOL.find(q => q.id === id); }
function questEvent(ev, val = 1) {
    ensureQuests();
    let changed = false;
    quests.list.forEach(q => {
        const d = questDef(q.id);
        if (!d || d.ev !== ev || q.p >= d.target) return;
        if (d.param !== undefined) { if (val >= d.param) q.p = d.target; else return; }
        else q.p = Math.min(d.target, q.p + val);
        changed = true;
        if (q.p >= d.target) addFloatingScore(VW / 2, 236, L('✅ ЗАДАНИЕ ВЫПОЛНЕНО!', '✅ QUEST COMPLETE!'), '#4ade80', 16);
    });
    if (changed) saveGameState();
}
function questsClaimable() {
    ensureQuests();
    const done = quests.list.filter(q => q.p >= questDef(q.id).target);
    return done.some(q => !q.claimed) || (quests.list.every(q => q.claimed) && !quests.bonusClaimed);
}

    saveGameState();
}

function drawAccessory(id, r, eyeY, eyeX) {
    if (!id || id === 'none') return;
    ctx.save();
    if (id === 'shades') {
        ctx.fillStyle = '#090d16';
        ctx.beginPath();
        ctx.roundRect(-eyeX - r * 0.2, eyeY - r * 0.13, r * 0.4, r * 0.26, r * 0.08);
        ctx.roundRect(eyeX - r * 0.2, eyeY - r * 0.13, r * 0.4, r * 0.26, r * 0.08);
        ctx.fill();
        ctx.fillRect(-eyeX + r * 0.18, eyeY - r * 0.06, (eyeX - r * 0.18) * 2, r * 0.05);
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(-eyeX - r * 0.12, eyeY - r * 0.06); ctx.lineTo(-eyeX, eyeY - r * 0.06); ctx.stroke();
    } else if (id === 'cat') {
        [-1, 1].forEach(d => {
            ctx.fillStyle = '#1f2937';
            ctx.beginPath(); ctx.moveTo(d * r * 0.25, -r * 0.82); ctx.lineTo(d * r * 0.62, -r * 1.22); ctx.lineTo(d * r * 0.72, -r * 0.62); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#f9a8d4';
            ctx.beginPath(); ctx.moveTo(d * r * 0.36, -r * 0.82); ctx.lineTo(d * r * 0.6, -r * 1.08); ctx.lineTo(d * r * 0.64, -r * 0.72); ctx.closePath(); ctx.fill();
        });
    } else if (id === 'halo') {
        ctx.strokeStyle = '#fde047';
        ctx.lineWidth = Math.max(2.5, r * 0.09);
        ctx.beginPath(); ctx.ellipse(0, -r * 1.12, r * 0.5, r * 0.14, 0, 0, Math.PI * 2); ctx.stroke();
    } else if (id === 'horns') {
        ctx.fillStyle = '#dc2626';
        [-1, 1].forEach(d => {
            ctx.beginPath(); ctx.moveTo(d * r * 0.28, -r * 0.85); ctx.quadraticCurveTo(d * r * 0.7, -r * 1.05, d * r * 0.62, -r * 1.35); ctx.lineTo(d * r * 0.52, -r * 0.75); ctx.closePath(); ctx.fill();
        });
    } else if (id === 'bow') {
        ctx.translate(r * 0.5, -r * 0.78);
        ctx.rotate(0.3);
        ctx.fillStyle = '#ec4899';
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-r * 0.36, -r * 0.2); ctx.lineTo(-r * 0.36, r * 0.2); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r * 0.36, -r * 0.2); ctx.lineTo(r * 0.36, r * 0.2); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#f9a8d4';
        ctx.beginPath(); ctx.arc(0, 0, r * 0.09, 0, Math.PI * 2); ctx.fill();
    } else if (id === 'mustache') {
        ctx.fillStyle = '#1f2937';
        const my = eyeY + r * 0.2;
        [-1, 1].forEach(d => {
            ctx.beginPath();
            ctx.moveTo(0, my);
            ctx.quadraticCurveTo(d * r * 0.2, my - r * 0.12, d * r * 0.38, my + r * 0.02);
            ctx.quadraticCurveTo(d * r * 0.48, my - r * 0.1, d * r * 0.44, my - r * 0.14);
            ctx.quadraticCurveTo(d * r * 0.5, my + r * 0.12, d * r * 0.2, my + r * 0.08);
            ctx.closePath(); ctx.fill();
        });
    } else if (id === 'party') {
        ctx.translate(-r * 0.3, -r * 0.85);
        ctx.rotate(-0.35);
        ctx.fillStyle = '#22d3ee';
        ctx.beginPath(); ctx.moveTo(-r * 0.3, 0); ctx.lineTo(r * 0.3, 0); ctx.lineTo(0, -r * 0.75); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#f472b6';
        ctx.fillRect(-r * 0.2, -r * 0.28, r * 0.4, r * 0.1);
        ctx.fillStyle = '#fde047';
        ctx.beginPath(); ctx.arc(0, -r * 0.78, r * 0.1, 0, Math.PI * 2); ctx.fill();
    } else if (id === 'ninja') {
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(-r * 0.92, eyeY - r * 0.42, r * 1.84, r * 0.18);
        ctx.beginPath(); ctx.moveTo(r * 0.85, eyeY - r * 0.4); ctx.lineTo(r * 1.25, eyeY - r * 0.25); ctx.lineTo(r * 0.85, eyeY - r * 0.27); ctx.fill();
        ctx.beginPath(); ctx.moveTo(r * 0.85, eyeY - r * 0.34); ctx.lineTo(r * 1.15, eyeY - r * 0.05); ctx.lineTo(r * 0.8, eyeY - r * 0.26); ctx.fill();
    }
    ctx.restore();
}

// ФИРМЕННЫЕ АТАКИ БОССОВ: у каждого мира своя
function triggerSignatureMove(forcedMode) {
    const t = I18N[currentLang];
    const mode = forcedMode !== undefined ? forcedMode : themeIdx % WORLD_COUNT;
    const normal = orbs.filter(o => !o.isStone && !o.isBomb);
    playBossAttackSound();
    jarShakeX = 14;
    screenFlashAlpha = 0.18;
    addFloatingScore(VW / 2, 200, t.bossMoves[mode], '#f43f5e', 15);

    if (mode === 0) {
        // DJ: дроп бита подбрасывает и перемешивает все сферы
        orbs.forEach(o => { o.vy = -380 - Math.random() * 260; o.vx += (Math.random() - 0.5) * 520; o.unmergedTime = 0; });
    } else if (mode === 1) {
        // Вегас: кости уменьшают крупную сферу на 1 ступень
        const big = normal.filter(o => o.tier >= 2).sort((a, b) => b.tier - a.tier);
        if (big.length) {
            const o = big[Math.min(big.length - 1, Math.floor(Math.random() * 3))];
            o.tier -= 1;
            o.radius = getOrbRadius(o.tier);
            o.scaleX = 1.4; o.scaleY = 0.6;
            spawnParticles(o.x, o.y, '#fde047', 16);
        }
    } else if (mode === 2) {
        // Сатурн: метеориты-капсулы
        for (let k = 0; k < 2; k++) {
            const sx = JAR.x + 70 + Math.random() * (JAR.w - 140);
            const s = createOrb(sx, JAR.y - 10 - k * 40, 0, false, false, false, false, true);
            s.vy = 420;
            orbs.push(s);
        }
    } else if (mode === 3) {
        // Атлантида: течение сносит все сферы в одну сторону
        const dir = Math.random() < 0.5 ? -1 : 1;
        orbs.forEach(o => { o.vx += dir * (420 + Math.random() * 120); o.vy -= 120; });
    } else if (mode === 4) {
        // Токио: сюрикены замораживают 2 сферы
        normal.filter(o => !o.frozen).sort(() => Math.random() - 0.5).slice(0, 2).forEach(o => {
            o.frozen = 2; spawnParticles(o.x, o.y, '#f43f5e', 12);
        });
    } else if (mode === 5) {
        // Вулкан: лава поднимает линию смерти на 8 секунд
        lavaTimer = 8;
    } else if (mode === 6) {
        // Снежная Королева: крепкий лёд на 3 сферы
        normal.filter(o => !o.frozen).sort(() => Math.random() - 0.5).slice(0, 3).forEach(o => {
            o.frozen = 4; spawnParticles(o.x, o.y, '#bae6fd', 14);
        });
    } else {
        // Барон Леденец: сахарный дождь из мелких сфер
        for (let k = 0; k < 4; k++) {
            const o = createOrb(JAR.x + 60 + Math.random() * (JAR.w - 120), JAR.y - 20 - k * 30, k % 2, false, false, false, false, false);
            o.vy = 300;
            orbs.push(o);
        }
    }
}

function triggerRivalTrick() {
    const t = I18N[currentLang];
    sanitizeOrbsArray();

    if (!rival.tele && Math.random() < BALANCE.signatureChance + (rival.enraged ? 0.2 : 0)) {
        startTelegraph();
        return;
    }

    const roll = Math.random();
    if (roll < 0.3 && !rival.shieldActive && rival.hp < rival.maxHp * 0.88) {
        rival.shieldActive = true;
        playIceCrackSound();
        addFloatingScore(VW / 2, 198, t.shieldActiveText, '#38bdf8', 13.5);
        return;
    }

    const stoneCount = orbs.filter(o => o.isStone).length;
    if (roll < 0.62 && stoneCount < 2 && orbs.length < 18) {
        const sx = JAR.x + 75 + Math.random() * (JAR.w - 150);
        const stoneOrb = createOrb(sx, JAR.y - 5, 0, false, false, false, false, true);
        stoneOrb.vy = 260;
        orbs.push(stoneOrb);

        rival.beamTimer = 0.45;
        rival.beamX = sx;
        rival.beamY = JAR.y + 40;
        playIceCrackSound();
        addFloatingScore(VW / 2, 198, t.rivalStoneMsg, '#f97316', 14);
        return;
    }

    const candidates = orbs.filter(o => !o.frozen && !o.isStone && !o.isBomb);
    if (candidates.length > 0) {
        const target = candidates[Math.floor(Math.random() * candidates.length)];
        target.frozen = 3;
        target.scaleX = 1.25;
        target.scaleY = 0.8;

        rival.beamTimer = 0.55;
        rival.beamX = target.x;
        rival.beamY = target.y;

        playIceCrackSound();
        spawnParticles(target.x, target.y, '#38bdf8', 14);
        addFloatingScore(VW / 2, 198, t.rivalFrozeMsg, '#38bdf8', 13.5);
    }
}

function shatterNearbyHazards(mx, my, blastRadius) {
    const t = I18N[currentLang];
    for (let i = orbs.length - 1; i >= 0; i--) {
        const o = orbs[i];
        const d = Math.hypot(o.x - mx, o.y - my);
        if (d <= blastRadius) {
            if (o.frozen > 0) {
                o.frozen = 0;
                stars += 5;
                if (perkLvl('ice')) fireRivalMissile(o.x, o.y, 300 * perkDef('ice').n(perkLvl('ice')), '#bae6fd');
                playIceCrackSound();
                spawnParticles(o.x, o.y, '#38bdf8', 14);
                addFloatingScore(o.x, o.y - 20, t.iceBrokenMsg, '#38bdf8', 15);
            }
            if (o.isStone) {
                stars += 10;
                playIceCrackSound();
                spawnParticles(o.x, o.y, '#fbbf24', 18);
                fireRivalMissile(o.x, o.y, 450 * (perkLvl('ice') ? perkDef('ice').n(perkLvl('ice')) : 1), '#fbbf24');
                addFloatingScore(o.x, o.y - 20, t.stoneBrokenMsg, '#fbbf24', 15);
                orbs.splice(i, 1);
            }
        }
    }
}

function damageRival(dmg) {
    if (stageWinModalOpen || isGameOver || koTimer > 0) return;
    const t = I18N[currentLang];

    if (rival.shieldActive) {
        if (combo >= 2 || dmg >= 600) {
            rival.shieldActive = false;
            playIceCrackSound();
            addFloatingScore(148, 128, t.shieldBrokenMsg, '#38bdf8', 16);
        } else {
            dmg = Math.ceil(dmg * 0.3);
        }
    }

    const empireBonus = 1 + (currentLevel - 1) * BALANCE.empireBonusPerLvl;
    const feverMult = feverActiveTimer > 0 ? 2.0 : 1.0;
    const stunMult = rival.stunTimer > 0 ? 1.5 + perkLvl('counter') * 0.35 : 1.0;
    const finalDmg = Math.ceil(dmg * empireBonus * feverMult * stunMult);

    rival.hp = Math.max(0, rival.hp - finalDmg);
    if (finalDmg >= 800) {
        if (bossDmgPops.length > 3) bossDmgPops.shift();
        bossDmgPops.push({ x: 248 + (Math.random() - 0.5) * 30, y: 70, txt: `-${finalDmg}`, life: 0.9, big: true });
    }

    // Проверка входа Босса в ФАЗУ ЯРОСТИ (<35% HP)
    if (!rival.enraged && rival.hp > 0 && rival.hp <= rival.maxHp * 0.35) {
        rival.enraged = true;
        rival.shieldActive = true;
        rival.trickTimer = 1.2;
        jarShakeX = 18;
        jarShakeY = 12;
        screenFlashAlpha = 0.35;
        playBossHitSound(true);
        addFloatingScore(VW / 2, 185, t.bossRageMsg, '#f43f5e', 16.5);
        // Уникальная атака ярости по мирам
        const wMode = themeIdx % 6;
        orbs.forEach(o => {
            if (wMode === 3 || wMode === 4) o.vx += (Math.random() - 0.5) * 420;
            if (wMode === 0 || wMode === 5) o.vy = -220 - Math.random() * 150;
        });
    }
    rival.hitScale = 1.18;
    rival.shakeX = (Math.random() - 0.5) * 14;
    rival.flashTimer = 0.18;
    playBossHitSound(finalDmg > 400);
    spawnParticles(145, 88, '#38bdf8', 6);

    if (rival.hp <= 0 && !stageWinModalOpen && koTimer <= 0) {
        // НОКАУТ: замедление, взрыв босса, затем окно победы со звёздами
        koTimer = 1.4;
        hitStopTimer = 0.6;
        vibrateDevice(90);
        playVictoryFanfare();
        spawnConfettiShower();
        fireFourCornerCannons();
        for (let k = 0; k < 4; k++) spawnParticles(45 + (Math.random() - 0.5) * 40, 85, ['#fde047', '#f43f5e', '#38bdf8', '#ffffff'][k], 16);
        burstRays.push({ x: 45, y: 85, life: 1.4, color: '#fde047' });
        const par = BALANCE.parSecondsBase + (currentLevel - 1) * 8;
        victoryStars = 1 + (levelTimer <= par * 1.6 ? 1 : 0) + (levelTimer <= par && revivesThisLevel === 0 && peakDanger < 0.6 ? 1 : 0);
        victoryAnimT = 0;
        const prev = bestStarsByLevel[currentLevel] || 0;
        if (victoryStars > prev) bestStarsByLevel[currentLevel] = victoryStars;
        stars += Math.round(victoryStars * 15 * (1 + perkLvl('greed') * 0.5));
        rival.tele = null;
        questEvent('win', 1);
        if (victoryStars === 3) questEvent('stars3', 1);
        questEvent('depth', currentLevel);
        if (rival.isFinal) {
            finalWins++;
            stars += 500;
            awardChest(2);
            pendingEnding = true;
        } else {
            captureClub(themeIdx % WORLD_COUNT);
            awardChest(rival.type === 'mega' ? 2 : (victoryStars === 3 ? 1 : 0));
        }
        platformSubmitScore();
    }
}

function advanceToNextLevel(bonusCharges = 1) {
    stars += 50 * bonusCharges;
    addScoreAndCheckLeague(1000 * bonusCharges);

    currentLevel++;
    initRivalForLevel(currentLevel);

    Object.keys(BOOSTER_UNLOCK_LVL).forEach(key => {
        if (currentLevel >= BOOSTER_UNLOCK_LVL[key]) {
            boosterCharges[key] = (boosterCharges[key] || 0) + bonusCharges;
        }
    });

    // Новый уровень начинается с чистого стакана
    lastChestEarned = -1;
    orbs = [];
    feverMeter = 0;
    feverActiveTimer = 0;
    combo = 0;
    dangerTimer = 0;

    stageWinModalOpen = false;
    canDrop = true;
    dropCooldown = 0;

    spawnConfettiShower();
    fireFourCornerCannons();
    openPerkChoice();
    saveGameState();
    platformCloudSave();
    tryShowInterstitialAdWithCooldown();
}

function addScoreAndCheckLeague(pts) {
    score += Math.ceil(pts);
    const t = I18N[currentLang];
    if (leagueIdx < TOP_100_RIVALS.length - 1 && score >= TOP_100_RIVALS[leagueIdx].pts) {
        leagueIdx++;
        const newRank = TOP_100_RIVALS[leagueIdx].rank;
        stars += 20;
        playJackpotFanfare();
        addFloatingScore(VW / 2, 165, `${t.overtakenMsg}${newRank}!`, '#4ade80', 17);
    }
}

function sanitizeOrbsArray() {
    orbs = orbs.filter(o =>
        o &&
        Number.isFinite(o.x) &&
        Number.isFinite(o.y) &&
        Number.isFinite(o.vx) &&
        Number.isFinite(o.vy) &&

    );
}

function executeBottomRowBlast() {
    const t = I18N[currentLang];
    sanitizeOrbsArray();
    floorLaserEffect = 1.0;

    orbs.forEach(o => { o.frozen = 0; });
    orbs = orbs.filter(o => !o.isStone);

    if (orbs.length === 0) {
        isBombCurrent = true;
        addFloatingScore(VW / 2, 175, t.bombDroppedMsg, '#fbbf24', 17);
        return;
    }

    const sorted = [...orbs].sort((a, b) => b.y - a.y);
    const toDestroy = sorted.slice(0, Math.min(5, sorted.length));
    const destroyIds = new Set(toDestroy.map(o => o.id));

    toDestroy.forEach(o => {
        const pal = getOrbColors(o.tier);
        spawnParticles(o.x, o.y, pal.color1, 14);
        spawnSubtleStarburst(o.x, o.y, 2);
        fireRivalMissile(o.x, o.y, 240, pal.color1);
        shockRings.push({ x: o.x, y: o.y, r: 10, maxR: 110, color: '#f43f5e' });
    });

    orbs = orbs.filter(o => !destroyIds.has(o.id));
    orbs.forEach(o => {
        o.vy = -130;
        o.scaleX = 1.22;
        o.scaleY = 0.78;
        o.unmergedTime = 0;
    });

    canDrop = true;
    dropCooldown = 0;
    hammerMode = false;
    vibrateDevice(40);
    jarShakeY = 14;
    screenFlashAlpha = 0.32;
    playJackpotFanfare();
    addFloatingScore(VW / 2, JAR.y + JAR.h - 60, t.bottomBlastMsg, '#fbbf24', 16.5);
    saveGameState();
}

function executeTornadoShake() {
    const t = I18N[currentLang];
    sanitizeOrbsArray();
    jarShakeX = 24;
    jarShakeY = -20;
    vibrateDevice(45);

    const byTier = {};
    orbs.forEach(o => {

        group.forEach(o => {

function executeRemoteLaserLink() {
    const t = I18N[currentLang];
    sanitizeOrbsArray();
    orbs.forEach(o => { o.frozen = 0; });
    let fusedPairs = 0;
    const usedIds = new Set();

    for (let i = orbs.length - 1; i >= 0; i--) {
        for (let j = i - 1; j >= 0; j--) {
            const a = orbs[i];
            const b = orbs[j];
            if (!a || !b || a.isStone || b.isStone || usedIds.has(a.id) || usedIds.has(b.id)) continue;
            if (a.tier === b.tier && fusedPairs < 3) {
                usedIds.add(a.id);
                usedIds.add(b.id);
                fusedPairs++;

                laserLinkBeams.push({
                    ax: a.x, ay: a.y,
                    bx: b.x, by: b.y,
                    color: getOrbColors(a.tier).color1,
                    life: 0.65
                });

                a.merging = true;
                b.merging = true;
                handleOrbMerge((a.x + b.x) / 2, (a.y + b.y) / 2, a.tier + 1, a.isChest || b.isChest);
            }
        }
    }

    sanitizeOrbsArray();
    canDrop = true;
    dropCooldown = 0;

    if (fusedPairs > 0) {
        vibrateDevice(35);
        addFloatingScore(VW / 2, JAR.y + 120, t.laserLinkMsg, '#38bdf8', 16.5);
    } else {
        const normalOrbs = orbs.filter(o => !o.isStone);
        if (normalOrbs.length >= 2) {
            normalOrbs[0].tier = normalOrbs[1].tier;
            normalOrbs[0].radius = getOrbRadius(normalOrbs[0].tier);
            executeRemoteLaserLink();
            return;
        }
    }
    saveGameState();
}

function startWheelSpin() {
    wheelSpinning = true;

function updateWheelPhysics(dt) {
    if (!wheelSpinning) return;

    wheelAngle += wheelSpeed * dt;
    wheelSpeed *= Math.pow(0.22, dt);

    const sectorArc = (Math.PI * 2) / WHEEL_SECTORS.length;
    const normalizedAngle = ((wheelAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const currentSectorIdx = Math.floor(normalizedAngle / sectorArc);

    if (currentSectorIdx !== lastTickSector) {
        lastTickSector = currentSectorIdx;
        wheelFlapperAngle = -0.55;
        playWheelTick();
    }

    wheelFlapperAngle += (0 - wheelFlapperAngle) * 18 * dt;

    if (wheelSpeed < 0.12) {
        wheelSpeed = 0;
        wheelSpinning = false;
        wheelFlapperAngle = 0;

        const pointerAngle = (Math.PI * 1.5 - (wheelAngle % (Math.PI * 2)) + Math.PI * 4) % (Math.PI * 2);
        const winIdx = Math.floor(pointerAngle / sectorArc) % WHEEL_SECTORS.length;
        awardWheelPrize(WHEEL_SECTORS[winIdx].id);
    }
}

    } else if (prizeId === 'fever') {

function spawnSubtleStarburst(startX, startY, count = 2) {

    for (let i = 0; i < safeCount; i++) {

function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const scaleX = window.innerWidth / VW;
    const scaleY = window.innerHeight / VH;
    scale = Math.min(scaleX, scaleY);
    offsetX = (window.innerWidth - VW * scale) / 2;
    offsetY = (window.innerHeight - VH * scale) / 2;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function screenToVirtual(clientX, clientY) {
    return {
        x: (clientX - offsetX) / scale,
        y: (clientY - offsetY) / scale
    };
}

function addFloatingScore(x, y, txt, color = '#ffffff', size = 16.5) {
    if (floatingLabels.length > 18) floatingLabels.shift();
    // Не даём надписям налезать друг на друга: сдвигаем новую ниже
    for (let k = 0; k < 4; k++) {
        const clash = floatingLabels.some(fl => Math.abs(fl.y - y) < size + 4 && Math.abs(fl.x - x) < 160 && fl.life > 0.3);
        if (!clash) break;
        y += size + 6;

    floatingLabels.push({ x, y, txt, color, size, life: 1.05, maxLife: 1.05 });

const SAVE_KEY = 'megaMergeEmpire_v14';
let lastSaveJson = '';

function loadGameState(rawOverride) {
    try {
        const raw = rawOverride || localStorage.getItem(SAVE_KEY);
        const todayStr = new Date().toDateString();
        if (!raw) {
            initRivalForLevel(1);
            return;
        }
        const data = typeof raw === 'string' ? JSON.parse(raw) : raw;
        tutorialDone = !!data.tutorialDone;
        if (data.bestStarsByLevel) bestStarsByLevel = data.bestStarsByLevel;
        if (typeof data.musicEnabled === 'boolean') musicEnabled = data.musicEnabled;
        if (typeof data.soundEnabled === 'boolean') soundEnabled = data.soundEnabled;
        if (Array.isArray(data.chestSlots) && data.chestSlots.length === 3) chestSlots = data.chestSlots;
        if (data.runPerks) runPerks = data.runPerks;
        if (Array.isArray(data.runOrder) && data.runOrder.length === WORLD_COUNT) runOrder = data.runOrder;
        bestDepth = data.bestDepth || 0;
        runDrops = data.runDrops || 0;
        secondUsed = !!data.secondUsed;
        if (typeof data.facesOn === 'boolean') facesOn = data.facesOn;
        if (data.quests && Array.isArray(data.quests.list)) quests = data.quests;
        if (data.daily) daily = data.daily;
        dailyMode = !!data.dailyMode;
        if (dailyMode) dailyRng = mulberry32(seedFromStr('daily' + todayKey() + (data.currentLevel || 1)));
        if (Array.isArray(data.discoveredSyn)) discoveredSyn = data.discoveredSyn;
        if (Array.isArray(data.clubLevels) && data.clubLevels.length === WORLD_COUNT) clubLevels = data.clubLevels;
        finalWins = data.finalWins || 0;
        mergeCount = data.mergeCount || 0;
        if (Array.isArray(data.ownedAcc)) ownedAcc = data.ownedAcc.filter(a => ACCS.includes(a));
        if (!ownedAcc.includes('none')) ownedAcc.unshift('none');
        if (ACCS.includes(data.equippedAcc) && ownedAcc.includes(data.equippedAcc)) equippedAcc = data.equippedAcc;
        score = data.score || 0;
        stars = data.stars ?? 60;
        currentLevel = data.currentLevel || 1;
        themeIdx = data.themeIdx ?? ((currentLevel - 1) % WORLD_COUNT);
        leagueIdx = data.leagueIdx || 0;
        initRivalForLevel(currentLevel);
        if (data.rivalHp > 0 && data.rivalMaxHp > 0) {
            rival.hp = data.rivalHp;
            rival.maxHp = data.rivalMaxHp;
        }
        if (data.boosterCharges) boosterCharges = Object.assign(boosterCharges, data.boosterCharges);
        if (data.metaUpgrades) metaUpgrades = Object.assign(metaUpgrades, data.metaUpgrades);
        maxUnlockedTier = data.maxUnlockedTier ?? 2;
        loginDay = data.loginDay || 1;
        if (data.lang) currentLang = data.lang;
        dailyClaimedToday = (data.lastClaimDate === todayStr);

        if (Array.isArray(data.orbs) && data.orbs.length > 0) {
            orbs = data.orbs.map(o => {
                const created = createOrb(o.x, o.y, o.tier, !!o.isRainbow, false, !!o.isChest, false, !!o.isStone);
                created.frozen = o.frozen || 0;
                return created;
            });
        }
    } catch (e) {
        initRivalForLevel(1);
    }
}

function inBox(px, py, b) {

function tryUseTacticalBooster(type) {

            watchRewardedAd(type);

            adConfirm.open = false;
        }
        return;
    }

    // Концовка кампании
    if (endingModal.open) {
        if (pt.x >= 90 && pt.x <= 390 && pt.y >= 600 && pt.y <= 656) endingModal.open = false;
        return;
    }
    // Задания дня
    if (questsModalOpen) { questsModalClick(pt); return; }

    // Выбор усиления
    if (perkModal.open) {
        if (perkModal.t < 0.4) return;
        for (let i = 0; i < perkModal.choices.length; i++) {
            const by = 250 + i * 122;
            if (pt.x >= 40 && pt.x <= 440 && pt.y >= by && pt.y <= by + 108) { pickPerk(perkModal.choices[i]); return; }
        }
        if (!perkModal.rerolled && !dailyMode && pt.x >= 110 && pt.x <= 370 && pt.y >= 626 && pt.y <= 672) watchRewardedAd('perkReroll');
        return;
    }
    // Итоги забега
    if (runEndModal.open) {
        if (pt.x >= 70 && pt.x <= 410 && pt.y >= 530 && pt.y <= 590) startNewRun();
        else if (pt.x >= 140 && pt.x <= 340 && pt.y >= 604 && pt.y <= 648) { startNewRun(); inStartMenu = true; platformGameplayStop(); }
        return;
    }

    // Открытие сундука
    if (chestModal.open) {
        if (chestModal.phase === 0) { chestModal.phase = 1; chestModal.t = 0; vibrateDevice(20); playPopSound(4, 2); }
        else if (chestModal.phase === 2 && chestModal.t > 0.8) {
            if (inBox(pt.x, pt.y, UI_BTN.chestX2)) watchRewardedAd('chestX2');
            else if (inBox(pt.x, pt.y, UI_BTN.chestClaim)) claimChest(1);
        }
        return;
    }

    // Коллекция аксессуаров
    if (collectionModalOpen) {
        for (let i = 0; i < ACCS.length; i++) {
            const bx = 46 + (i % 3) * 132, by = 210 + Math.floor(i / 3) * 128;
            if (pt.x >= bx && pt.x <= bx + 124 && pt.y >= by && pt.y <= by + 120) {
                if (ownedAcc.includes(ACCS[i])) { equippedAcc = ACCS[i]; playPopSound(5, 2); saveGameState(); }
                return;
            }
        }
        if (pt.y > 600 || pt.y < 140) collectionModalOpen = false;
        return;
    }

    // Колесо подарков (открывается и из меню, и из боя)
    if (wheelModalOpen) {
        if (inBox(pt.x, pt.y, UI_BTN.spinNow) && !wheelSpinning) {
            watchRewardedAd('wheelSpin');
        } else if (inBox(pt.x, pt.y, UI_BTN.closeWh) && !wheelSpinning) {
            wheelModalOpen = false;
            wheelPrizeBanner = '';
        }
        return;
    }

    // 1. Окно Ежедневного Бонуса 7 Дней
    if (dailyModalOpen) {
        if (inBox(pt.x, pt.y, UI_BTN.dailyClaimX2)) watchRewardedAd('dailyX2');
        else if (inBox(pt.x, pt.y, UI_BTN.dailyClaim1)) claimDailyReward(1);
        return;
    }

    // 2. Окно Таблицы Лидеров Топ-100
    if (leaderboardModalOpen) {
        if (pt.y > 620) leaderboardModalOpen = false;
        return;
    }

    // 3. Окно Империи Клубов
    if (empireModalOpen) {
        if (pt.y > 640 || pt.y < 110) empireModalOpen = false;
        return;
    }

    // 4. Окно Прокачки Базы
    if (upgModalOpen) {
        const keys = ['minSpawnLvl', 'bossDmgLvl', 'turretLvl'];
        for (let i = 0; i < 3; i++) {
            const by = 240 + i * 105;
            if (pt.x >= 285 && pt.x <= 425 && pt.y >= by + 15 && pt.y <= by + 68) {
                const k = keys[i];
                const cost = upgradeCost(metaUpgrades[k]);
                if (stars >= cost) {
                    stars -= cost;
                    metaUpgrades[k]++;
                    if (currentOrbTier < metaUpgrades.minSpawnLvl) currentOrbTier = metaUpgrades.minSpawnLvl;
                    playJackpotFanfare();
                    saveGameState();
                } else {
                    watchRewardedAd('upg_' + k);
                }
                return;
            }
        }
        if (pt.y > 570) upgModalOpen = false;
        return;
    }

    // 5. ЕСЛИ ОТКРЫТО ГЛАВНОЕ МЕНЮ ЗАПУСКА!
    if (inStartMenu) {
        if (inBox(pt.x, pt.y, UI_BTN.mPlay)) {
            inStartMenu = false;
            if (dailyMode && currentLevel <= 1) startNewRun(false);
            playJackpotFanfare();
            platformGameplayStart();
            return;
        }
        if (inBox(pt.x, pt.y, UI_BTN.mDailyRun)) {
            if (currentLevel <= 1) { startDailyRun(); playJackpotFanfare(); }
            return;
        }
        if (inBox(pt.x, pt.y, UI_BTN.mColl)) { collectionModalOpen = true; newAccBadge = false; return; }
        if (inBox(pt.x, pt.y, UI_BTN.mQuest)) { questsModalOpen = true; return; }
        if (inBox(pt.x, pt.y, UI_BTN.mCity)) { empireModalOpen = true; return; }
        if (inBox(pt.x, pt.y, UI_BTN.mBonus)) { dailyModalOpen = true; return; }
        if (inBox(pt.x, pt.y, UI_BTN.mUpg)) { upgModalOpen = true; return; }
        if (inBox(pt.x, pt.y, UI_BTN.mWheel)) { leaderboardModalOpen = true; return; }
        for (let i = 0; i < 3; i++) {
            const bx = 65 + i * 120;
            if (pt.x >= bx && pt.x <= bx + 110 && pt.y >= CHEST_ROW_Y && pt.y <= CHEST_ROW_Y + 92) {
                const sl = chestSlots[i];
                if (sl && chestIsReady(sl)) openChestSlot(i);
                else if (sl) openAdConfirm('chestSkip' + i, t.chestSkipTitle, t.chestSkipSub);
                return;
            }
        }
        if (pt.x >= 12 && pt.x <= 162 && pt.y >= 6 && pt.y <= 46) {
            facesOn = !facesOn;
            playPopSound(5, 1);
            saveGameState();
            return;
        }
        // Переключатели музыки, звуков и языка вверху главного меню
        if (inBox(pt.x, pt.y, UI_BTN.music)) {
            musicEnabled = !musicEnabled;
            saveGameState();
            return;
        }
        if (inBox(pt.x, pt.y, UI_BTN.sfx)) {
            soundEnabled = !soundEnabled;
            saveGameState();
            return;
        }
        if (inBox(pt.x, pt.y, UI_BTN.lang)) {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            saveGameState();
            return;
        }
        return;
    }

    // 6. Окно Колеса Фортуны
    if (wheelModalOpen) {
        if (inBox(pt.x, pt.y, UI_BTN.spinNow) && !wheelSpinning) {
            watchRewardedAd('wheelSpin');
        } else if (inBox(pt.x, pt.y, UI_BTN.closeWh) && !wheelSpinning) {
            wheelModalOpen = false;
            wheelPrizeBanner = '';
        }
        return;
    }

    // 7. Окно Победы в Дуэли
    if (stageWinModalOpen) {
        if (inBox(pt.x, pt.y, UI_BTN.stageClaimX3)) watchRewardedAd('stageX3');
        else if (inBox(pt.x, pt.y, UI_BTN.stageClaim1)) advanceToNextLevel(1);
        return;
    }

    // 8. Окно Выбора Сферы
    if (pickerModalOpen) {
        const baseT = Math.max(3, maxUnlockedTier - 2);
        const choices = [
            { tier: baseT, mode: 'normal' },
            { tier: baseT + 1, mode: 'normal' },
            { tier: baseT + 2, mode: 'normal' },
            { tier: baseT + 3, mode: 'normal' },
            { tier: baseT + 1, mode: 'bomb' },
            { tier: baseT + 2, mode: 'rainbow' }
        ];
        for (let i = 0; i < 6; i++) {
            const col = i % 3;
            const row = Math.floor(i / 3);
            const bx = 54 + col * 130;
            const by = 260 + row * 135;
            if (pt.x >= bx && pt.x <= bx + 112 && pt.y >= by && pt.y <= by + 118) {
                const ch = choices[i];
                currentOrbTier = ch.tier;
                isBombCurrent = (ch.mode === 'bomb');
                isRainbowCurrent = (ch.mode === 'rainbow');
                pickerModalOpen = false;
                canDrop = true;
                dropCooldown = 0;
                playJackpotFanfare();
                return;
            }
        }
        if (pt.y > 545) pickerModalOpen = false;
        return;
    }

    // 9. Окно Переполнения
    if (isGameOver) {
        if (inBox(pt.x, pt.y, UI_BTN.revive)) watchRewardedAd('revive');
        else if (inBox(pt.x, pt.y, UI_BTN.restart)) finishRun();
        return;
    }

    // Верхние кнопки в бою: Меню, Музыка, Звуки, Язык
    if (inBox(pt.x, pt.y, UI_BTN.homeTop)) { inStartMenu = true; platformGameplayStop(); return; }
    if (inBox(pt.x, pt.y, UI_BTN.music)) {
        musicEnabled = !musicEnabled;
        saveGameState();
        return;
    }
    if (inBox(pt.x, pt.y, UI_BTN.sfx)) {
        soundEnabled = !soundEnabled;
        saveGameState();
        return;
    }
    if (inBox(pt.x, pt.y, UI_BTN.lang)) {
        currentLang = currentLang === 'ru' ? 'en' : 'ru';
        saveGameState();
        return;
    }

    // Подарок за рекламу (раз в 75 секунд, только по явному нажатию)
    if (inBox(pt.x, pt.y, UI_BTN.giftBox)) {
        if (giftTimer <= 0 && !slotMachine.spinning) openAdConfirm('slot777', t.giftConfirmTitle, t.giftConfirmSub);
        return;
    }
    if (inBox(pt.x, pt.y, UI_BTN.nextBox)) return;

    if (flyingDrone.active && Math.hypot(pt.x - flyingDrone.x, pt.y - flyingDrone.y) <= 34) {
        flyingDrone.active = false;
        flyingDrone.timer = 18 + Math.random() * 10;
        boosterCharges.bottomBlast++;
        fireRivalMissile(flyingDrone.x, flyingDrone.y, 450, '#fbbf24');
        spawnSubtleStarburst(flyingDrone.x, flyingDrone.y, 3);
        playJackpotFanfare();
        spawnParticles(flyingDrone.x, flyingDrone.y, '#fbbf24', 18);
        addFloatingScore(flyingDrone.x, flyingDrone.y, t.droneHit, '#fbbf24', 16.5);
        saveGameState();
        return;
    }

    if (inBox(pt.x, pt.y, UI_BTN.bBlast))  { tryUseTacticalBooster('bottomBlast'); return; }
    if (inBox(pt.x, pt.y, UI_BTN.bShake))  { tryUseTacticalBooster('shake'); return; }
    if (inBox(pt.x, pt.y, UI_BTN.bLink))   { tryUseTacticalBooster('laserLink'); return; }
    if (inBox(pt.x, pt.y, UI_BTN.bHammer)) {
        if (hammerMode) hammerMode = false;
        else tryUseTacticalBooster('hammer');
        return;
    }
    if (inBox(pt.x, pt.y, UI_BTN.bPicker)) { tryUseTacticalBooster('picker'); return; }

    if (hammerMode) {
        for (let i = orbs.length - 1; i >= 0; i--) {
            const o = orbs[i];
            if (Math.hypot(pt.x - o.x, pt.y - o.y) <= o.radius + 14) {
                const pal = getOrbColors(o.tier);
                spawnParticles(o.x, o.y, pal.color1, 20);
                fireRivalMissile(o.x, o.y, 320, pal.color1);
                shockRings.push({ x: o.x, y: o.y, r: 8, maxR: o.radius * 3.2, color: '#f43f5e' });
                playPopSound(o.tier + 2, 3);
                orbs.splice(i, 1);
                hammerMode = false;
                canDrop = true;
                dropCooldown = 0;
                saveGameState();
                return;
            }
        }
        hammerMode = false;
        return;
    }

    // Раскалывание льда кликом пальца
    for (let i = orbs.length - 1; i >= 0; i--) {
        const o = orbs[i];
        if (o.frozen > 0 && Math.hypot(pt.x - o.x, pt.y - o.y) <= o.radius + 10) {
            o.frozen--;
            o.scaleX = 1.25;
            o.scaleY = 0.78;
            playIceCrackSound();
            vibrateDevice(15);
            spawnParticles(o.x, o.y, '#38bdf8', 10);
            if (o.frozen <= 0) {
                stars += 5;
                addFloatingScore(o.x, o.y - 20, t.iceBrokenMsg, '#38bdf8', 15);
            }
            return;
        }
    }

    if (pt.y >= 130 && pt.y <= JAR.y + JAR.h + 10) {
        // Начинаем прицеливание; бросок — когда игрок отпустит палец
        aiming = true;
        const r = getOrbRadius(currentOrbTier);
        aimX = Math.max(JAR.x + JAR.wall + r + 2, Math.min(JAR.x + JAR.w - JAR.wall - r - 2, pt.x));
    }
});

function dropCurrentOrb() {
    canDrop = false;
    dropCooldown = 0.26;
    totalDropsCount++;
    if (rival.type === 'drops') rival.dropsLeft = Math.max(0, rival.dropsLeft - 1);
    vibrateDevice(10);

    const orb = createOrb(aimX, JAR.y - 6, currentOrbTier, isRainbowCurrent, false, isChestNext, isBombCurrent, false);
    orb.isGolden = goldenCurrent && !isBombCurrent;
    orb.vy = 265;
    orb.expression = 'surprised';
    orb.exprTimer = 0.45;
    orbs.push(orb);

    isRainbowCurrent = false;
    isBombCurrent = false;
    isChestNext = (totalDropsCount % 9 === 8);
    runDrops++;
    // Перки «Подрывник» и «Джокер»
    if (perkLvl('bomb') && runDrops % perkDef('bomb').n(perkLvl('bomb')) === 0) isBombCurrent = true;
    else if (perkLvl('joker') && runDrops % Math.max(4, perkDef('joker').n(perkLvl('joker')) - (synActive('prism') ? 5 : 0)) === 0) isRainbowCurrent = true;
    goldenCurrent = rollGolden();

    const minLvl = metaUpgrades.minSpawnLvl;
    currentOrbTier = Math.max(minLvl, nextOrbTier);
    // С 4-го уровня в руку иногда приходят сферы крупнее — стакан заполняется быстрее
    const spread = Math.max(2, (currentLevel >= 4 ? 4 : 3) - perkLvl('small'));
    nextOrbTier = minLvl + Math.floor(Math.pow(Math.random(), 1.15) * spread);
    saveGameState();
}

function stepPhysics(dt, now) {
    const t = I18N[currentLang];
    sanitizeOrbsArray();

    PINBALL_BUMPERS.forEach(bmp => {
        bmp.y = bmp.baseY + Math.sin(now * 0.0022 + bmp.phaseOffset) * 78;
    });

    const SUBSTEPS = 6; // 6 подшагов дают идеальный баланс точности и скорости!
    const subDt = dt / SUBSTEPS;
    const gravity = 1220;
    const wallLeft = JAR.x + JAR.wall;
    const wallRight = JAR.x + JAR.w - JAR.wall;
    const floorY = JAR.y + JAR.h - JAR.wall;

    for (let step = 0; step < SUBSTEPS; step++) {
        for (let i = 0; i < orbs.length; i++) {
            const o = orbs[i];
            o.vy += gravity * subDt;
            o.x += o.vx * subDt;
            o.y += o.vy * subDt;
            o.rot += (o.vx * subDt) / o.radius;

            if (step === 0 && o.bumperCooldown <= 0) {
                PINBALL_BUMPERS.forEach(bmp => {
                    const distB = Math.hypot(o.x - bmp.x, o.y - bmp.y);
                    if (distB < o.radius + bmp.r) {
                        o.vx = bmp.side * 330;
                        o.vy = -200;
                        o.scaleX = 1.3;
                        o.scaleY = 0.75;
                        o.bumperCooldown = 0.9;
                        bmp.glowTimer = 0.45;

                        playPopSound(o.tier + 2, 2);
                        const wMode = themeIdx % WORLD_COUNT;
                        if (wMode === 1) {
                            // Вегас: Золотая фишка дает +1 звезду!
                            spawnSubtleStarburst(bmp.x, bmp.y, 1);
                            addFloatingScore(bmp.x + bmp.side * 46, bmp.y, t.gizmoVegasMsg, '#fde047', 13.5);
                        } else if (wMode === 3 && o.frozen > 0) {
                            // Атлантида: Снимает лед при ударе о раковину!
                            o.frozen = 0;
                            addFloatingScore(bmp.x + bmp.side * 46, bmp.y, t.iceBrokenMsg, '#2dd4bf', 13.5);
                        } else if (wMode === 4) {
                            // Токио: Нитро-дрифт ускорение!
                            o.vx = bmp.side * 440;
                            addFloatingScore(bmp.x + bmp.side * 46, bmp.y, t.nitroMsg, '#f43f5e', 13.5);
                        } else {
                            addFloatingScore(bmp.x + bmp.side * 42, bmp.y, t.bumperHitMsg, '#38bdf8', 13.5);
                        }
                        fireRivalMissile(bmp.x, bmp.y, wMode === 5 ? 135 : 85, wMode === 5 ? '#f97316' : '#38bdf8');
                    }
                });
            }

            if (o.x - o.radius < wallLeft) {
                o.x = wallLeft + o.radius;
                if (o.vx < -60) {
                    o.scaleX = 0.82; o.scaleY = 1.18;
                    if (step === 0 && o.vx < -130) wallRipples.push({ x: wallLeft, y: o.y, life: 0.35, col: getOrbColors(o.tier).color1 });
                }
                o.vx = -o.vx * 0.36;
            }
            if (o.x + o.radius > wallRight) {
                o.x = wallRight - o.radius;
                if (o.vx > 60) {
                    o.scaleX = 0.82; o.scaleY = 1.18;
                    if (step === 0 && o.vx > 130) wallRipples.push({ x: wallRight, y: o.y, life: 0.35, col: getOrbColors(o.tier).color1 });
                }
                o.vx = -o.vx * 0.36;
            }
            if (o.y + o.radius > floorY) {
                o.y = floorY - o.radius;
                if (o.vy > 90) {
                    const deform = Math.min(0.28, o.vy / 1150);
                    o.scaleX = 1 + deform;
                    o.scaleY = 1 - deform;
                }
                o.vy = -o.vy * 0.24;
                o.vx *= 0.92;
            }
        }

        for (let i = 0; i < orbs.length; i++) {
            for (let j = i + 1; j < orbs.length; j++) {
                const a = orbs[i];
                const b = orbs[j];
                if (!a || !b || a.merging || b.merging) continue;

                const dx = b.x - a.x;
                const dy = b.y - a.y;
                const dist = Math.hypot(dx, dy);
                const minDist = a.radius + b.radius;

                const canAttract = !a.isStone && !b.isStone && a.frozen === 0 && b.frozen === 0 && a.tier === b.tier;
                if (canAttract && dist < minDist * 1.14 && dist > minDist) {
                    const pull = 28 * (1 + perkLvl('magnet') * 2.5) * subDt;
                    a.vx += (dx / dist) * pull;
                    a.vy += (dy / dist) * pull;
                    b.vx -= (dx / dist) * pull;
                    b.vy -= (dy / dist) * pull;
                }

                if (dist < minDist && dist > 0.0001) {
                    if (a.isBomb || b.isBomb) {
                        const bomb = a.isBomb ? a : b;
                        detonateBombOrb(bomb.x, bomb.y);
                        a.merging = true;
                        b.merging = true;
                        continue;
                    }

                    const neitherBlocked = !a.isStone && !b.isStone && a.frozen === 0 && b.frozen === 0;
                    const canMerge = neitherBlocked && (a.tier === b.tier || a.isRainbow || b.isRainbow);

                    if (canMerge) {
                        a.merging = true;
                        b.merging = true;
                        const hadChest = a.isChest || b.isChest;
                        const newTier = Math.max(a.tier, b.tier) + 1;
                        handleOrbMerge((a.x + b.x) / 2, (a.y + b.y) / 2, newTier, hadChest);
                        if (a.isGolden || b.isGolden) goldenJackpot((a.x + b.x) / 2, (a.y + b.y) / 2);
                        continue;
                    }

                    const nx = dx / dist;
                    const ny = dy / dist;
                    const overlap = minDist - dist;
                    const massA = a.radius * a.radius;
                    const massB = b.radius * b.radius;
                    const totalMass = massA + massB;

                    a.x -= nx * overlap * (massB / totalMass);
                    a.y -= ny * overlap * (massB / totalMass);
                    b.x += nx * overlap * (massA / totalMass);
                    b.y += ny * overlap * (massA / totalMass);

                    const rvx = b.vx - a.vx;
                    const rvy = b.vy - a.vy;
                    const velAlongNormal = rvx * nx + rvy * ny;

                    if (velAlongNormal < 0) {
                        const jImpulse = -(1 + 0.28) * velAlongNormal / (1 / massA + 1 / massB);
                        a.vx -= (jImpulse * nx) / massA;
                        a.vy -= (jImpulse * ny) / massA;
                        b.vx += (jImpulse * nx) / massB;
                        b.vy += (jImpulse * ny) / massB;
                    }
                }
            }
        }

        sanitizeOrbsArray();
    }

    orbs.forEach(o => {
        o.age += dt;
        o.unmergedTime += dt;
        o.breathPhase += dt * 3.5;
        if (o.bumperCooldown > 0) o.bumperCooldown -= dt;

        const speed = Math.hypot(o.vx, o.vy);
        if (speed > 150) {
            o.trail.push({ x: o.x, y: o.y, r: o.radius * 0.72 });
            if (o.trail.length > 4) o.trail.shift();
        } else if (o.trail.length > 0) {
            o.trail.shift();
        }

        o.scaleX += (1 - o.scaleX) * 14 * dt;
        o.scaleY += (1 - o.scaleY) * 14 * dt;

        if (o.exprTimer > 0) {
            o.exprTimer -= dt;
            if (o.exprTimer <= 0) o.expression = 'happy';
        }
        o.blinkTimer -= dt;
        if (o.blinkTimer <= 0) {
            o.isBlinking = !o.isBlinking;
            o.blinkTimer = o.isBlinking ? 0.14 : (2.0 + Math.random() * 3.5);
        }
        const targetLX = Math.max(-4, Math.min(4, (aimX - o.x) * 0.025));
        const targetLY = Math.max(-4, Math.min(4, (JAR.y - o.y) * 0.015));
        o.lookX += (targetLX - o.lookX) * 6 * dt;
        o.lookY += (targetLY - o.lookY) * 6 * dt;
    });
}

function detonateBombOrb(bx, by) {
    const t = I18N[currentLang];
    vibrateDevice(50);
    jarShakeY = 16;
    screenFlashAlpha = 0.4;
    shockRings.push({ x: bx, y: by, r: 15, maxR: 220, color: '#f43f5e' });

    shatterNearbyHazards(bx, by, 180);
    if (synActive('icebomb')) fireRivalMissile(bx, by, pctHp(0.04), '#bae6fd');

    orbs.forEach(o => {
        if (Math.hypot(o.x - bx, o.y - by) < 140 && o.tier < maxUnlockedTier) {
            o.merging = true;
            spawnParticles(o.x, o.y, '#fbbf24', 12);
            fireRivalMissile(o.x, o.y, 220, '#f43f5e');
        }
    });
    playJackpotFanfare();
    addFloatingScore(bx, by - 25, t.bombExplodedMsg, '#fbbf24', 16.5);
}

function handleOrbMerge(mx, my, newTier, hadChest = false) {
    const t = I18N[currentLang];
    const r = getOrbRadius(newTier);
    const pal = getOrbColors(newTier);
    const merged = createOrb(mx, my, newTier, false, true, false, false, false);
    merged.vy = -100;
    merged.expression = 'excited';
    merged.exprTimer = 1.8;
    orbs.push(merged);

    shatterNearbyHazards(mx, my, r * 3.5);

    orbs.forEach(other => {
        if (other.id === merged.id) return;
        const dx = other.x - mx;
        const dy = other.y - my;
        const d = Math.hypot(dx, dy);
        const blastRadius = r * 2.8;
        if (d > 1 && d < blastRadius) {
            const force = (1 - d / blastRadius) * (110 + Math.min(10, newTier) * 18);
            other.vx += (dx / d) * force;
            other.vy += (dy / d) * force - 45;
            other.scaleX = 1.18;
            other.scaleY = 0.82;
            other.unmergedTime = 0;
        }
    });

    vibrateDevice(15 + Math.min(10, newTier) * 3);
    jarShakeX = (Math.random() - 0.5) * 11;
    jarShakeY = 8;

    combo++;
    comboResetTimer = 2.5 + perkLvl('frenzy') * 0.8;
    mergeCount++;
    questEvent('merge', 1);
    questEvent('tier', newTier);
    questEvent('combo', combo);

    // Баннер комбо по центру экрана + звуковая «лесенка»
    if (combo >= 2) {
        const words = t.comboWords;
        comboBanner = {
            text: `${words[Math.min(words.length - 1, combo)]}  x${combo}`,
            t: 1.1,
            color: ['#fde047', '#4ade80', '#38bdf8', '#f472b6', '#f97316', '#c084fc'][combo % 6],
            combo
        };
        playComboSound(combo);
        if (combo >= 4) { screenFlashAlpha = Math.max(screenFlashAlpha, 0.12); burstRays.push({ x: mx, y: my, life: 0.7, color: comboBanner.color }); }
    }
    // Крупные слияния: короткое замедление времени и лучи
    if (newTier >= 6) {
        hitStopTimer = Math.max(hitStopTimer, 0.09 + Math.min(0.12, (newTier - 6) * 0.03));
        burstRays.push({ x: mx, y: my, life: 0.9, color: pal.color1 });
    }

    if (!tutorialDone && tutorialStep === 1) { tutorialStep = 2; tutorialHoldT = 0; }

    // Отбил атаку босса: собрал нужную сферу до конца таймера
    if (rival.tele && newTier >= rival.tele.needTier) counterSuccess();

    if (newTier > maxUnlockedTier) {
        maxUnlockedTier = newTier;
        stars += 25;
        fireFourCornerCannons();
        if (newTier >= 4) newHeroOverlay = { t: 1.8, tier: newTier };
    }

    let hotMult = 1;
    if (newTier === rival.hotOrderTier) {
        hotMult = 2.5 + perkLvl('order') * 1.5;
        rival.shieldActive = false;
        stars += 15;
        rival.hotOrderTier = 3 + Math.floor(Math.random() * 4);
        addFloatingScore(VW / 2, 205, t.hotOrderDone, '#4ade80', 15.5);
    }

    // Заряд шкалы КЛУБНОГО КУРАЖА (FEVER MODE X2)
    if (feverActiveTimer <= 0) {
        feverMeter = Math.min(100, feverMeter + (9 + Math.min(12, newTier * 2)) * (1 + perkLvl('fever') * 0.35));
        if (feverMeter >= 100) {
            feverMeter = 0;
            feverActiveTimer = 8.0 + perkLvl('fever') * 4;
            orbs.forEach(o => { o.frozen = 0; });
            playJackpotFanfare();
            fireFourCornerCannons();
            addFloatingScore(VW / 2, 215, t.feverStartMsg, '#fde047', 16.5);
        }
    }

    // В Неоновом Токио (Мир 5) комбо x3+ вызывает Удар Катаны по преградам!
    if ((themeIdx % WORLD_COUNT) === 4 && combo >= 3) {
        shatterNearbyHazards(VW / 2, JAR.y + JAR.h / 2, 260);
        addFloatingScore(mx, my - 34, t.gizmoKatanaMsg, '#f43f5e', 14.5);
    }

    // Шанс КРИТИЧЕСКОГО СЛИЯНИЯ Х3 при комбо!
    let critMult = 1;
    if (combo >= 2 && Math.random() < 0.28 + perkLvl('crit') * 0.12) {
        critMult = (synActive('crusher') && newTier >= 6) ? 4 : 2.5;
        shockRings.push({ x: mx, y: my, r: r * 0.4, maxR: r * 3.4, color: '#fde047' });
        addFloatingScore(mx, my - 36, t.critMergeMsg, '#fde047', 17.5);
    }

    const rawDmg = getCalibratedBossDamage(newTier);
    const comboMult = 1 + Math.min(1.5, (combo - 1) * 0.25);
    const upgMult = 1 + (metaUpgrades.bossDmgLvl - 1) * 0.25;
    const heavyMult = newTier >= 6 ? 1 + perkLvl('heavy') * 0.5 : 1;
    const baseDmg = Math.ceil(rawDmg * comboMult * upgMult * hotMult * critMult * heavyMult);
    fireRivalMissile(mx, my, baseDmg, critMult > 1 ? '#fde047' : pal.color1);
    // Перк «Эхо»: повтор удара
    if (perkLvl('echo') && mergeCount % perkDef('echo').n(perkLvl('echo')) === 0) fireRivalMissile(mx, my, baseDmg, '#c4b5fd');
    // Синергия «Грозовой кураж»
    if (synActive('storm') && feverActiveTimer > 0) fireRivalMissile(mx, my, pctHp(0.01), '#a5f3fc');
    // Перк «Цепная молния»
    if (perkLvl('bolt') && combo >= 4 && combo % 2 === 0) {
        fireRivalMissile(mx, my, pctHp(perkLvl('bolt') * 0.01), '#a5f3fc');
        laserLinkBeams.push({ ax: mx, ay: my, bx: 52, by: 88, color: '#a5f3fc', life: 0.5 });
    }

    if (newTier >= 7) {
        milestoneOverlay.timer = 1.15;
        milestoneOverlay.numStr = formatOrbNumber(newTier);
        milestoneOverlay.color = pal.color1;
        screenFlashAlpha = 0.28;
        floorLaserEffect = 0.75;
        fireFourCornerCannons();
    }

    addScoreAndCheckLeague(getOrbScore(newTier) * combo);

    if (newTier >= 2 || hadChest) {
        spawnSubtleStarburst(mx, my, hadChest ? 3 : 2);
    }

    playPopSound(newTier, combo);
    spawnParticles(mx, my, pal.color1, 12);
    shockRings.push({ x: mx, y: my, r: r * 0.5, maxR: r * 2.5, color: pal.glow });

    const labelTxt = combo > 1 ? `💥-${baseDmg} HP (x${combo}🔥)` : `💥-${baseDmg} HP`;
    addFloatingScore(mx, my - 15, labelTxt, pal.color1, combo > 1 ? 19 : 15.5);
    saveGameState();
}

// ============================================================================
// 8. ГЛАВНЫЙ ЦИКЛ И СУПЕР-ЖИВАЯ ОТРИСОВКА ФИГУР (БЕЗ SHADOWBLUR!)
// ============================================================================
let lastFrame = performance.now();

function gameLoop(now) {
    requestAnimationFrame(gameLoop);
    let dt = (now - lastFrame) / 1000;
    lastFrame = now;
    if (dt > 0.05) dt = 0.05;
    const realDt = dt;

    // Хит-стоп: на крупных слияниях и нокауте время на миг замедляется
    if (hitStopTimer > 0) {
        hitStopTimer = Math.max(0, hitStopTimer - realDt);
        dt *= 0.2;
    }
    if (koTimer > 0) {
        koTimer = Math.max(0, koTimer - realDt);
        if (koTimer <= 0) {
            stageWinModalOpen = true;
            if (pendingEnding) { pendingEnding = false; endingModal.open = true; }
            victoryAnimT = 0;
            platformGameplayStop();
        }
    }
    if (stageWinModalOpen) {
        const before = victoryAnimT;
        victoryAnimT += realDt;
        for (let i = 0; i < victoryStars; i++) {
            const at = 0.35 + i * 0.35;
            if (before < at && victoryAnimT >= at) { playStarDing(i); vibrateDevice(25); spawnConfettiShower(); }
        }
    }
    if (comboBanner.t > 0) comboBanner.t = Math.max(0, comboBanner.t - realDt);
    if (newHeroOverlay.t > 0) newHeroOverlay.t = Math.max(0, newHeroOverlay.t - realDt);
    for (let i = bossDmgPops.length - 1; i >= 0; i--) {
        bossDmgPops[i].life -= realDt;
        bossDmgPops[i].y -= 30 * realDt;
        if (bossDmgPops[i].life <= 0) bossDmgPops.splice(i, 1);
    }
    for (let i = burstRays.length - 1; i >= 0; i--) {
        burstRays[i].life -= realDt;
        if (burstRays[i].life <= 0) burstRays.splice(i, 1);
    }
    if (!tutorialDone && !inStartMenu) {
        tutorialHoldT += realDt;
        if (tutorialStep === 2 && tutorialHoldT > 4.5) { tutorialDone = true; saveGameState(); }
    }

    beatPulse = Math.max(0, beatPulse - dt * 3.5);
    hudBounceScale += (1.0 - hudBounceScale) * 15 * dt;
    rival.hitScale += (1.0 - rival.hitScale) * 14 * dt;
    rival.shakeX *= 0.82;
    if (rival.flashTimer > 0) rival.flashTimer = Math.max(0, rival.flashTimer - dt);
    if (rival.beamTimer > 0) rival.beamTimer = Math.max(0, rival.beamTimer - dt);
    if (milestoneOverlay.timer > 0) milestoneOverlay.timer = Math.max(0, milestoneOverlay.timer - dt);
    if (screenFlashAlpha > 0) screenFlashAlpha = Math.max(0, screenFlashAlpha - dt * 1.5);
    if (floorLaserEffect > 0) floorLaserEffect = Math.max(0, floorLaserEffect - dt * 1.8);

    PINBALL_BUMPERS.forEach(b => { if (b.glowTimer > 0) b.glowTimer = Math.max(0, b.glowTimer - dt); });
    for (let i = 0; i < 16; i++) eqBars[i] = Math.max(0.1, eqBars[i] - dt * 0.9);

    if (!canDrop) {
        dropCooldown -= dt;
        if (dropCooldown <= 0) {
            dropCooldown = 0;
            canDrop = true;
        }
    }

    slotMachine.leverPull += (0 - slotMachine.leverPull) * 8 * dt;
    if (slotMachine.spinning) {
        slotMachine.spinTimer -= dt;
        if (Math.random() < 0.45) {
            slotMachine.reels = [
                SLOT_SYMBOLS[Math.floor(Math.random() * SLOT_SYMBOLS.length)],
                SLOT_SYMBOLS[Math.floor(Math.random() * SLOT_SYMBOLS.length)],
                SLOT_SYMBOLS[Math.floor(Math.random() * SLOT_SYMBOLS.length)]
            ];
        }
        if (slotMachine.spinTimer <= 0) finishSlotSpin();
    }

    for (let i = vaultMissiles.length - 1; i >= 0; i--) {
        const vm = vaultMissiles[i];
        vm.age += dt;
        const tx = 148;
        const ty = 88;
        const dx = tx - vm.x;
        const dy = ty - vm.y;
        const dist = Math.hypot(dx, dy);

        const pull = 16 + vm.age * 42;
        vm.vx += (dx * pull - vm.vx * 4) * dt;
        vm.vy += (dy * pull - vm.vy * 4) * dt;
        vm.x += vm.vx * dt;
        vm.y += vm.vy * dt;

        if (dist < 28 || vm.age > 1.1) {
            damageRival(vm.damage);
            vaultMissiles.splice(i, 1);
        }
    }

    const anyModal = inStartMenu || leaderboardModalOpen || dailyModalOpen || wheelModalOpen || empireModalOpen || stageWinModalOpen || upgModalOpen || pickerModalOpen || isGameOver || adConfirm.open || adPlaying || koTimer > 0 || chestModal.open || collectionModalOpen || perkModal.open || runEndModal.open || questsModalOpen || endingModal.open;
    if (perkModal.open) perkModal.t += realDt;
    if (chestModal.open) {
        chestModal.t += realDt;
        if (chestModal.phase === 1 && chestModal.t > 0.75) {
            chestModal.phase = 2; chestModal.t = 0;
            spawnConfettiShower(); fireFourCornerCannons(); playVictoryFanfare(); vibrateDevice(80);
            burstRays.push({ x: VW / 2, y: 330, life: 1.6, color: ['#fde047', '#38bdf8', '#e879f9'][chestModal.rarity] });
        }
    }

    if (wheelModalOpen) {
        updateWheelPhysics(dt);
    } else if (!anyModal) {
        if (feverActiveTimer > 0) {
            feverActiveTimer = Math.max(0, feverActiveTimer - dt);
        }
        levelTimer += dt;
        if (lavaTimer > 0) lavaTimer = Math.max(0, lavaTimer - dt);
        if (giftTimer > 0) giftTimer = Math.max(0, giftTimer - dt);
        if (levelIntroT > 0) levelIntroT = Math.max(0, levelIntroT - dt);
        if (rival.stunTimer > 0) rival.stunTimer = Math.max(0, rival.stunTimer - dt);
        if (perkLvl('turret')) {
            perkTurretT -= dt;
            if (perkTurretT <= 0) {
                perkTurretT = 3;
                fireRivalMissile(JAR.x + JAR.w - 20, JAR.y, pctHp(perkLvl('turret') * 0.004), '#4ade80');
            }
        }
        if (rival.tele) {
            rival.tele.t -= dt;
            if (rival.tele.t <= 0) { const mv = rival.tele.move; rival.tele = null; triggerSignatureMove(mv); }
        }
        if (rival.type === 'timer' && levelIntroT <= 0) {
            rival.timeLeft -= dt;
            if (rival.timeLeft <= 0) { rival.timeLeft = 0; endRun('time'); }
        }
        if (rival.type === 'drops' && rival.dropsLeft <= 0) {
            outOfDropsT += dt;
            if (outOfDropsT > 3) endRun('drops');
        } else {
            outOfDropsT = 0;
        }

        // Уникальная свистоплюшка локации внутри стакана каждые 7 секунд
        worldGizmoTimer -= dt;
        if (worldGizmoTimer <= 0) {
            worldGizmoTimer = 7.0;
            const wMode = themeIdx % WORLD_COUNT;
            const gx = VW / 2;
            const gy = JAR.y + 215;
            if (wMode === 0 && orbs.length > 0) {
                // Кибер-портал в центре стакана бьет молнией Босса от ближайшей сферы
                fireRivalMissile(gx, gy, 140 + currentLevel * 25, '#38bdf8');
                shockRings.push({ x: gx, y: gy, r: 8, maxR: 65, color: '#38bdf8' });
            } else if (wMode === 2 && orbs.length >= 2) {
                // Грави-пульсар Сатурна мягко стягивает одинаковые фигуры к центру
                orbs.forEach(o => {
                    o.vx += (gx - o.x) * 0.9;
                    o.vy -= 65;
                });
                shockRings.push({ x: gx, y: gy, r: 60, maxR: 65, color: '#c084fc' });
            } else if (wMode === 3 && orbs.length > 0) {
                // Гейзер Атлантиды со дна стакана подбрасывает шары и смывает лед!
                orbs.forEach(o => {
                    if (o.y > JAR.y + JAR.h - 140) {
                        o.vy = -260;
                        if (o.frozen > 0) o.frozen = Math.max(0, o.frozen - 1);
                    }
                });
                spawnParticles(VW / 2, JAR.y + JAR.h - 20, '#2dd4bf', 10);
            }
        }

        if (!rival.tele && rival.stunTimer <= 0 && (tutorialDone || currentLevel > 1)) {
            rival.trickTimer -= dt * (rival.enraged ? 1.35 : 1.0);
        }
        if (rival.trickTimer <= 0) {
            rival.trickTimer = rival.trickInterval;
            triggerRivalTrick();
        }

        if (metaUpgrades.turretLvl > 1) {
            autoTurretTimer -= dt;
            if (autoTurretTimer <= 0) {
                autoTurretTimer = 1.5;
                fireRivalMissile(JAR.x + 20, JAR.y, (metaUpgrades.turretLvl - 1) * 35, '#4ade80');
            }
        }

        if (comboResetTimer > 0) {
            comboResetTimer -= dt;
            if (comboResetTimer <= 0) combo = 0;
        }

        if (flyingDrone.active) {
            flyingDrone.phase += dt * 5;
            flyingDrone.x += flyingDrone.vx * dt;
            flyingDrone.y = 182 + Math.sin(flyingDrone.phase) * 12;
            if (flyingDrone.x > VW + 70) {
                flyingDrone.active = false;
                flyingDrone.timer = 18 + Math.random() * 10;
            }
        } else {
            flyingDrone.timer -= dt;
            if (flyingDrone.timer <= 0) {
                flyingDrone.active = true;
                flyingDrone.x = -50;
                flyingDrone.y = 182;
            }
        }

        stepPhysics(dt, now);

        const dY = getDangerY();
        const overflowing = orbs.some(o => o.age > 1.2 && !o.merging && (o.y - o.radius) < dY);
        if (overflowing) {
            dangerTimer += dt;
            if (dangerTimer >= BALANCE.dangerSeconds + perkLvl('guard') + (synActive('harbor') ? 1.5 : 0)) endRun('overflow');
        } else {
            dangerTimer = Math.max(0, dangerTimer - dt * 2);
        }
        // Насколько высоко куча (0 — дно, 1 — линия смерти): для звёзд и красной виньетки
        let topY = JAR.y + JAR.h;
        orbs.forEach(o => { if (o.age > 1.2 && !o.isStone) topY = Math.min(topY, o.y - o.radius); });
        const fill = Math.max(0, Math.min(1, (JAR.y + JAR.h - topY) / (JAR.y + JAR.h - dY)));
        peakDanger = Math.max(peakDanger, fill);
        dangerVignette += ((fill > 0.72 ? (fill - 0.72) / 0.28 : 0) - dangerVignette) * 4 * dt;
    }

    for (let i = flyingStars.length - 1; i >= 0; i--) {
        const fs = flyingStars[i];
        if (fs.delay > 0) { fs.delay -= dt; continue; }
        fs.age += dt;
        fs.rot += dt * 10;
        const targetX = 128;
        const targetY = 25;
        const dx = targetX - fs.x;
        const dy = targetY - fs.y;
        const dist = Math.hypot(dx, dy);

        const pull = 14 + fs.age * 36;
        fs.vx += (dx * pull - fs.vx * 4) * dt;
        fs.vy += (dy * pull - fs.vy * 4) * dt;
        fs.x += fs.vx * dt;
        fs.y += fs.vy * dt;

        if (dist < 24 || fs.age > 1.2) {
            stars += 1;
            hudBounceScale = 1.12;
