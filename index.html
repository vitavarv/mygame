// ПРЕМИАЛЬНЫЕ ФОНЫ МИРОВ: статичные слои рисуются один раз, живое — поверх
// ============================================================================
const worldStatic = {};
const worldParts = {};
function wRand(seed) { return mulberry32(seed); }
function wCanvas() { const c = document.createElement('canvas'); c.width = VW; c.height = VH; return c; }
function skyGrad(g, stops) {
    const gr = g.createLinearGradient(0, 0, 0, VH);
    stops.forEach(([p, col]) => gr.addColorStop(p, col));
    g.fillStyle = gr; g.fillRect(0, 0, VW, VH);
}
function softBlob(g, x, y, r, col, a) {
    g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = a;
    g.drawImage(getGlowSprite(col), x - r, y - r, r * 2, r * 2);
    g.restore();
}
function ridge(g, rnd, baseY, amp, step, col, jag) {
    g.fillStyle = col;
    g.beginPath(); g.moveTo(0, VH);
    let y = baseY;
    for (let x = 0; x <= VW + step; x += step) {
        y = baseY + (rnd() - 0.5) * amp * (jag ? 1 : 0.6) + Math.sin(x * 0.012) * amp * 0.5;
        g.lineTo(x, y);
    }
    g.lineTo(VW, VH); g.closePath(); g.fill();
}
function skyline(g, rnd, baseY, minH, maxH, col, winCol, winA) {
    let x = -10;
    while (x < VW + 10) {
        const w = 22 + rnd() * 46, h = minH + rnd() * (maxH - minH);
        g.fillStyle = col;
        g.fillRect(x, baseY - h, w, h + 400);
        if (rnd() < 0.35) g.fillRect(x + w * 0.4, baseY - h - 14 - rnd() * 20, 2, 30);
        if (winCol) {
            g.fillStyle = winCol;
            for (let wy = baseY - h + 8; wy < baseY - 6; wy += 9)
                for (let wx = x + 4; wx < x + w - 4; wx += 7)
                    if (rnd() < winA) g.fillRect(wx, wy, 2.5, 3);
        }
        x += w + 2 + rnd() * 6;
    }
}
function getWorldStatic(mode) {
    if (worldStatic[mode]) return worldStatic[mode];
    const far = wCanvas(), near = wCanvas();
    const gf = far.getContext('2d'), gn = near.getContext('2d');
    const rnd = wRand(1000 + mode * 77);

// Фон рисуется в половинном разрешении: получается мягкая «глубина резкости», и это быстрее
function drawBackgroundLayer(now, dt) {
    const W = window.innerWidth, H = window.innerHeight;
    if (!bgLayer) {
        const c = document.createElement('canvas');
        const q = 0.6;
        c.width = Math.max(2, Math.ceil(W * q));
        c.height = Math.max(2, Math.ceil(H * q));
        bgLayer = { c, g: c.getContext('2d'), q };
        // Готовая виньетка и затемнение — один раз
        const v = document.createElement('canvas');
        v.width = c.width; v.height = c.height;
        const vg = v.getContext('2d');
        const lin = vg.createLinearGradient(0, 0, 0, v.height);
        lin.addColorStop(0, 'rgba(3, 4, 12, 0.35)');
        lin.addColorStop(0.35, 'rgba(3, 4, 12, 0.08)');
        lin.addColorStop(1, 'rgba(3, 4, 12, 0.45)');
        vg.fillStyle = lin; vg.fillRect(0, 0, v.width, v.height);
        const rad = vg.createRadialGradient(v.width / 2, v.height * 0.55, Math.min(v.width, v.height) * 0.25, v.width / 2, v.height * 0.55, Math.max(v.width, v.height) * 0.75);
        rad.addColorStop(0, 'rgba(0,0,0,0)');
        rad.addColorStop(1, 'rgba(0,0,0,0.6)');
        vg.fillStyle = rad; vg.fillRect(0, 0, v.width, v.height);
        bgLayer.v = v;
    }
    const { c, g, q } = bgLayer;
    // Фон мягкий и неподвижный по сравнению со стаканом — обновляем его через кадр
    bgLayer.acc = (bgLayer.acc || 0) + dt;
    bgLayer.n = (bgLayer.n || 0) + 1;
    if (bgLayer.drawn && bgLayer.n % 2 === 0) {
        ctx.save();
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(c, 0, 0, W, H);
        ctx.restore();
        return;
    }
    dt = bgLayer.acc;
    bgLayer.acc = 0;
    bgLayer.drawn = true;
    const coverScale = Math.max(W / VW, H / VH);
    g.setTransform(q, 0, 0, q, 0, 0);
    g.translate((W - VW * coverScale) / 2, (H - VH * coverScale) / 2);
    g.scale(coverScale, coverScale);
    g.save();
    drawPremiumWorld(now, dt, g);
    g.restore();
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'source-over';
    g.drawImage(bgLayer.v, 0, 0);
    ctx.save();
    ctx.imageSmoothingEnabled = true;
    try { ctx.imageSmoothingQuality = 'high'; } catch (e) {}
    ctx.drawImage(c, 0, 0, W, H);
    ctx.restore();
}

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    shockRings.forEach(s => {
        const k = Math.min(1, s.r / s.maxR);
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 0.6 + 2.4 * (1 - k);
        ctx.globalAlpha = Math.pow(1 - k, 1.4) * 0.9;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.stroke();
    });
    // Искры: светящиеся штрихи по направлению полёта
    ctx.lineCap = 'round';
    particles.forEach(p => {
        const k = Math.max(0, p.life / p.maxLife);
        ctx.globalAlpha = k * 0.55;
        const gs = p.r * 5;
        ctx.drawImage(getGlowSprite(p.color), p.x - gs / 2, p.y - gs / 2, gs, gs);
        ctx.globalAlpha = k;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = Math.max(0.8, p.r * 0.45);
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.025, p.y - p.vy * 0.025); ctx.stroke();
    });
    cornerStreamers.forEach(cs => {
        const k = Math.min(1, cs.life);
        ctx.globalAlpha = k * 0.6;
        const gs = cs.size * 4;
        ctx.drawImage(getGlowSprite(cs.color), cs.x - gs / 2, cs.y - gs / 2, gs, gs);
        ctx.globalAlpha = k;
        ctx.fillStyle = '#fffbeb';
        ctx.beginPath(); ctx.arc(cs.x, cs.y, cs.size * 0.35, 0, Math.PI * 2); ctx.fill();
    });
    // Звёздные искры: четырёхлучевые блики
    flyingStars.forEach(fs => {
        if (fs.delay > 0) return;
        ctx.save();
        ctx.translate(fs.x, fs.y);
        ctx.rotate(fs.rot * 0.3);
        ctx.globalAlpha = 0.9;
        const s = fs.kind === 'star' ? 9 : 6;
        ctx.drawImage(getGlowSprite('#fbbf24'), -s * 2, -s * 2, s * 4, s * 4);
        ctx.fillStyle = '#fffbeb';
        ctx.beginPath();
        ctx.moveTo(0, -s); ctx.quadraticCurveTo(0, 0, s, 0); ctx.quadraticCurveTo(0, 0, 0, s); ctx.quadraticCurveTo(0, 0, -s, 0); ctx.quadraticCurveTo(0, 0, 0, -s);
        ctx.fill();
        ctx.restore();
    });
    ctx.restore();
    ctx.globalAlpha = 1;

    floatingLabels.forEach(fl => {
        ctx.font = `800 ${fl.size}px ${UIF}`;
        ctx.textAlign = 'center';
        ctx.globalAlpha = Math.min(1, fl.life * 1.8);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
        ctx.fillText(fl.txt, fl.x, fl.y + 1.5);
        ctx.fillStyle = fl.color;
        ctx.fillText(fl.txt, fl.x, fl.y);
    });
    ctx.globalAlpha = 1;

    drawProgressiveBoosterBtn(UI_BTN.bBlast,  'bottomBlast', '#b91c1c', '#f97316', t.b1_1, t.b1_2, t);
    drawProgressiveBoosterBtn(UI_BTN.bPick,   'pickaxe',     '#475569', '#94a3b8', L('⛏️ КИРКА', '⛏️ PICK'), L('КАМНИ', 'STONES'), t);
    drawProgressiveBoosterBtn(UI_BTN.bShake,  'shake',       '#0369a1', '#06b6d4', t.b2_1, t.b2_2, t);
    drawProgressiveBoosterBtn(UI_BTN.bLink,   'laserLink',   '#1d4ed8', '#38bdf8', t.b3_1, t.b3_2, t);
    drawProgressiveBoosterBtn(UI_BTN.bHammer, 'hammer',      '#7e22ce', '#ec4899', t.b4_1, t.b4_2, t);
    drawProgressiveBoosterBtn(UI_BTN.bPicker, 'picker',      '#b45309', '#eab308', t.b5_1, t.b5_2, t);

    if (screenFlashAlpha > 0) {
        // Вспышка — мягкий свет из центра, а не заливка
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const fg = ctx.createRadialGradient(VW / 2, 420, 40, VW / 2, 420, 560);
        fg.addColorStop(0, `rgba(255, 244, 214, ${screenFlashAlpha * 0.55})`);
        fg.addColorStop(1, 'rgba(255, 244, 214, 0)');
        ctx.fillStyle = fg;
        ctx.fillRect(0, 0, VW, VH);
        ctx.restore();
    }

    renderPerkRow(now);
    renderJuiceOverlays(t, now);

    if (wheelModalOpen) renderLuckyWheelModal(t, now);
    if (dailyModalOpen) renderDailyLoginModal(t, now);
    if (leaderboardModalOpen) renderLeaderboardModal(t, now);
    if (empireModalOpen) renderCityModal(t, now);
    if (stageWinModalOpen) renderStageMapVictoryModal(t, now);
    if (pickerModalOpen) renderShapePickerModal(t, now);
    if (upgModalOpen) renderMetaUpgradesModal(t, now);
    if (perkModal.open) renderPerkModal(t, now);
    if (runEndModal.open) renderRunEndModal(t, now);
    if (endingModal.open) renderEndingModal(t, now);
    if (adConfirm.open) renderAdConfirmModal(t, now);

    if (isGameOver) {
        ctx.fillStyle = 'rgba(6, 5, 18, 0.9)';
        ctx.fillRect(0, 0, VW, VH);

        drawRoundedPanel(45, 250, 390, 340, 26, 'rgba(10, 13, 24, 0.97)', '#f43f5e');
        ctx.textAlign = 'center';
        drawFancyTitle(gameOverReason === 'drops' ? t.outDrops : gameOverReason === 'time' ? t.outTime : t.outOverflow, VW / 2, 305, 25, '#fecdd3', '#e11d48', '#e11d48');

        ctx.fillStyle = '#e2e8f0';
        ctx.font = '800 16px ' + UIF;
        ctx.fillText(`${t.yourScore} ${score}   |   ${t.best} #${currentLevel}`, VW / 2, 348);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '600 14px ' + UIF;
        // «Почти победил»: сколько HP осталось боссу
        const leftPct = Math.max(1, Math.ceil(rival.hp / rival.maxHp * 100));
        ctx.fillStyle = '#fde047';
        ctx.font = '900 15px ' + UIF;
        ctx.fillText(`${t.bossLeft} ${leftPct}% HP!`, VW / 2, 382);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.beginPath(); ctx.roundRect(100, 394, 280, 14, 7); ctx.fill();
        { const hg = ctx.createLinearGradient(0, 394, 0, 408); hg.addColorStop(0, '#f87171'); hg.addColorStop(1, '#7f1d1d'); ctx.fillStyle = hg; }
        ctx.beginPath(); ctx.roundRect(100, 394, Math.max(10, 280 * leftPct / 100), 14, 7); ctx.fill();

        drawRoundedPanel(UI_BTN.revive.x, UI_BTN.revive.y, UI_BTN.revive.w, UI_BTN.revive.h, 16, '#10b981', '#6ee7b7');
        ctx.fillStyle = '#052e16';
        ctx.font = '900 15px ' + UIF;
        ctx.fillText(revivesThisLevel >= REVIVE_LIMIT ? L('Спасения на этом уровне закончились', 'No more saves on this level')
            : (gameOverReason === 'drops' ? t.reviveDrops : gameOverReason === 'time' ? t.reviveTime : t.reviveBtn), VW / 2, UI_BTN.revive.y + 38);

        drawRoundedPanel(UI_BTN.restart.x, UI_BTN.restart.y, UI_BTN.restart.w, UI_BTN.restart.h, 12, '#1e293b', '#475569');
        ctx.fillStyle = '#cbd5e1';
        ctx.font = '800 14px ' + UIF;
        ctx.fillText(t.endRun, VW / 2, UI_BTN.restart.y + 28);
    }

    confetti.forEach(c => {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.rot);
        ctx.fillStyle = c.color;
        ctx.globalAlpha = Math.min(1, c.life);
        ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
        ctx.restore();
    });
    renderFakeAd();

    ctx.restore();
}

function renderFakeAd() {
    if (!fakeAd) return;
    ctx.save();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000000';
    ctx.fillRect(-500, -500, VW + 1000, VH + 1000);
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.font = '900 22px ' + UIF;
    ctx.fillText(L('🎬 ТЕСТОВАЯ РЕКЛАМА', '🎬 TEST AD'), VW / 2, 400);
    ctx.font = '700 14px ' + UIF;
    ctx.fillStyle = '#94a3b8';
    ctx.fillText(L('На площадке здесь будет настоящий ролик', 'A real ad plays here on the platform'), VW / 2, 430);
    ctx.font = '900 40px ' + UIF;
    ctx.fillStyle = '#fde047';
    ctx.fillText(Math.ceil(fakeAd.t), VW / 2, 490);
    ctx.restore();
}

// ============================================================================
// «СОК»: КОМБО-БАННЕРЫ, НОВАЯ СФЕРА, НОКАУТ, КРАСНАЯ ВИНЬЕТКА, ОБУЧЕНИЕ
// ============================================================================
function renderJuiceOverlays(t, now) {
    // Красная пульсирующая виньетка, когда стакан почти полон
    if (dangerVignette > 0.02) {
        const a = dangerVignette * (0.45 + Math.sin(now * 0.012) * 0.15);
        const vg = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.25, VW / 2, VH / 2, VH * 0.75);
        vg.addColorStop(0, 'rgba(239, 68, 68, 0)');
        vg.addColorStop(1, `rgba(239, 68, 68, ${a})`);
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, VW, VH);
    }

    // Предупреждение об атаке босса + задание, чтобы её отбить
    if (rival.tele && !isGameOver) {
        const tl = rival.tele;
        const k = tl.t / tl.total;
        const urgent = tl.t < 2;
        ctx.save();
        const sy = 306;
        drawRoundedPanel(26, sy, 428, 66, 16, urgent ? `rgba(127, 29, 29, ${0.92 + Math.sin(now * 0.03) * 0.06})` : 'rgba(69, 10, 10, 0.92)', '#f87171');
        ctx.fillStyle = '#fecaca';
        ctx.font = '900 15px ' + UIF;
        ctx.textAlign = 'left';
        ctx.fillText(`${t.teleNames[tl.move]} ${t.teleIn} ${tl.t.toFixed(1)}${t.sec}`, 42, sy + 24);
        // «Собери [128] чтобы отбить!» — число крупно и жёлтым, справа сама сфера
        let tx = 42;
        ctx.fillStyle = '#ffffff';
        ctx.font = '800 14px ' + UIF;
        ctx.fillText(t.teleNeed + ' ', tx, sy + 49);
        tx += ctx.measureText(t.teleNeed + ' ').width;
        ctx.fillStyle = '#fde047';
        ctx.font = '900 18px ' + UIF;
        const numTxt = formatOrbNumber(tl.needTier);
        ctx.fillText(numTxt, tx, sy + 50);
        tx += ctx.measureText(numTxt + ' ').width;
        if (tl.needTier - 1 >= shotMinTier()) {
            ctx.fillStyle = '#ffffff';
            ctx.font = '800 14px ' + UIF;
            ctx.fillText(t.teleOr + ' ', tx, sy + 49);
            tx += ctx.measureText(t.teleOr + ' ').width;
            ctx.fillStyle = '#fde047';
            ctx.font = '900 18px ' + UIF;
            const n2 = formatOrbNumber(tl.needTier - 1) + '+';
            ctx.fillText(n2, tx, sy + 50);
            tx += ctx.measureText(n2 + ' ').width;
        }
        ctx.fillStyle = '#4ade80';
        ctx.font = '900 14px ' + UIF;
        ctx.fillText(t.teleNeed2, tx, sy + 49);
        drawGlossyOrb({ x: 418, y: sy + 30, radius: 22, tier: tl.needTier, scaleX: 1, scaleY: 1, acc: 'none', expression: 'excited', exprTimer: 1 }, true);
        // Тающая полоска времени
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(36, sy + 58, 408, 4);
        ctx.fillStyle = urgent ? '#f87171' : '#fbbf24';
        ctx.fillRect(36, sy + 58, 408 * k, 4);
        ctx.restore();
    }

    // Заставка уровня: тип задачи и цель
    if (levelIntroT > 0 && !inStartMenu) {
        const a = Math.min(1, levelIntroT * 2, (2.6 - levelIntroT) * 5);
        const goalTxt = rival.isFinal ? L('Император владеет атаками всех миров!', "The Emperor wields every world's attacks!") : t.typeGoal[rival.type].replace('{n}', rival.type === 'drops' ? rival.dropsLeft : Math.round(rival.timeLeft));
        ctx.save();
        ctx.globalAlpha = Math.max(0, a);
        drawRoundedPanel(40, 360, 400, 120, 24, 'rgba(15, 23, 42, 0.95)', rival.type === 'mega' ? '#f43f5e' : '#fde047');
        ctx.textAlign = 'center';
        ctx.fillStyle = '#94a3b8';
        ctx.font = '900 13px ' + UIF;
        ctx.fillText(`${t.lvlShort} ${currentLevel} · ${t.worldNames[themeIdx % WORLD_COUNT]}`, VW / 2, 388);
        drawFancyTitle(rival.isFinal ? L('ФИНАЛЬНЫЙ БОСС', 'FINAL BOSS') : t.typeNames[rival.type], VW / 2, 426, 28,
            '#ffffff', rival.type === 'mega' || rival.isFinal ? '#f87171' : '#fbbf24', rival.type === 'mega' || rival.isFinal ? '#ef4444' : '#f59e0b');
        ctx.fillStyle = '#ffffff';
        ctx.font = '800 13.5px ' + UIF;
        ctx.fillText(goalTxt, VW / 2, 452);
        ctx.fillStyle = '#7dd3fc';
        ctx.font = '800 11.5px ' + UIF;
        ctx.fillText(L('Зажми сферу — выстрел. Крупные камни бьют сильнее', 'Hold an orb to shoot. Bigger gems hit harder'), VW / 2, 472);
        ctx.restore();
    }

    // Баннер комбо: выпрыгивает с пружинкой и тает
    if (comboBanner.t > 0) {
        const life = comboBanner.t / 1.1;
        const pop = life > 0.8 ? 1 + (life - 0.8) * 2.5 : 1;
        ctx.save();
        ctx.translate(VW / 2, rival.tele ? 470 : 330);
        ctx.scale(pop, pop);
        ctx.globalAlpha = Math.min(1, life * 2.2);
        let size = Math.min(44, 26 + comboBanner.combo * 2.5);
        ctx.font = `900 ${size}px ${UIF}`;
        const w = ctx.measureText(comboBanner.text).width;
        if (w > 400) { size = Math.floor(size * 400 / w); ctx.font = `900 ${size}px ${UIF}`; }
        // Длинный текст не вылезает за экран даже в момент «выпрыгивания»
        const wNow = Math.min(w, 400) * pop;
        if (wNow > 440) ctx.scale(440 / wNow, 440 / wNow);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.globalCompositeOperation = 'lighter';
        const bgs = 260;
        ctx.globalAlpha *= 0.35;
        ctx.drawImage(getGlowSprite(comboBanner.color), -bgs, -bgs * 0.3, bgs * 2, bgs * 0.6);
        ctx.globalAlpha = Math.min(1, life * 2.2);
        ctx.globalCompositeOperation = 'source-over';
        ctx.lineWidth = 4;
        ctx.lineJoin = 'round';
        ctx.strokeStyle = 'rgba(3, 4, 10, 0.75)';
        ctx.strokeText(comboBanner.text, 0, 0);
        const tg = ctx.createLinearGradient(0, -size / 2, 0, size / 2);
        tg.addColorStop(0, '#ffffff'); tg.addColorStop(0.55, comboBanner.color); tg.addColorStop(1, comboBanner.color);
        ctx.fillStyle = tg;
        ctx.fillText(comboBanner.text, 0, 0);
        ctx.restore();
    }

    // Карточка «Открыт новый камень»: название, способность, что она делает
    if (newHeroOverlay.t > 0) {
        const life = newHeroOverlay.t / 3.2;
        const slide = life > 0.9 ? (life - 0.9) * 900 : 0;
        const gi = gemIdx(newHeroOverlay.tier);
        ctx.save();
        ctx.globalAlpha = Math.min(1, life * 4);
        ctx.translate(slide, 0);
        drawRoundedPanel(50, 452, 380, 96, 20, 'rgba(6, 8, 16, 0.95)', GEM_COL[gi]);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha *= 0.5;
        ctx.drawImage(getGlowSprite(GEM_COL[gi]), 50, 440, 110, 120);
        ctx.restore();
        drawPremiumOrb({ x: 102, y: 500, radius: 31, tier: newHeroOverlay.tier, scaleX: 1, scaleY: 1 }, true, now);
        ctx.textAlign = 'left';
        ctx.fillStyle = '#94a3b8';
        ctx.font = '800 9.5px ' + UIF;
        try { ctx.letterSpacing = '2px'; } catch (e) {}
        ctx.fillText(L('НОВЫЙ КАМЕНЬ', 'NEW GEM'), 148, 476);
        try { ctx.letterSpacing = '0px'; } catch (e) {}
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 17px ' + UIF;
        ctx.fillText(L(GEM_INFO[gi].n[0], GEM_INFO[gi].n[1]), 148, 497);
        ctx.fillStyle = GEM_COL[gi];
        ctx.font = '800 12px ' + UIF;
        ctx.fillText(`${L('Сила', 'Power')}: ${L(GEM_INFO[gi].a[0], GEM_INFO[gi].a[1])}`, 148, 516);
        ctx.fillStyle = '#cbd5e1';
        ctx.font = '700 10.5px ' + UIF;
        ctx.fillText(gemDesc(gi), 148, 533);
        ctx.restore();
    }

    // НОКАУТ
    if (koTimer > 0) {
        const p = 1 - koTimer / 1.4;
        ctx.save();
        ctx.fillStyle = `rgba(0, 0, 0, ${Math.min(0.45, p * 0.8)})`;
        ctx.fillRect(0, 0, VW, VH);
        ctx.translate(VW / 2, 400);
        const s = p < 0.2 ? 0.3 + p * 4.5 : 1.2 - Math.min(0.2, (p - 0.2) * 0.5);
        ctx.scale(s, s);
        ctx.rotate(-0.08);
        ctx.font = "900 64px " + UIF;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 10;
        ctx.strokeStyle = '#7f1d1d';
        ctx.strokeText(t.koText, 0, 0);
        ctx.fillStyle = '#fde047';
        ctx.fillText(t.koText, 0, 0);
        ctx.restore();
    }

    // Подсказка про выстрел — пока игрок ни разу не выстрелил
    if (tutorialDone && !shotTutDone && !isGameOver && !stageWinModalOpen && !rival.tele) {
        const cands = orbs.filter(o => canShootOrb(o)).sort((a, b) => b.tier - a.tier);
        const target = cands[0];
        if (target) {
            ctx.save();
            drawRoundedPanel(30, 548, 420, 66, 16, 'rgba(15, 23, 42, 0.94)', '#fde047');
            ctx.fillStyle = '#fde047';
            ctx.font = '900 14px ' + UIF;
            ctx.textAlign = 'center';
            ctx.fillText(t.shotTut, VW / 2, 576);
            ctx.fillStyle = '#e2e8f0';
            ctx.font = '700 12px ' + UIF;
            ctx.fillText(t.shotTut2, VW / 2, 598);
            drawTapHint(target.x, target.y, now, true);
            ctx.restore();
        }
    }
    // Обучение на первом уровне
    if (!tutorialDone && !isGameOver && !stageWinModalOpen) {
        const msg = [t.tut1, t.tut2, t.tut3][Math.min(2, tutorialStep)];
        ctx.save();
        drawRoundedPanel(30, 560, 420, 54, 16, 'rgba(15, 23, 42, 0.92)', '#38bdf8');
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 13.5px ' + UIF;
        ctx.textAlign = 'center';
        ctx.fillText(msg, VW / 2, 592);
        if (tutorialStep === 0) {
            // Анимированный палец: ведёт вправо-влево
            const hx = VW / 2 + Math.sin(now * 0.003) * 110;
            drawTapHint(hx, 236, now, false);
        }
        ctx.restore();
    }
}

function drawNextAndGiftPanel(t, now) {
    // Следующая сфера
    const nb = UI_BTN.nextBox;
    drawRoundedPanel(nb.x, nb.y, nb.w, nb.h, 14, 'rgba(15, 23, 42, 0.94)', '#38bdf8');
    ctx.fillStyle = '#93c5fd';
    ctx.font = '900 10.5px ' + UIF;
    ctx.textAlign = 'center';
    ctx.fillText(t.nextOrb, nb.x + nb.w / 2, nb.y + 15);
    drawGlossyOrb({ x: nb.x + nb.w / 2, y: nb.y + 43, radius: Math.min(22, getOrbRadius(nextOrbTier) * 0.62), tier: nextOrbTier, scaleX: 1, scaleY: 1 }, true);

    // Подарок за рекламу с таймером
    const gb = UI_BTN.giftBox;
    const ready = giftTimer <= 0;
    const pulse = ready ? 1 + Math.sin(now * 0.01) * 0.04 : 1;
    ctx.save();
    ctx.translate(gb.x + gb.w / 2, gb.y + gb.h / 2);
    ctx.scale(pulse, pulse);
    ctx.translate(-(gb.x + gb.w / 2), -(gb.y + gb.h / 2));
    if (ready) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.4 + Math.sin(now * 0.006) * 0.15;
        ctx.drawImage(getGlowSprite('#f59e0b'), gb.x - 20, gb.y - 20, gb.w + 40, gb.h + 40); ctx.restore();
    }
    drawRoundedPanel(gb.x, gb.y, gb.w, gb.h, 14, ready ? 'rgba(120, 53, 15, 0.75)' : 'rgba(10, 13, 24, 0.9)', ready ? '#fcd34d' : '#334155');
    ctx.textAlign = 'center';
    if (slotMachine.spinning) {
        ctx.font = '26px ' + UIF;
        ctx.textBaseline = 'middle';
        ctx.fillText(slotMachine.reels[0], gb.x + gb.w / 2, gb.y + 28);
        ctx.textBaseline = 'alphabetic';
    } else {
        drawLineIcon('gift', gb.x + gb.w / 2, gb.y + 28 + (ready ? Math.sin(now * 0.008) * 2 : 0), 26, ready ? '#fde68a' : '#64748b');
    }
    ctx.font = '900 10.5px ' + UIF;
    ctx.fillStyle = ready ? '#fef08a' : '#94a3b8';
    const left = Math.ceil(giftTimer);
    ctx.fillText(ready ? t.giftReady : `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`, gb.x + gb.w / 2, gb.y + 62);
    ctx.restore();
}

function renderAdConfirmModal(t, now) {
    ctx.fillStyle = 'rgba(6, 5, 18, 0.88)';
    ctx.fillRect(0, 0, VW, VH);
    drawRoundedPanel(40, 300, 400, 280, 26, 'rgba(10, 13, 24, 0.97)', '#fbbf24');
    ctx.textAlign = 'center';
    drawFancyTitle(adConfirm.title, VW / 2, 352, 21, '#fef3c7', '#f59e0b', '#f59e0b');
    ctx.fillStyle = '#e2e8f0';
    ctx.font = '700 14px ' + UIF;
    ctx.fillText(adConfirm.sub, VW / 2, 392);
    drawRoundedPanel(UI_BTN.adYes.x, UI_BTN.adYes.y, UI_BTN.adYes.w, UI_BTN.adYes.h, 16, '#10b981', '#ffffff');
    ctx.fillStyle = '#052e16';

function drawBadge(x, y, now) {
    const s = 1 + Math.sin(now * 0.012) * 0.12;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.fillStyle = '#ef4444';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.textBaseline = 'alphabetic';
    ctx.restore();
}

function renderChestModal(t, now) {
    const cm = chestModal;
    ctx.fillStyle = 'rgba(6, 5, 18, 0.95)';
    ctx.fillRect(0, 0, VW, VH);
    const col = ['#fde047', '#38bdf8', '#e879f9'][cm.rarity];
    // Мягкие вращающиеся лучи за сундуком
    ctx.save();
    ctx.translate(VW / 2, 330);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = cm.phase === 2 ? 0.55 : 0.3;
    ctx.drawImage(getGlowSprite(col), -170, -170, 340, 340);
    ctx.rotate(now * 0.0004);
    const rg = ctx.createLinearGradient(0, 0, 280, 0);
    rg.addColorStop(0, rgbaHex(col, 0.5)); rg.addColorStop(1, rgbaHex(col, 0));
    ctx.fillStyle = rg;
    for (let k = 0; k < 16; k++) {
        ctx.rotate(Math.PI / 8);
        const w = k % 2 ? 5 : 10;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(280, -w); ctx.lineTo(280, w); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    ctx.fillStyle = '#94a3b8';
    ctx.font = '800 10px ' + UIF;
    ctx.textAlign = 'center';
    try { ctx.letterSpacing = '3px'; } catch (e) {}
    ctx.fillText(L('НАГРАДА', 'REWARD'), VW / 2, 160);
    try { ctx.letterSpacing = '0px'; } catch (e) {}
    drawFancyTitle(cm.title || t.chestNames[cm.rarity], VW / 2, 192, 25, '#ffffff', col, col);

    if (cm.phase < 2) {
        const shake = cm.phase === 1 ? Math.sin(cm.t * 60) * (4 + cm.t * 14) : Math.sin(now * 0.006) * 2;
        const sc = cm.phase === 1 ? 2.4 + cm.t * 0.6 : 2.4;
        ctx.save();
        ctx.translate(shake, 0);
        drawChestIcon(VW / 2, 330, sc, cm.rarity, now, true);
        ctx.restore();
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 16px ' + UIF;
        ctx.globalAlpha = 0.6 + Math.sin(now * 0.008) * 0.4;
        ctx.fillText(t.tapToOpen, VW / 2, 470);
        ctx.globalAlpha = 1;
        return;
    }

    // Награды вылетают по очереди
    const rw = cm.rewards;
    const items = [{ kind: 'star', name: L('Звёзды', 'Stars'), amt: `+${rw.stars}` }];
    if (rw.shards) Object.keys(rw.shards).forEach(gi => items.push({ kind: 'gem', gi: +gi, name: `${L('Осколки', 'Shards')}: ${L(GEM_INFO[gi].n[0], GEM_INFO[gi].n[1])}`, amt: `+${rw.shards[gi]}` }));
    Object.keys(rw.charges).forEach(k => {
        const names = { bottomBlast: t.b1_1, pickaxe: L('Кирка', 'Pickaxe'), shake: t.b2_1, laserLink: t.b3_1, hammer: t.b4_1, picker: t.b5_1 };
        items.push({ kind: 'boost', key: k, name: cleanLabel(names[k] || k), amt: `×${rw.charges[k]}` });
    });
    if (rw.extra) rw.extra.forEach(e => items.push(e.kind === 'skin'
        ? { kind: 'skin', id: e.id, name: `${L('Облик', 'Skin')}: ${L(skinById(e.id).n[0], skinById(e.id).n[1])}`, amt: '✦' }
        : { kind: 'boost', key: '_', icon: e.icon, name: e.name, amt: '✓' }));
    if (!rw.stars) items.shift();
    const BIC = { bottomBlast: 'blast', pickaxe: 'pick', shake: 'mix', laserLink: 'laser', hammer: 'target', picker: 'crown' };
    items.forEach((it, i) => {
        const p = Math.max(0, Math.min(1, (cm.t - i * 0.18) / 0.25));
        if (p <= 0) return;
        const e = 1 - Math.pow(1 - p, 3);
        ctx.save();
        ctx.globalAlpha = p;
        ctx.translate(VW / 2 + (1 - e) * 40, 252 + i * 46);
        drawRoundedPanel(-160, -20, 320, 40, 14, 'rgba(10, 13, 24, 0.95)', col);
        if (it.kind === 'star') drawStarShape(-134, 0, 11, true);
        else if (it.kind === 'gem') drawPremiumOrb({ x: -134, y: 0, radius: 12, tier: it.gi, scaleX: 1, scaleY: 1 }, true, now);
        else if (it.kind === 'skin') drawPremiumOrb({ x: -134, y: 0, radius: 13, tier: 7, skin: it.id, scaleX: 1, scaleY: 1 }, true, now);
        else drawLineIcon(it.icon || BIC[it.key] || 'gem', -134, 0, 18, '#e2e8f0');
        ctx.textAlign = 'left';
        ctx.fillStyle = '#e2e8f0';
        ctx.font = '700 13px ' + UIF;
        ctx.fillText(it.name, -112, 5);
        ctx.textAlign = 'right';
        ctx.fillStyle = it.kind === 'star' ? '#fcd34d' : it.kind === 'gem' ? GEM_COL[it.gi] : '#ffffff';
        ctx.font = '900 16px ' + UIF;
        ctx.fillText(it.amt, 146, 6);
        ctx.restore();
    });
    ctx.textAlign = 'center';
    if (rw.skin) {
        const p = Math.max(0, Math.min(1, (cm.t - items.length * 0.18 - 0.2) / 0.3));
        if (p > 0) {
            const yy = 252 + items.length * 46 + 6;
            ctx.save();
            ctx.globalAlpha = p;
            drawRoundedPanel(80, yy - 20, 320, 84, 18, 'rgba(59, 7, 100, 0.85)', '#f0abfc');
            drawPremiumOrb({ x: 126, y: yy + 22, radius: 26 * (0.5 + p * 0.5), tier: 7, skin: rw.skin, scaleX: 1, scaleY: 1 }, true, now);
            ctx.textAlign = 'left';
            ctx.fillStyle = '#f0abfc';
            ctx.font = '800 10px ' + UIF;
            try { ctx.letterSpacing = '2px'; } catch (e) {}
            ctx.fillText(L('НОВЫЙ ОБЛИК', 'NEW SKIN'), 166, yy + 12);
            try { ctx.letterSpacing = '0px'; } catch (e) {}
            ctx.fillStyle = '#ffffff';
            ctx.font = '900 17px ' + UIF;
            ctx.fillText(L(skinById(rw.skin).n[0], skinById(rw.skin).n[1]), 166, yy + 36);
            ctx.textAlign = 'center';
            ctx.restore();
        }
    }
    if (cm.t > 0.8 && cm.granted) {
        drawRoundedPanel(UI_BTN.chestClaim.x, UI_BTN.chestClaim.y, UI_BTN.chestClaim.w, UI_BTN.chestClaim.h, 12, '#2563eb', '#93c5fd');

        ctx.font = '900 15px ' + UIF;
        ctx.fillText(L('Отлично', 'Great'), VW / 2, UI_BTN.chestClaim.y + 29);
    } else if (cm.t > 0.8) {
        drawRoundedPanel(UI_BTN.chestX2.x, UI_BTN.chestX2.y, UI_BTN.chestX2.w, UI_BTN.chestX2.h, 16, '#10b981', '#ffffff');

function drawProgressiveBoosterBtn(btn, key, col1, col2, line1, line2, t) {
    const reqLvl = BOOSTER_UNLOCK_LVL[key];
    const isUnlocked = currentLevel >= reqLvl;
    const charges = boosterCharges[key] || 0;

    ctx.save();
    if (!isUnlocked) {
        drawRoundedPanel(btn.x, btn.y, btn.w, btn.h, 14, 'rgba(10, 13, 24, 0.75)', '#334155');
        drawLineIcon('lock', btn.x + btn.w / 2, btn.y + 22, 16, '#475569');
        ctx.fillStyle = '#64748b';
        ctx.font = '800 9.5px ' + UIF;
        ctx.textAlign = 'center';
        ctx.fillText(`${String(t.lockedAtLvl).replace(/^[^A-Za-zА-Яа-яЁё0-9]+/u, '')}${reqLvl}`, btn.x + btn.w / 2, btn.y + 44);
        ctx.font = '800 9px ' + UIF;
        ctx.fillText(line2, btn.x + btn.w / 2, btn.y + 54);
        ctx.restore();
        return;
    }

    drawRoundedPanel(btn.x, btn.y, btn.w, btn.h, 14, 'rgba(10, 13, 24, 0.9)', col2);
    // Цветное свечение снизу кнопки
    ctx.save();
    ctx.beginPath(); ctx.roundRect(btn.x, btn.y, btn.w, btn.h, 14); ctx.clip();
    const cg = ctx.createRadialGradient(btn.x + btn.w / 2, btn.y + btn.h + 6, 2, btn.x + btn.w / 2, btn.y + btn.h + 6, btn.h * 1.1);
    cg.addColorStop(0, rgbaHex(col2, charges > 0 ? 0.45 : 0.18));
    cg.addColorStop(1, rgbaHex(col2, 0));
    ctx.fillStyle = cg;
    ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
    ctx.restore();
    // Акцентная линия сверху
    ctx.fillStyle = col2;
    ctx.fillRect(btn.x + btn.w / 2 - 12, btn.y + 0.5, 24, 1.5);

    // Плашка: заряды или реклама
    const pillW = 44;
    ctx.fillStyle = charges > 0 ? col2 : 'rgba(10, 13, 24, 0.95)';
    ctx.beginPath(); ctx.roundRect(btn.x + btn.w / 2 - pillW / 2, btn.y - 7, pillW, 15, 7.5); ctx.fill();
    if (charges <= 0) { ctx.strokeStyle = 'rgba(251, 191, 36, 0.8)'; ctx.lineWidth = 1; ctx.stroke(); }
    ctx.fillStyle = charges > 0 ? '#05070f' : '#fcd34d';
    ctx.font = '800 8.5px ' + UIF;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(charges > 0 ? `×${charges}` : '▶ AD', btn.x + btn.w / 2, btn.y + 0.5);
    ctx.textBaseline = 'alphabetic';

    const BIC = { bottomBlast: 'blast', pickaxe: 'pick', shake: 'mix', laserLink: 'laser', hammer: 'target', picker: 'crown' };
    drawLineIcon(BIC[key] || 'gem', btn.x + btn.w / 2, btn.y + 27, 20, '#ffffff');
    ctx.fillStyle = '#ffffff';
    ctx.font = '800 10px ' + UIF;
    ctx.fillText(String(line1).replace(/^[^A-Za-zА-Яа-яЁё0-9+]+/u, ''), btn.x + btn.w / 2, btn.y + 54);
    ctx.fillStyle = 'rgba(203, 213, 225, 0.7)';
    ctx.font = '700 8.5px ' + UIF;
    ctx.fillText(line2, btn.x + btn.w / 2, btn.y + 68);
    ctx.restore();
}

function renderLuckyWheelModal(t, now) {
    ctx.fillStyle = 'rgba(6, 5, 18, 0.92)';
    ctx.fillRect(0, 0, VW, VH);

    drawRoundedPanel(30, 85, 420, 645, 28, '#0f172a', '#fbbf24');

    ctx.fillStyle = '#fbbf24';
    ctx.font = '900 24px ' + UIF;
    ctx.textAlign = 'center';
    ctx.fillText(t.wheelTitle, VW / 2, 132);
    ctx.fillStyle = '#cbd5e1';
    ctx.font = '700 13px ' + UIF;
    ctx.fillText(t.wheelSub, VW / 2, 156);

    const cx = VW / 2;
    const cy = 355;
    const radius = 152;
    const numSectors = WHEEL_SECTORS.length;
    const arc = (Math.PI * 2) / numSectors;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(wheelAngle);

    for (let i = 0; i < numSectors; i++) {
        const s = WHEEL_SECTORS[i];
        const startA = i * arc;
        const endA = startA + arc;

        ctx.fillStyle = s.color;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, startA, endA);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.save();
        ctx.rotate(startA + arc / 2);
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 13px ' + UIF;
        ctx.textAlign = 'right';
        ctx.fillText(currentLang === 'ru' ? s.ru : s.en, radius - 18, 5);
        ctx.font = '900 20px ' + UIF;
        ctx.fillText(s.icon, radius - 92, 7);
        ctx.restore();
    }

    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.arc(0, 0, radius + 4, 0, Math.PI * 2);
    ctx.stroke();

    for (let p = 0; p < numSectors * 2; p++) {
        const pa = (p * Math.PI) / numSectors;
        const px = Math.cos(pa) * (radius + 4);
        const py = Math.sin(pa) * (radius + 4);

// Премиальный заголовок: градиент, разрядка, мягкое свечение позади
function drawFancyTitle(txt, x, y, size, c1, c2, glow) {
    txt = String(txt).replace(/^[^A-Za-zА-Яа-яЁё0-9✦]+/u, '');
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = `900 ${size}px ${UIF}`;
    try { ctx.letterSpacing = size >= 20 ? '1px' : '0.5px'; } catch (e) {}
    let w = ctx.measureText(txt).width;
    if (w > 400) { size = Math.floor(size * 400 / w); ctx.font = `900 ${size}px ${UIF}`; w = ctx.measureText(txt).width; }
    if (glow) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha *= 0.28;
        ctx.drawImage(getGlowSprite(glow), x - w * 0.7, y - size * 1.6, w * 1.4, size * 2.6);
        ctx.globalAlpha /= 0.28;
        ctx.globalCompositeOperation = 'source-over';
    }
    const g = ctx.createLinearGradient(0, y - size, 0, y + size * 0.2);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.fillText(txt, x, y + 2);
    ctx.fillStyle = g;
    ctx.fillText(txt, x, y);
    ctx.restore();
}
function drawStarShape(x, y, r, glow) {
    ctx.save();
    ctx.translate(x, y);
    if (glow) { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha *= 0.4; ctx.drawImage(getGlowSprite('#f59e0b'), -r * 2.2, -r * 2.2, r * 4.4, r * 4.4); ctx.globalAlpha /= 0.4; ctx.globalCompositeOperation = 'source-over'; }
    const g = ctx.createLinearGradient(0, -r, 0, r);
    g.addColorStop(0, '#fef3c7'); g.addColorStop(0.5, '#fbbf24'); g.addColorStop(1, '#b45309');
    ctx.fillStyle = g;
    ctx.beginPath();
    for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * 0.45 : r; k ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)'; ctx.lineWidth = 0.8; ctx.stroke();
    ctx.restore();
}

// Линейные иконки интерфейса (вместо эмодзи)
function drawLineIcon(name, cx, cy, s, col) {
    ctx.save();
    ctx.translate(cx, cy);
    const k = s / 20;
    ctx.scale(k, k);
    ctx.strokeStyle = col;
    ctx.fillStyle = col;
    ctx.lineWidth = 1.7 / Math.max(0.6, k) * k > 0 ? 1.8 : 1.8;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    switch (name) {
        case 'home':
            ctx.moveTo(-8, -1); ctx.lineTo(0, -8); ctx.lineTo(8, -1);
            ctx.moveTo(-6, -3); ctx.lineTo(-6, 8); ctx.lineTo(6, 8); ctx.lineTo(6, -3);
            ctx.moveTo(-2, 8); ctx.lineTo(-2, 3); ctx.lineTo(2, 3); ctx.lineTo(2, 8);
            break;
        case 'sparkle':
            ctx.moveTo(-2, -9); ctx.quadraticCurveTo(-2, -2, -9, -2); ctx.quadraticCurveTo(-2, -2, -2, 5); ctx.quadraticCurveTo(-2, -2, 5, -2); ctx.quadraticCurveTo(-2, -2, -2, -9);
            ctx.moveTo(6, 3); ctx.lineTo(6, 9); ctx.moveTo(3, 6); ctx.lineTo(9, 6);
            break;
        case 'quest':
            ctx.roundRect(-7, -7, 14, 16, 2.5);
            ctx.moveTo(-3, -9); ctx.lineTo(3, -9);
            ctx.moveTo(-4, 1); ctx.lineTo(-1, 4); ctx.lineTo(4, -2);
            break;
        case 'city':
            ctx.moveTo(-9, 9); ctx.lineTo(9, 9);
            ctx.moveTo(-8, 9); ctx.lineTo(-8, -1); ctx.lineTo(-3, -1); ctx.lineTo(-3, 9);
            ctx.moveTo(-3, 9); ctx.lineTo(-3, -8); ctx.lineTo(3, -8); ctx.lineTo(3, 9);
            ctx.moveTo(3, 9); ctx.lineTo(3, 2); ctx.lineTo(8, 2); ctx.lineTo(8, 9);
            break;
        case 'gift':
            ctx.roundRect(-8, -2, 16, 11, 2);
            ctx.moveTo(-9, -2); ctx.lineTo(9, -2); ctx.moveTo(0, -2); ctx.lineTo(0, 9);
            ctx.moveTo(0, -2); ctx.quadraticCurveTo(-7, -10, -5, -3); ctx.moveTo(0, -2); ctx.quadraticCurveTo(7, -10, 5, -3);
            break;
        case 'gem':
            ctx.moveTo(-9, -3); ctx.lineTo(-5, -8); ctx.lineTo(5, -8); ctx.lineTo(9, -3); ctx.lineTo(0, 9); ctx.closePath();
            ctx.moveTo(-9, -3); ctx.lineTo(9, -3); ctx.moveTo(-3, -8); ctx.lineTo(0, -3); ctx.lineTo(3, -8); ctx.moveTo(0, -3); ctx.lineTo(0, 9);
            break;
        case 'trophy':
            ctx.moveTo(-6, -8); ctx.lineTo(6, -8); ctx.lineTo(5, 0); ctx.quadraticCurveTo(0, 5, -5, 0); ctx.closePath();
            ctx.moveTo(-6, -6); ctx.quadraticCurveTo(-10, -6, -9, -2); ctx.quadraticCurveTo(-8, 1, -5, 1);
            ctx.moveTo(6, -6); ctx.quadraticCurveTo(10, -6, 9, -2); ctx.quadraticCurveTo(8, 1, 5, 1);
            ctx.moveTo(0, 3); ctx.lineTo(0, 7); ctx.moveTo(-4, 8); ctx.lineTo(4, 8);
            break;
        case 'blast':
            for (let q = 0; q < 8; q++) { const a = q * Math.PI / 4; const r1 = q % 2 ? 4 : 3, r2 = q % 2 ? 7 : 10; ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1); ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2); }
            break;
        case 'pick':
            ctx.moveTo(-9, -4); ctx.quadraticCurveTo(0, -11, 9, -4);
            ctx.moveTo(0, -7.5); ctx.lineTo(-1, 9);
            break;
        case 'mix':
            ctx.arc(0, 0, 8, -0.3, Math.PI * 1.2); ctx.moveTo(4, 0); ctx.arc(0, 0, 4, 0, Math.PI * 1.4);
            ctx.moveTo(8, -2.5); ctx.lineTo(7.6, 2); ctx.lineTo(3.5, 0.5);
            break;
        case 'laser':
            ctx.moveTo(2, -10); ctx.lineTo(-5, 1); ctx.lineTo(0, 1); ctx.lineTo(-2, 10); ctx.lineTo(5, -1); ctx.lineTo(0, -1); ctx.closePath();
            break;
        case 'target':
            ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.moveTo(4, 0); ctx.arc(0, 0, 4, 0, Math.PI * 2);
            ctx.moveTo(0, -11); ctx.lineTo(0, -6); ctx.moveTo(0, 6); ctx.lineTo(0, 11); ctx.moveTo(-11, 0); ctx.lineTo(-6, 0); ctx.moveTo(6, 0); ctx.lineTo(11, 0);
            break;
        case 'crown':
            ctx.moveTo(-9, 6); ctx.lineTo(-9, -5); ctx.lineTo(-4, 0); ctx.lineTo(0, -8); ctx.lineTo(4, 0); ctx.lineTo(9, -5); ctx.lineTo(9, 6); ctx.closePath();
            ctx.moveTo(-9, 9); ctx.lineTo(9, 9);
            break;
        case 'calendar':
            ctx.roundRect(-8, -6, 16, 15, 2.5); ctx.moveTo(-8, -1); ctx.lineTo(8, -1);
            ctx.moveTo(-4, -9); ctx.lineTo(-4, -4); ctx.moveTo(4, -9); ctx.lineTo(4, -4);
            break;
        case 'lock':
            ctx.roundRect(-6, -1, 12, 10, 2); ctx.moveTo(-4, -1); ctx.lineTo(-4, -4); ctx.arc(0, -4, 4, Math.PI, 0); ctx.lineTo(4, -1);
            break;
        case 'bolt':
            ctx.moveTo(2, -9); ctx.lineTo(-5, 1); ctx.lineTo(0, 1); ctx.lineTo(-2, 9); ctx.lineTo(5, -1); ctx.lineTo(0, -1); ctx.closePath();
            ctx.fill();
            break;
        case 'snow':
            for (let q = 0; q < 3; q++) { const a = q * Math.PI / 3; ctx.moveTo(Math.cos(a) * 9, Math.sin(a) * 9); ctx.lineTo(-Math.cos(a) * 9, -Math.sin(a) * 9); }

            ctx.moveTo(0, 7); ctx.bezierCurveTo(-3, 5, -3, 1, 0, -2); ctx.bezierCurveTo(3, 2, 3, 5, 0, 7);
            break;
        case 'dots':
            [[-5, 4, 3], [4, 3, 2.2], [0, -5, 2.6], [6, -6, 1.6]].forEach(([x, y, r]) => { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); });

            ctx.moveTo(-9.5, -5); ctx.lineTo(-4.5, -5); ctx.moveTo(4.5, -5); ctx.lineTo(9.5, -5);
            break;
        case 'shield':
            ctx.moveTo(0, -9); ctx.lineTo(8, -6); ctx.quadraticCurveTo(8, 5, 0, 10); ctx.quadraticCurveTo(-8, 5, -8, -6); ctx.closePath();

            break;
        case 'coin':

        case 'heart':

            break;
        case 'flag':

            ctx.moveTo(-6, -8); ctx.quadraticCurveTo(-1, -11, 2, -8); ctx.quadraticCurveTo(5, -5, 9, -7); ctx.lineTo(9, 1); ctx.quadraticCurveTo(5, 3, 2, 0); ctx.quadraticCurveTo(-1, -3, -6, 0);
            break;

            break;
        case 'brick':
            ctx.rect(-9, -7, 18, 14); ctx.moveTo(-9, 0); ctx.lineTo(9, 0); ctx.moveTo(0, -7); ctx.lineTo(0, 0); ctx.moveTo(-4.5, 0); ctx.lineTo(-4.5, 7); ctx.moveTo(4.5, 0); ctx.lineTo(4.5, 7);
            break;
        case 'rainbow':

}

function drawRoundedPanel(x, y, w, h, r, fill, stroke) {
    ctx.save();
    const a0 = ctx.globalAlpha;
    // Тень под панелью
    ctx.fillStyle = 'rgba(0, 0, 0, 0.32)';
    ctx.beginPath(); ctx.roundRect(x, y + 3, w, h, r); ctx.fill();
    // Основа (плоские яркие кнопки превращаются в «драгоценные» градиенты)
    const pf = typeof fill === 'string' ? PREMIUM_FILLS[fill] : null;
    if (pf) {
        const bg = ctx.createLinearGradient(0, y, 0, y + h);
        bg.addColorStop(0, pf[0]); bg.addColorStop(0.5, pf[1]); bg.addColorStop(1, pf[2]);
        fill = bg;
        if (stroke === '#ffffff' || stroke === '#6ee7b7' || stroke === '#93c5fd') stroke = pf[0];
    }
    ctx.fillStyle = fill;
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
    // Стеклянный отлив сверху вниз (градиенты кэшируются по размеру панели)
    const pk = x + '|' + y + '|' + w + '|' + h;
    let pc = panelGradCache.get(pk);
    if (!pc) {
        if (panelGradCache.size > 300) panelGradCache.clear();
        const g = ctx.createLinearGradient(0, y, 0, y + h);
        g.addColorStop(0, 'rgba(255, 255, 255, 0.09)');
        g.addColorStop(0.45, 'rgba(255, 255, 255, 0.015)');
        g.addColorStop(1, 'rgba(0, 0, 0, 0.12)');
        const hl = ctx.createLinearGradient(x, 0, x + w, 0);
        hl.addColorStop(0, 'rgba(255, 255, 255, 0)');
        hl.addColorStop(0.5, 'rgba(255, 255, 255, 0.45)');
        hl.addColorStop(1, 'rgba(255, 255, 255, 0)');
        pc = { g, hl };
        panelGradCache.set(pk, pc);
    }
    ctx.fillStyle = pc.g;
    ctx.fill();
    // Тонкий цветной кант
    ctx.globalAlpha = a0 * 0.6;
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(x + 0.5, y + 0.5, w - 1, h - 1, r); ctx.stroke();
    // Светлая линия по верхней кромке
    ctx.globalAlpha = a0 * 0.7;
    ctx.strokeStyle = pc.hl;
    ctx.beginPath(); ctx.moveTo(x + r, y + 1.2); ctx.lineTo(x + w - r, y + 1.2); ctx.stroke();
    ctx.restore();
}

// Варианты «Выбора сферы» считаются от самой крупной сферы СЕЙЧАС в стакане (не выше неё),
// иначе каждое использование поднимало планку и числа улетали в триллионы
function getPickerChoices() {
    const tiers = orbs.filter(o => !o.isStone && !o.isBomb).map(o => o.tier);
    const top = Math.max(2, tiers.length ? Math.max(...tiers) : 2);
    return [
        { tier: Math.max(0, top - 3), mode: 'normal' },
        { tier: Math.max(0, top - 2), mode: 'normal' },
        { tier: Math.max(0, top - 1), mode: 'normal' },
        { tier: top, mode: 'normal' },
        { tier: Math.max(0, top - 2), mode: 'bomb' },
        { tier: Math.max(0, top - 1), mode: 'rainbow' }
    ];
}

function upgradeCost(lvl) {
    return Math.round(80 * Math.pow(lvl + 1, 1.5) / 10) * 10;
}

    { id: 'stars_2200',   perm: false, icon: 'coin',   col: '#fcd34d', n: ['Мешок звёзд', 'Bag of stars'],              d: ['2 200 ⭐ · выгоднее на 15%', '2,200 ⭐ · 15% more value'], test: '119' },
    { id: 'stars_6000',   perm: false, icon: 'coin',   col: '#fcd34d', n: ['Сокровищница', 'Treasury'],                 d: ['6 000 ⭐ · выгоднее на 30%', '6,000 ⭐ · 30% more value'], test: '279' },
    { id: 'master_chest', perm: false, icon: 'gem',    col: '#e879f9', n: ['Сундук мастера', "Master's chest"],         d: ['Эпический сундук и 40 осколков камней', 'Epic chest plus 40 gem shards'], test: '69' },
    { id: 'royal_skins',  perm: true,  icon: 'crown',  col: '#fde68a', n: ['Королевская коллекция', 'Royal collection'], d: ['Эксклюзивные облики «Платина» и «Инферно»', 'Exclusive Platinum and Inferno skins'], test: '149' },
    { id: 'no_ads',       perm: true,  icon: 'shield', col: '#7dd3fc', n: ['Без лишней рекламы', 'No forced ads'],      d: ['Убирает рекламу между уровнями. Награды за рекламу остаются', 'Removes ads between levels. Optional reward ads stay'], test: '199' }
];
let ysdkPayments = null;
let shopCatalog = {};          // id → товар из Консоли (название, цена, иконка валюты)
let shopOwned = {};            // постоянные покупки, которые уже выданы
let shopModal = { open: false, busy: false, msg: '', msgT: 0 };
const currencyImg = { img: null, ready: false };
// Имитация покупок — только в тестовой ссылке; на боевых хостингах (если SDK не загрузился) магазин скрыт
const SHOP_TEST_MODE = (() => { try { return !/yandex|playhop|github\.io|vk\.com|vk-apps|vkplay|ok\.ru|odnoklassniki/i.test(location.hostname); } catch (e) { return false; } })();
// В игре показываются только товары, которые активны в Консоли (п. 1.13.6); на ТВ покупок нет (п. 1.6.3.4)
let shopIsTV = false;
function shopList() { return platformName === 'yandex' ? SHOP_ITEMS.filter(it => shopCatalog[it.id]) : SHOP_ITEMS; }
function shopAvailable() { return platformName === 'yandex' ? (!!ysdkPayments && !shopIsTV && shopList().length > 0) : (platformName === 'web' && SHOP_TEST_MODE); }
// Эксклюзивные облики видны, только если магазин работает (или облик уже куплен)
function skinList() { return SKINS.filter(k => !k.shop || shopAvailable() || ownedSkins.includes(k.id)); }
function shopItem(id) { return SHOP_ITEMS.find(x => x.id === id); }
// Выдать товар. Вызывается и при покупке, и при восстановлении необработанных покупок
function grantShopItem(id) {
    const it = shopItem(id);
    if (!it) return null;
    if (it.perm && shopOwned[id]) return null;
    const rw = { stars: 0, charges: {}, shards: {}, extra: [] };
    if (id === 'starter_pack') {
        rw.stars = 600;
        Object.keys(BOOSTER_UNLOCK_LVL).forEach(k => { rw.charges[k] = 2; });
        rw.extra.push({ kind: 'skin', id: 'neon' });
    } else if (id === 'stars_800') rw.stars = 800;
    else if (id === 'stars_2200') rw.stars = 2200;
    else if (id === 'stars_6000') rw.stars = 6000;
    else if (id === 'master_chest') {
        const ch = genChestRewards(2);
        rw.stars = ch.stars; rw.charges = ch.charges; rw.shards = ch.shards || {};
        const pool = Math.max(3, Math.min(11, maxUnlockedTier));
        for (let q = 0; q < 4; q++) { const gi = Math.floor(Math.random() * (pool + 1)); rw.shards[gi] = (rw.shards[gi] || 0) + 10; }
        if (ch.skin) rw.extra.push({ kind: 'skin', id: ch.skin });
    } else if (id === 'royal_skins') {
        rw.extra.push({ kind: 'skin', id: 'platinum' }, { kind: 'skin', id: 'inferno' });
    } else if (id === 'no_ads') {
        rw.extra.push({ kind: 'text', icon: 'shield', name: L('Реклама между уровнями отключена', 'Ads between levels are off') });
    }
    // Начисляем сразу и сохраняем — до того, как покупка будет погашена
    stars += rw.stars;
    Object.keys(rw.charges).forEach(k => { boosterCharges[k] = (boosterCharges[k] || 0) + rw.charges[k]; });
    Object.keys(rw.shards).forEach(gi => { gemSh[gi] = (gemSh[gi] || 0) + rw.shards[gi]; });
    rw.extra.forEach(e => { if (e.kind === 'skin') unlockSkin(e.id, false); });
    if (it.perm) shopOwned[id] = true;
    saveGameState();
    platformCloudSave();
    return rw;
}
function showShopReward(id, rw) {
    if (!rw) return;
    shopModal.open = false;
    chestModal = { open: true, rarity: id === 'master_chest' ? 2 : 0, phase: 2, t: 0, rewards: rw, slot: -1, granted: true, title: L(shopItem(id).n[0], shopItem(id).n[1]) };
    spawnConfettiShower(); fireFourCornerCannons(); playVictoryFanfare(); vibrateDevice(60);
}
// Обработка покупки: выдать → сохранить → погасить (для расходуемых)
function processPurchase(pur, show) {
    if (!pur || !pur.productID) return;
    const it = shopItem(pur.productID);
    if (!it) return;
    const rw = grantShopItem(pur.productID);
    if (!it.perm && ysdkPayments && pur.purchaseToken) ysdkPayments.consumePurchase(pur.purchaseToken).catch(() => {});
    if (show) showShopReward(pur.productID, rw);
}
function initPayments() {
    if (!ysdk || !ysdk.getPayments) return;
    try { shopIsTV = !!(ysdk.deviceInfo && ysdk.deviceInfo.isTV && ysdk.deviceInfo.isTV()); } catch (e) {}
    if (shopIsTV) return;
    ysdk.getPayments({ signed: false }).then(pay => {
        ysdkPayments = pay;
        pay.getCatalog().then(list => {
            (list || []).forEach(pr => { shopCatalog[pr.id] = pr; });
            const any = list && list[0];
            if (any && any.getPriceCurrencyImage) {
                const im = new Image();
                im.onload = () => { currencyImg.ready = true; };
                im.src = any.getPriceCurrencyImage('svg');
                currencyImg.img = im;
            }
        }).catch(() => {});
        // Необработанные расходуемые и постоянные покупки — при каждом запуске
        pay.getPurchases().then(list => { (list || []).forEach(pur => processPurchase(pur, false)); }).catch(() => {});
    }).catch(() => { ysdkPayments = null; });
}
function buyShopItem(id) {
    const it = shopItem(id);
    if (!it || shopModal.busy) return;
    if (it.perm && shopOwned[id]) return;
    if (platformName === 'yandex' && ysdkPayments) {
        shopModal.busy = true;
        pauseForAd();
        ysdkPayments.purchase({ id }).then(pur => {
            resumeAfterAd(); shopModal.busy = false;
            processPurchase(pur, true);
        }).catch(() => {
            resumeAfterAd(); shopModal.busy = false;
            shopModal.msg = L('Покупка не завершена', 'Purchase was not completed'); shopModal.msgT = 2.5;
        });
    } else if (platformName === 'web' && SHOP_TEST_MODE) {
        // Тестовая страница: покупка имитируется, на площадке — настоящая оплата
        shopModal.busy = true;
        setTimeout(() => { shopModal.busy = false; showShopReward(id, grantShopItem(id)); }, 700);
    }
}
let yPlayer = null;
let platformName = 'web';
let lastInterstitialTime = performance.now();
const INTERSTITIAL_COOLDOWN_MS = 180000;
const LEADERBOARD_NAME = 'topscore'; // техническое имя лидерборда в консоли Яндекс Игр
const LEADERBOARD_DAILY = 'dailyrun'; // лидерборд ежедневного забега

function adUnavailable() {
    addFloatingScore(VW / 2, 420, L('Реклама сейчас недоступна — попробуйте позже', 'Ads are unavailable right now — try later'), '#fca5a5', 15);
}
function pauseForAd() { adPlaying = true; systemMuted = true; aiming = false; }
function resumeAfterAd() { adPlaying = false; systemMuted = false; lastFrame = performance.now(); }

function tryShowInterstitialAdWithCooldown() {
    if (shopOwned.no_ads) return;
    const now = performance.now();
    if (now - lastInterstitialTime < INTERSTITIAL_COOLDOWN_MS) return;
    if (platformName === 'yandex' && ysdk && ysdk.adv) {
        lastInterstitialTime = now;
        pauseForAd();
        ysdk.adv.showFullscreenAdv({
            callbacks: {
                onClose: () => resumeAfterAd(),
                onError: () => resumeAfterAd()
            }
        });
    } else if (platformName === 'vk') {
        lastInterstitialTime = now;
        pauseForAd();
        window.vkBridge.send('VKWebAppShowNativeAds', { ad_format: 'interstitial' })
            .then(resumeAfterAd).catch(resumeAfterAd);
    }
}

function platformGameplayStart() {
    try { if (ysdk && ysdk.features && ysdk.features.GameplayAPI) ysdk.features.GameplayAPI.start(); } catch (e) {}
}
function platformGameplayStop() {
    try { if (ysdk && ysdk.features && ysdk.features.GameplayAPI) ysdk.features.GameplayAPI.stop(); } catch (e) {}
}

// Настоящий рейтинг площадки (если лидерборд создан в консоли)
function platformSubmitScore() {
    try {
        if (platformName !== 'yandex' || !ysdk) return;
        if (ysdk.leaderboards && ysdk.leaderboards.setScore) {
            ysdk.leaderboards.setScore(LEADERBOARD_NAME, score).catch(() => {});
        } else if (ysdk.getLeaderboards) {
            ysdk.getLeaderboards().then(lb => lb.setLeaderboardScore(LEADERBOARD_NAME, score)).catch(() => {});
        }
    } catch (e) {}
}

function platformSubmitDaily(depth) {
    try {
        if (platformName !== 'yandex' || !ysdk) return;
        if (ysdk.leaderboards && ysdk.leaderboards.setScore) ysdk.leaderboards.setScore(LEADERBOARD_DAILY, depth).catch(() => {});
        else if (ysdk.getLeaderboards) ysdk.getLeaderboards().then(lb => lb.setLeaderboardScore(LEADERBOARD_DAILY, depth)).catch(() => {});
    } catch (e) {}
}

// Облачные сохранения: прогресс не пропадёт при очистке браузера
let lastCloudSaveAt = 0;
function platformCloudSave() {
    try {
        if (!lastSaveJson) return;
        lastCloudSaveAt = Date.now();
        if (yPlayer) yPlayer.setData({ save: lastSaveJson }, false).catch(() => {});
        else if (platformName === 'vk') {
            // В VK на одно значение не больше 4 КБ: если не влезает — сохраняем прогресс без содержимого стакана
            let v = lastSaveJson;
            if (v.length > 4000) { const d = JSON.parse(v); d.orbs = []; d.quests = undefined; v = JSON.stringify(d); }
            if (v.length <= 4000) window.vkBridge.send('VKWebAppStorageSet', { key: 'save', value: v }).catch(() => {});
        }
    } catch (e) {}
}
// Облако: раз в минуту во время игры и сразу, когда игру сворачивают или закрывают
setInterval(() => { if (Date.now() - lastCloudSaveAt > 60000) platformCloudSave(); }, 15000);
document.addEventListener('visibilitychange', () => { if (document.hidden) { saveGameState(); platformCloudSave(); } });
window.addEventListener('pagehide', () => { saveGameState(); platformCloudSave(); });

function applyCloudSaveIfNewer(raw) {
    try {
        if (!raw) return;
        const cloud = JSON.parse(raw);
        const local = lastSaveJson ? JSON.parse(lastSaveJson) : null;
        const better = !local || (cloud.currentLevel || 1) > (local.currentLevel || 1) ||
            ((cloud.currentLevel || 1) === (local.currentLevel || 1) && (cloud.savedAt || 0) > (local.savedAt || 0));
        if (better) {
            orbs = [];
            loadGameState(raw);
            saveGameState();
        }
    } catch (e) {}
}

function applyBoosterEffect(type) {
    const t = I18N[currentLang];
    if (type === 'wheelSpin') {
        startWheelSpin();
    } else if (type === 'dailyX2') {
        claimDailyReward(2);
    } else if (type === 'bottomBlast') {
        executeBottomRowBlast();
    } else if (type === 'shake') {
        executeTornadoShake();
    } else if (type === 'laserLink') {
        executeRemoteLaserLink();
    } else if (type === 'hammer') {
        hammerMode = true;
    } else if (type === 'pickaxe') {
        // ⛏️ Кирка: разбивает все камни и снимает весь лёд (урона боссу не наносит)
        let n = 0;
        for (let i = orbs.length - 1; i >= 0; i--) {
            const o = orbs[i];
            if (o.isStone) { spawnParticles(o.x, o.y, '#94a3b8', 18); orbs.splice(i, 1); n++; }
            else if (o.frozen > 0) { o.frozen = 0; spawnParticles(o.x, o.y, '#bae6fd', 10); n++; }
        }
        jarShakeY = 10;
        playIceCrackSound();
        addFloatingScore(VW / 2, JAR.y + 140, L(`⛏️ РАЗБИТО: ${n}`, `⛏️ BROKEN: ${n}`), '#cbd5e1', 17);
        saveGameState();
    } else if (type === 'picker') {
        pickerModalOpen = true;
    } else if (type === 'slot777') {
        finishSlotSpin();
    } else if (type === 'stageX3') {
        lastInterstitialTime = performance.now();
        advanceToNextLevel(1);
    } else if (type.startsWith('upg_')) {
        // прокачка за рекламу отключена
    } else if (type === 'doubleTopOrb') {
        vipOffer.active = false;
        vipOffer.timer = 24;
        const normalOrbs = orbs.filter(o => !o.isStone);
        if (normalOrbs.length > 0) {
            let bestOrb = normalOrbs[0];
            normalOrbs.forEach(o => { if (o.tier > bestOrb.tier) bestOrb = o; });
            bestOrb.tier++;
            bestOrb.radius = getOrbRadius(bestOrb.tier);
            bestOrb.frozen = 0;
            bestOrb.scaleX = 0.35;
            bestOrb.scaleY = 1.6;
            if (bestOrb.tier > maxUnlockedTier) maxUnlockedTier = bestOrb.tier;
            fireRivalMissile(bestOrb.x, bestOrb.y, 1200, '#fbbf24');
            spawnSubtleStarburst(bestOrb.x, bestOrb.y, 3);
            fireFourCornerCannons();
            playJackpotFanfare();
            addFloatingScore(bestOrb.x, bestOrb.y - 20, t.vipUpgraded, '#fbbf24', 18);
        }
        saveGameState();
    } else if (type.startsWith('chestSkip')) {
        const i = Number(type.replace('chestSkip', ''));
        if (chestSlots[i]) chestSlots[i].readyAt -= 30 * 60000;
        saveGameState();
    } else if (type.startsWith('questX2_')) {
        claimQuest(Number(type.replace('questX2_', '')), 2);
    } else if (type === 'perkReroll') {
        perkModal.choices = rollPerkChoices();
        perkModal.rerolled = true;
        perkModal.t = 0.2;
    } else if (type === 'chestX2') {
        claimChest(2);
    } else if (type === 'revive') {
        if (gameOverReason === 'drops') rival.dropsLeft += 15;
        if (gameOverReason === 'time') rival.timeLeft += 25;
        outOfDropsT = 0;
        orbs.forEach(o => { o.frozen = 0; });
        orbs = orbs.filter(o => !o.isStone);
        orbs.sort((a, b) => a.y - b.y);
        const toRemove = gameOverReason === 'overflow' ? Math.min(8, orbs.length) : Math.min(3, orbs.length);
        for (let i = 0; i < toRemove; i++) {
            const o = orbs[i];
            spawnParticles(o.x, o.y, getOrbColors(o.tier).color1, 14);
        }
        orbs.splice(0, toRemove);
        revivesThisLevel++;
        lavaTimer = 0;
        dangerTimer = 0;
        isGameOver = false;
        platformGameplayStart();
        canDrop = true;
        dropCooldown = 0;
        playPopSound(7, 4);
        saveGameState();
    }
}

function watchRewardedAd(type) {
    if (platformName === 'yandex' && ysdk && ysdk.adv) {
        pauseForAd();
        let rewarded = false;
        ysdk.adv.showRewardedVideo({
            callbacks: {
                onRewarded: () => { rewarded = true; lastInterstitialTime = performance.now(); },
                onClose: () => { resumeAfterAd(); if (rewarded) applyBoosterEffect(type); },
                onError: () => { resumeAfterAd(); adUnavailable(); }
            }
        });
    } else if (platformName === 'vk') {
        pauseForAd();
        window.vkBridge.send('VKWebAppCheckNativeAds', { ad_format: 'reward', use_waterfall: false })
            .then(chk => {
                if (!chk || !chk.result) { resumeAfterAd(); adUnavailable(); return; }
                return window.vkBridge.send('VKWebAppShowNativeAds', { ad_format: 'reward', use_waterfall: false })
                    .then(data => { resumeAfterAd(); if (data && data.result) { lastInterstitialTime = performance.now(); applyBoosterEffect(type); } else adUnavailable(); });
            })
            .catch(() => { resumeAfterAd(); adUnavailable(); });
    } else if (!SHOP_TEST_MODE) {
        // Боевой хостинг, но SDK площадки не загрузился — рекламу не имитируем (п. 1.16)
        adUnavailable();
    } else {
        // Без площадки (тест в браузере): имитация рекламы на 3 секунды
        pauseForAd();
        fakeAd = { t: 3, type };
    }
}
let fakeAd = null;

function resetGame() {
    orbs = [];
    combo = 0;
    dangerTimer = 0;
    isGameOver = false;
    canDrop = true;
    dropCooldown = 0;
    initRivalForLevel(currentLevel);
    saveGameState();
    platformGameplayStart();
    tryShowInterstitialAdWithCooldown();
}

loadGameState();
tryLoadMusicFiles();

if (typeof YaGames !== 'undefined') {
    platformName = 'yandex';
    YaGames.init().then(_sdk => {
        ysdk = _sdk;
        const envLang = ysdk.environment.i18n.lang;
        currentLang = (envLang === 'ru' || envLang === 'be' || envLang === 'kk' || envLang === 'uk') ? 'ru' : 'en';
        if (ysdk.features && ysdk.features.LoadingAPI) ysdk.features.LoadingAPI.ready();
        initPayments();
        // Пауза при сворачивании и при показе рекламы из меню платформы
        try {
            ysdk.on && ysdk.on('game_api_pause', () => { systemMuted = true; adPlaying = true; });
            ysdk.on && ysdk.on('game_api_resume', () => resumeAfterAd());
        } catch (e) {}
        ysdk.getPlayer().then(p => {
            yPlayer = p;
            return p.getData(['save']);
        }).then(d => { if (d && d.save) applyCloudSaveIfNewer(d.save); }).catch(() => {});
    }).catch(() => { platformName = 'web'; });
} else if (window.vkBridge) {
    platformName = 'vk';
    window.vkBridge.send('VKWebAppInit').catch(() => {});
    window.vkBridge.send('VKWebAppStorageGet', { keys: ['save'] })
        .then(r => { const v = r && r.keys && r.keys[0] && r.keys[0].value; if (v) applyCloudSaveIfNewer(v); })
        .catch(() => {});
}

requestAnimationFrame(gameLoop);
</script>
