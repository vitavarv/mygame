        bestDepth = data.bestDepth || 0;
        runStartLevel = data.runStartLevel || 1;
        hintSeen = data.hintSeen || {};
        pendingPerkPicks = data.pendingPerkPicks || 0;
        runDrops = data.runDrops || 0;
        secondUsed = !!data.secondUsed;
        if (data.quests && Array.isArray(data.quests.list)) quests = data.quests;
        if (data.daily) daily = data.daily;
        dailyMode = !!data.dailyMode;
        if (dailyMode) dailyRng = mulberry32(seedFromStr('daily' + todayKey() + (data.currentLevel || 1)));
        if (Array.isArray(data.discoveredSyn)) discoveredSyn = data.discoveredSyn;
        if (Array.isArray(data.clubLevels) && data.clubLevels.length === WORLD_COUNT) clubLevels = data.clubLevels;
        finalWins = data.finalWins || 0;
        mergeCount = data.mergeCount || 0;
        if (data.shopOwned && typeof data.shopOwned === 'object') shopOwned = Object.assign({}, data.shopOwned);
        if (Array.isArray(data.ownedSkins)) ownedSkins = data.ownedSkins.filter(id => SKINS.some(k => k.id === id));
        if (!ownedSkins.includes('classic')) ownedSkins.unshift('classic');
        if (ownedSkins.includes(data.equippedSkin)) setSkin(data.equippedSkin);
        // Старые аксессуары («лица») больше не используются: за каждый — по облику из сундука
        if (Array.isArray(data.ownedAcc) && data.ownedAcc.length > 1) {
            const pool = SKINS.filter(k => k.chest && !ownedSkins.includes(k.id));
            for (let q = 0; q < Math.min(pool.length, data.ownedAcc.length - 1); q++) ownedSkins.push(pool[q].id);
        }
        score = data.score || 0;
        stars = data.stars ?? 60;
        currentLevel = data.currentLevel || 1;
        themeIdx = data.themeIdx ?? ((currentLevel - 1) % WORLD_COUNT);
        leagueIdx = data.leagueIdx || 0;
        initRivalForLevel(currentLevel);
        if (data.rivalHp > 0 && data.rivalMaxHp > 0) {
            rival.hp = data.rivalHp;
            rival.maxHp = data.rivalMaxHp;
        }
        if (data.boosterCharges) boosterCharges = Object.assign(boosterCharges, data.boosterCharges);
        if (data.metaUpgrades) metaUpgrades = Object.assign(metaUpgrades, data.metaUpgrades);
        // Старые сохранения могли раздуться — приводим к разумным пределам
        metaUpgrades.minSpawnLvl = 0;
        metaUpgrades.wallLvl = Math.min(UPG_MAX.wallLvl, metaUpgrades.wallLvl || 0);
        metaUpgrades.bossDmgLvl = Math.max(1, Math.min(UPG_MAX.bossDmgLvl, metaUpgrades.bossDmgLvl || 1));
        metaUpgrades.turretLvl = Math.max(1, Math.min(UPG_MAX.turretLvl, metaUpgrades.turretLvl || 1));
        maxUnlockedTier = Math.min(12, data.maxUnlockedTier ?? 2);
        if (Array.isArray(data.orbs)) data.orbs.forEach(o => { o.tier = Math.min(12, o.tier || 0); });
        score = Math.min(score, 5e7);
        loginDay = data.loginDay || 1;
        if (data.lang) currentLang = data.lang;
        dailyClaimedToday = (data.lastClaimDate === todayStr);

        if (Array.isArray(data.orbs) && data.orbs.length > 0) {
            orbs = data.orbs.map(o => {
                const created = createOrb(o.x, o.y, o.tier, !!o.isRainbow, false, !!o.isChest, false, !!o.isStone);
                created.frozen = o.frozen || 0;
                return created;
            });
        }
    } catch (e) {
        initRivalForLevel(1);
    }
}

// ============================================================================
// 6. УПРАВЛЕНИЕ: ГЛАВНОЕ МЕНЮ, ОКНО ЛИДЕРОВ, 7 ДНЕЙ И БОЕВОЙ ЭКРАН
// ============================================================================
function inBox(px, py, b) {
    return px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h;
}

function tryUseTacticalBooster(type) {
    const t = I18N[currentLang];
    const reqLvl = BOOSTER_UNLOCK_LVL[type] || 1;
    if (currentLevel < reqLvl) {
        playIceCrackSound();
        addFloatingScore(VW / 2, 720, `${t.lockedToast}${reqLvl}!`, '#f43f5e', 16);
        return;
    }
    if (boosterCharges[type] > 0) {
        boosterCharges[type]--;
        applyBoosterEffect(type);
        saveGameState();
    } else {
        // Не больше 2 бустеров за рекламу на один уровень — иначе игра проходится сама
        if ((adBoostUses[type] || 0) >= AD_BOOST_LIMIT) {
            playIceCrackSound();
            addFloatingScore(VW / 2, 720, L('Лимит на этот уровень — заряды вернутся на следующем', 'Limit for this level — charges return next level'), '#fca5a5', 13);
            return;
        }
        // Реклама только после явного подтверждения игрока
        openAdConfirm(type, t.adConfirmTitle, t.adConfirmSub);
    }
}
const AD_BOOST_LIMIT = 1;
const REVIVE_LIMIT = 2;
let adBoostUses = {};

function openAdConfirm(type, title, sub) {
    adConfirm = { open: true, type, title, sub };
    aiming = false;
}

function claimDailyReward(mult = 1) {
    const r = DAILY_REWARDS[(loginDay - 1) % 7];
    if (!dailyClaimedToday) {
        stars += r.stars * mult;
        boosterCharges.bottomBlast += 1 * mult;
        dailyClaimedToday = true;
        loginDay = (loginDay % 7) + 1;
        playJackpotFanfare();
        spawnConfettiShower();
        fireFourCornerCannons();
        saveGameState();
    }
    dailyModalOpen = false;
}

canvas.addEventListener('pointermove', (e) => {
    const pt = screenToVirtual(e.clientX, e.clientY);
    if (pendingShot && Math.hypot(pt.x - pendingShot.x, pt.y - pendingShot.y) > (pendingShot.armed ? 36 : 14)) {
        if (pendingShot.armed) addFloatingScore(pendingShot.x, pendingShot.y - 30, L('Отмена', 'Cancelled'), '#94a3b8', 13);
        pendingShot = null;
    }
    const r = getOrbRadius(currentOrbTier);
    aimX = Math.max(JAR.x + JAR.wall + r + 2, Math.min(JAR.x + JAR.w - JAR.wall - r - 2, pt.x));
});

// Отпустил палец — сфера падает (прицеливание «тяни и отпусти»)
function releaseAim(e) {
    // Заряженный выстрел срабатывает, когда игрок отпускает палец
    const ps = pendingShot;
    pendingShot = null;
    if (ps && ps.armed) {
        aiming = false;
        const o = orbs.find(x => x.id === ps.id);
        if (o && !isGameOver && !adConfirm.open && koTimer <= 0) fireOrbShot(o);
        return;
    }
    // Отпустил раньше, чем зарядился выстрел, — это обычный бросок
    if (!aiming) return;
    aiming = false;
    if (inStartMenu || isGameOver || adConfirm.open || stageWinModalOpen || koTimer > 0 || adPlaying || chestModal.open || collectionModalOpen) return;
    if (rival.type === 'drops' && rival.dropsLeft <= 0) return;
    if (!canDrop && dropCooldown <= 0.05) canDrop = true;
    if (canDrop) {
        const pt = screenToVirtual(e.clientX, e.clientY);
        const r = getOrbRadius(currentOrbTier);
        aimX = Math.max(JAR.x + JAR.wall + r + 2, Math.min(JAR.x + JAR.w - JAR.wall - r - 2, pt.x));
        dropCurrentOrb();
        if (!tutorialDone && tutorialStep === 0) { tutorialStep = 1; tutorialHoldT = 0; }
    }
}
canvas.addEventListener('pointerup', releaseAim);
canvas.addEventListener('pointercancel', () => { aiming = false; pendingShot = null; });

canvas.addEventListener('pointerdown', (e) => {
    unlockAndStartAudio();
    const pt = screenToVirtual(e.clientX, e.clientY);
    const t = I18N[currentLang];
    if (adPlaying || koTimer > 0) return;

    // 0. Подтверждение просмотра рекламы
    if (adConfirm.open) {
        if (inBox(pt.x, pt.y, UI_BTN.adYes)) {
            const type = adConfirm.type;
            adConfirm.open = false;
            if (BOOSTER_UNLOCK_LVL[type]) adBoostUses[type] = (adBoostUses[type] || 0) + 1;
            watchRewardedAd(type);
        } else if (inBox(pt.x, pt.y, UI_BTN.adNo)) {
            adConfirm.open = false;
        }
        return;
    }

    // Концовка кампании
    if (endingModal.open) {
        if (pt.x >= 90 && pt.x <= 390 && pt.y >= 600 && pt.y <= 656) endingModal.open = false;
        return;
    }
    // Задания дня
    if (questsModalOpen) { questsModalClick(pt); return; }
    if (gemsModal.open) { gemsModalClick(pt); return; }
    if (shopModal.open) { if (!shopModal.busy) shopModalClick(pt); return; }
    if (startPick.open) { startPickClick(pt); return; }

    // Выбор усиления
    if (perkModal.open) {
        if (perkModal.t < 0.4) return;
        for (let i = 0; i < perkModal.choices.length; i++) {
            const by = 250 + i * 122;
            if (pt.x >= 40 && pt.x <= 440 && pt.y >= by && pt.y <= by + 108) { pickPerk(perkModal.choices[i]); return; }
        }
        if (!perkModal.rerolled && !dailyMode && pt.x >= 110 && pt.x <= 370 && pt.y >= 626 && pt.y <= 672) watchRewardedAd('perkReroll');
        return;
    }
    // Итоги забега
    if (runEndModal.open) {
        const cp = runEndModal.wasDaily ? 1 : checkpointLevel();
        if (cp > 1) {
            if (pt.x >= 70 && pt.x <= 410 && pt.y >= 526 && pt.y <= 584) startNewRun(false, cp);
            else if (pt.x >= 70 && pt.x <= 234 && pt.y >= 596 && pt.y <= 642) startNewRun(false, 1);
            else if (pt.x >= 246 && pt.x <= 410 && pt.y >= 596 && pt.y <= 642) { startNewRun(); inStartMenu = true; platformGameplayStop(); }
        } else {
            if (pt.x >= 70 && pt.x <= 410 && pt.y >= 530 && pt.y <= 590) startNewRun();
            else if (pt.x >= 140 && pt.x <= 340 && pt.y >= 604 && pt.y <= 648) { startNewRun(); inStartMenu = true; platformGameplayStop(); }
        }
        return;
    }

    // Открытие сундука
    if (chestModal.open) {
        if (chestModal.phase === 0) { chestModal.phase = 1; chestModal.t = 0; vibrateDevice(20); playPopSound(4, 2); }
        else if (chestModal.phase === 2 && chestModal.t > 0.8) {
            if (inBox(pt.x, pt.y, UI_BTN.chestX2) && !chestModal.granted) watchRewardedAd('chestX2');
            else if (inBox(pt.x, pt.y, UI_BTN.chestClaim)) claimChest(1);
        }
        return;
    }

    // Облики камней
    if (collectionModalOpen) { skinsModalClick(pt); return; }

    // Колесо подарков (открывается и из меню, и из боя)
    if (wheelModalOpen) {
        if (inBox(pt.x, pt.y, UI_BTN.spinNow) && !wheelSpinning) {
            watchRewardedAd('wheelSpin');
        } else if (inBox(pt.x, pt.y, UI_BTN.closeWh) && !wheelSpinning) {
            wheelModalOpen = false;
            wheelPrizeBanner = '';
        }
        return;
    }

    // 1. Окно Ежедневного Бонуса 7 Дней
    if (dailyModalOpen) {
        if (inBox(pt.x, pt.y, UI_BTN.dailyClaimX2)) watchRewardedAd('dailyX2');
        else if (inBox(pt.x, pt.y, UI_BTN.dailyClaim1)) claimDailyReward(1);
        return;
    }

    // 2. Окно Таблицы Лидеров Топ-100
    if (leaderboardModalOpen) {
        if (pt.y > 620) leaderboardModalOpen = false;
        return;
    }

    // 3. Окно Империи Клубов
    if (empireModalOpen) {
        if (pt.y > 640 || pt.y < 110) empireModalOpen = false;
        return;
    }

    // 4. Окно Прокачки Базы
    if (upgModalOpen) {
        const keys = ['wallLvl', 'bossDmgLvl', 'turretLvl'];
        for (let i = 0; i < 3; i++) {
            const by = 240 + i * 105;
            if (pt.x >= 285 && pt.x <= 425 && pt.y >= by + 15 && pt.y <= by + 68) {
                const k = keys[i];
                const cost = upgradeCost(metaUpgrades[k]);
                if (metaUpgrades[k] >= UPG_MAX[k]) return;
                if (stars >= cost) {
                    stars -= cost;
                    metaUpgrades[k]++;
                    playJackpotFanfare();
                    saveGameState();
                } else {
                    playIceCrackSound();
                }
                return;
            }
        }
        if (pt.y > 570) upgModalOpen = false;
        return;
    }

    // 5. ЕСЛИ ОТКРЫТО ГЛАВНОЕ МЕНЮ ЗАПУСКА!
    if (inStartMenu) {
        if (inBox(pt.x, pt.y, UI_BTN.mPlay)) {
            if (!dailyMode && isFreshRun() && checkpointLevel() > 1) { startPick.open = true; return; }
            inStartMenu = false;
            if (dailyMode && currentLevel <= 1) startNewRun(false);
            if (pendingPerkPicks > 0 && !perkModal.open) { pendingPerkPicks--; openPerkChoice(); }
            playJackpotFanfare();
            platformGameplayStart();
            return;
        }
        if (inBox(pt.x, pt.y, UI_BTN.mDailyRun)) {
            if (currentLevel <= 1) { startDailyRun(); playJackpotFanfare(); }
            return;
        }
        if (inBox(pt.x, pt.y, UI_BTN.mColl)) { collectionModalOpen = true; newAccBadge = false; skinsModal.sel = Math.max(0, skinList().findIndex(k => k.id === equippedSkin)); return; }
        if (inBox(pt.x, pt.y, UI_BTN.mQuest)) { questsModalOpen = true; return; }
        if (inBox(pt.x, pt.y, UI_BTN.mCity)) { empireModalOpen = true; return; }
        if (inBox(pt.x, pt.y, UI_BTN.mBonus)) { dailyModalOpen = true; return; }
        if (inBox(pt.x, pt.y, UI_BTN.mUpg)) { gemsModal.open = true; gemsModal.sel = gemsModal.sel ?? 0; return; }
        if (inBox(pt.x, pt.y, UI_BTN.mWheel)) { leaderboardModalOpen = true; return; }
        for (let i = 0; i < 3; i++) {
            const bx = 65 + i * 120;
            if (pt.x >= bx && pt.x <= bx + 110 && pt.y >= CHEST_ROW_Y && pt.y <= CHEST_ROW_Y + 92) {
                const sl = chestSlots[i];
                if (sl && chestIsReady(sl)) openChestSlot(i);
                else if (sl) openAdConfirm('chestSkip' + i, t.chestSkipTitle, t.chestSkipSub);
                return;
            }
        }

        if (shopAvailable() && pt.x >= 12 && pt.x <= 162 && pt.y >= 6 && pt.y <= 46) { shopModal.open = true; return; }
        // Переключатели музыки, звуков и языка вверху главного меню
        if (inBox(pt.x, pt.y, UI_BTN.music)) {
            musicEnabled = !musicEnabled;
            saveGameState();
            return;
        }
        if (inBox(pt.x, pt.y, UI_BTN.sfx)) {
            soundEnabled = !soundEnabled;
            saveGameState();
            return;
        }
        if (inBox(pt.x, pt.y, UI_BTN.lang)) {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            saveGameState();
            return;
        }
        return;
    }

    // 6. Окно Колеса Фортуны
    if (wheelModalOpen) {
        if (inBox(pt.x, pt.y, UI_BTN.spinNow) && !wheelSpinning) {
            watchRewardedAd('wheelSpin');
        } else if (inBox(pt.x, pt.y, UI_BTN.closeWh) && !wheelSpinning) {
            wheelModalOpen = false;
            wheelPrizeBanner = '';
        }
        return;
    }

    // 7. Окно Победы в Дуэли
    if (stageWinModalOpen) {
        if (inBox(pt.x, pt.y, UI_BTN.stageClaimX3)) watchRewardedAd('stageX3');
        else if (inBox(pt.x, pt.y, UI_BTN.stageClaim1)) advanceToNextLevel(0);
        return;
    }

    // 8. Окно Выбора Сферы
    if (pickerModalOpen) {
        const choices = getPickerChoices();
        for (let i = 0; i < 6; i++) {
            const col = i % 3;
            const row = Math.floor(i / 3);
            const bx = 54 + col * 130;
            const by = 260 + row * 135;
            if (pt.x >= bx && pt.x <= bx + 112 && pt.y >= by && pt.y <= by + 118) {
                const ch = choices[i];
                currentOrbTier = ch.tier;
                isBombCurrent = (ch.mode === 'bomb');
                isRainbowCurrent = (ch.mode === 'rainbow');
                pickerModalOpen = false;
                canDrop = true;
                dropCooldown = 0;
                playJackpotFanfare();
                return;
            }
        }
        if (pt.y > 545) pickerModalOpen = false;
        return;
    }

    // 9. Окно Переполнения
    if (isGameOver) {
        if (inBox(pt.x, pt.y, UI_BTN.revive)) {
            if (revivesThisLevel < REVIVE_LIMIT) watchRewardedAd('revive');
            else playIceCrackSound();
        }
        else if (inBox(pt.x, pt.y, UI_BTN.restart)) finishRun();
        return;
    }

    // Верхние кнопки в бою: Меню, Музыка, Звуки, Язык
    if (inBox(pt.x, pt.y, UI_BTN.homeTop)) { inStartMenu = true; platformGameplayStop(); return; }
    if (inBox(pt.x, pt.y, UI_BTN.music)) {
        musicEnabled = !musicEnabled;
        saveGameState();
        return;
    }
    if (inBox(pt.x, pt.y, UI_BTN.sfx)) {
        soundEnabled = !soundEnabled;
        saveGameState();
        return;
    }
    if (inBox(pt.x, pt.y, UI_BTN.lang)) {
        currentLang = currentLang === 'ru' ? 'en' : 'ru';
        saveGameState();
        return;
    }

    // Подарок за рекламу (раз в 75 секунд, только по явному нажатию)
    if (inBox(pt.x, pt.y, UI_BTN.giftBox)) {
        if (giftTimer <= 0 && !slotMachine.spinning) openAdConfirm('slot777', t.giftConfirmTitle, t.giftConfirmSub);
        return;
    }
    if (inBox(pt.x, pt.y, UI_BTN.nextBox)) return;

    if (flyingDrone.active && Math.hypot(pt.x - flyingDrone.x, pt.y - flyingDrone.y) <= 34) {
        flyingDrone.active = false;
        flyingDrone.timer = 70 + Math.random() * 40;
        stars += 10;
        fireRivalMissile(flyingDrone.x, flyingDrone.y, 300, '#fbbf24');
        spawnSubtleStarburst(flyingDrone.x, flyingDrone.y, 3);
        playJackpotFanfare();
        spawnParticles(flyingDrone.x, flyingDrone.y, '#fbbf24', 18);
        addFloatingScore(flyingDrone.x, flyingDrone.y, t.droneHit, '#fbbf24', 16.5);
        saveGameState();
        return;
    }

    if (inBox(pt.x, pt.y, UI_BTN.bBlast))  { tryUseTacticalBooster('bottomBlast'); return; }
    if (inBox(pt.x, pt.y, UI_BTN.bPick))   { tryUseTacticalBooster('pickaxe'); return; }
    if (inBox(pt.x, pt.y, UI_BTN.bShake))  { tryUseTacticalBooster('shake'); return; }
    if (inBox(pt.x, pt.y, UI_BTN.bLink))   { tryUseTacticalBooster('laserLink'); return; }
    if (inBox(pt.x, pt.y, UI_BTN.bHammer)) {
        if (hammerMode) hammerMode = false;
        else tryUseTacticalBooster('hammer');
        return;
    }
    if (inBox(pt.x, pt.y, UI_BTN.bPicker)) { tryUseTacticalBooster('picker'); return; }

    if (hammerMode) {
        for (let i = orbs.length - 1; i >= 0; i--) {
            const o = orbs[i];
            if (Math.hypot(pt.x - o.x, pt.y - o.y) <= o.radius + 14) {
                const pal = getOrbColors(o.tier);
                spawnParticles(o.x, o.y, pal.color1, 20);
                fireRivalMissile(o.x, o.y, 80, pal.color1);
                shockRings.push({ x: o.x, y: o.y, r: 8, maxR: o.radius * 3.2, color: '#f43f5e' });
                playPopSound(o.tier + 2, 3);
                orbs.splice(i, 1);
                hammerMode = false;
                canDrop = true;
                dropCooldown = 0;
                saveGameState();
                return;
            }
        }
        hammerMode = false;
        return;
    }

    // Раскалывание льда кликом пальца
    for (let i = orbs.length - 1; i >= 0; i--) {
        const o = orbs[i];
        if (o.frozen > 0 && Math.hypot(pt.x - o.x, pt.y - o.y) <= o.radius + 10) {
            o.frozen--;
            o.scaleX = 1.25;
            o.scaleY = 0.78;
            playIceCrackSound();
            vibrateDevice(15);
            spawnParticles(o.x, o.y, '#38bdf8', 10);
            if (o.frozen <= 0) {
                stars += 5;
                addFloatingScore(o.x, o.y - 20, t.iceBrokenMsg, '#38bdf8', 15, true);
            }
            return;
        }
    }

    // Тап по крупной сфере — кандидат на выстрел (если палец не поведут в сторону)
    const shootable = findShootableAt(pt.x, pt.y);
    pendingShot = shootable ? { id: shootable.id, x: pt.x, y: pt.y, hold: 0 } : null;

    if (pt.y >= 130 && pt.y <= JAR.y + JAR.h + 10) {
        // Начинаем прицеливание; бросок — когда игрок отпустит палец
        aiming = true;
        const r = getOrbRadius(currentOrbTier);
        aimX = Math.max(JAR.x + JAR.wall + r + 2, Math.min(JAR.x + JAR.w - JAR.wall - r - 2, pt.x));
    }
});

function dropCurrentOrb() {
    canDrop = false;
    dropCooldown = 0.26;
    totalDropsCount++;
    if (rival.type === 'drops') rival.dropsLeft = Math.max(0, rival.dropsLeft - 1);
    vibrateDevice(10);

    const orb = createOrb(aimX, JAR.y - 6, currentOrbTier, isRainbowCurrent, false, isChestNext, isBombCurrent, false);
    orb.isGolden = goldenCurrent && !isBombCurrent;
    orb.vy = 265;
    orb.expression = 'surprised';
    orb.exprTimer = 0.45;
    orbs.push(orb);

    isRainbowCurrent = false;
    isBombCurrent = false;
    isChestNext = (totalDropsCount % 9 === 8);
    runDrops++;
    // Перки «Подрывник» и «Джокер»
    if (perkLvl('bomb') && runDrops % perkDef('bomb').n(perkLvl('bomb')) === 0) isBombCurrent = true;
    else if (perkLvl('joker') && runDrops % Math.max(4, perkDef('joker').n(perkLvl('joker')) - (synActive('prism') ? 5 : 0)) === 0) isRainbowCurrent = true;
    goldenCurrent = rollGolden();

    const minLvl = 0;
    currentOrbTier = Math.max(minLvl, nextOrbTier);
    // С 4-го уровня в руку иногда приходят сферы крупнее — стакан заполняется быстрее
    const spread = Math.max(2, (currentLevel >= 3 ? 4 : 3) - perkLvl('small'));
    nextOrbTier = spawnBaseTier() + Math.floor(Math.pow(Math.random(), 1.15) * spread);
    saveGameState();
}

// ============================================================================
// 7. ФИЗИКА СФЕР + ПОДВИЖНЫЕ ПИНБОЛ-БАМПЕРЫ ⚡
// ============================================================================
function stepPhysics(dt, now) {
    const t = I18N[currentLang];
    sanitizeOrbsArray();

    PINBALL_BUMPERS.forEach(bmp => {
        bmp.y = bmp.baseY + Math.sin(now * 0.0022 + bmp.phaseOffset) * 78;
    });

    const SUBSTEPS = 6; // 6 подшагов дают идеальный баланс точности и скорости!
    const subDt = dt / SUBSTEPS;
    const gravity = 1220;
    const wallLeft = JAR.x + JAR.wall;
    const wallRight = JAR.x + JAR.w - JAR.wall;
    const floorY = JAR.y + JAR.h - JAR.wall;

    for (let step = 0; step < SUBSTEPS; step++) {
        for (let i = 0; i < orbs.length; i++) {
            const o = orbs[i];
            o.vy += gravity * subDt;
            o.x += o.vx * subDt;
            o.y += o.vy * subDt;
            o.rot += (o.vx * subDt) / o.radius;

            if (step === 0 && o.bumperCooldown <= 0) {
                PINBALL_BUMPERS.forEach(bmp => {
                    const distB = Math.hypot(o.x - bmp.x, o.y - bmp.y);
                    if (distB < o.radius + bmp.r) {
                        o.vx = bmp.side * 330;
                        o.vy = -200;
                        o.scaleX = 1.3;
                        o.scaleY = 0.75;
                        o.bumperCooldown = 0.9;
                        bmp.glowTimer = 0.45;

                        playPopSound(o.tier + 2, 2);
                        const wMode = themeIdx % WORLD_COUNT;
                        // 🎲 Отбойник-рулетка: сфера получает случайное значение (2…128, с уровнем диапазон выше)
                        // Эффект срабатывает примерно на каждом втором ударе
                        const trapRoll = Math.random() < (currentLevel === 1 ? 0.3 : 0.5) ? (currentLevel === 1 ? 0.42 + Math.random() * 0.58 : Math.random()) : 99;
                        const stonesNow = orbs.filter(x => x.isStone).length;
                        if (!o.isStone && !o.isBomb && !o.isRainbow && !o.isGolden && !o.isChest && trapRoll < (currentLevel >= 2 ? 0.12 : 0) && stonesNow < 2) {
                            // 🪨 Ловушка: сфера каменеет — не сливается, пока рядом не случится слияние
                            o.isStone = true;
                            o.radius = 30;
                            o.frozen = 0;
                            spawnParticles(o.x, o.y, '#94a3b8', 16);
                            playIceCrackSound();
                            addFloatingScore(bmp.x + bmp.side * 60, bmp.y - 18, L('🪨 ОКАМЕНЕЛА НАВСЕГДА!', '🪨 PETRIFIED!'), '#cbd5e1', 15);
                        } else if (!o.isStone && !o.isBomb && !o.isRainbow && !o.isGolden && !o.isChest && trapRoll < 0.32) {
                            // 🧊 Ловушка: сфера во льду (2–3 слоя)
                            o.frozen = 2 + (Math.random() < 0.4 ? 1 : 0);
                            spawnParticles(o.x, o.y, '#bae6fd', 14);
                            playIceCrackSound();
                            addFloatingScore(bmp.x + bmp.side * 60, bmp.y - 18, L('🧊 ЗАМОРОЖЕНА!', '🧊 FROZEN!'), '#bae6fd', 15);
                        } else if (!o.isStone && !o.isBomb && !o.isRainbow && !o.isGolden && !o.isChest && o.tier > 0 && trapRoll < 0.42 && orbs.length < 26) {
                            // ➗ Делитель: сфера распадается на две половинки
                            const half = o.tier - 1;
                            o.tier = half; o.radius = getOrbRadius(half);
                            const twin = createOrb(o.x - bmp.side * 20, o.y - 10, half, false, false, false, false, false);
                            twin.vx = -bmp.side * 160; twin.vy = -260;
                            orbs.push(twin);
                            spawnParticles(o.x, o.y, '#f0abfc', 14);
                            addFloatingScore(bmp.x + bmp.side * 60, bmp.y - 18, L(`➗ РАСКОЛОЛАСЬ: ${formatOrbNumber(half)} + ${formatOrbNumber(half)}`, `➗ SPLIT: ${formatOrbNumber(half)} + ${formatOrbNumber(half)}`), '#f0abfc', 14);
                        } else if (!o.isStone && !o.isBomb && trapRoll < 0.52) {
                            // 🚀 Выброс: сферу швыряет к линии переполнения
                            o.vy = -950; o.vx = bmp.side * 260;
                            addFloatingScore(bmp.x + bmp.side * 60, bmp.y - 18, L('🚀 ВЫБРОС ВВЕРХ!', '🚀 LAUNCHED!'), '#fb923c', 15);
                        } else if (!o.isStone && !o.isBomb && !o.isRainbow && !o.isGolden && !o.isChest && trapRoll < 0.62) {
                            // 🍀 Удача: сфера вырастает на ступень
                            o.tier += 1; o.radius = getOrbRadius(o.tier);
                            if (o.tier > maxUnlockedTier) maxUnlockedTier = o.tier;
                            spawnParticles(o.x, o.y, '#4ade80', 16);
                            addFloatingScore(bmp.x + bmp.side * 60, bmp.y - 18, L(`🍀 УДАЧА! → ${formatOrbNumber(o.tier)}`, `🍀 LUCKY! → ${formatOrbNumber(o.tier)}`), '#4ade80', 15);
                        } else if (!o.isStone && !o.isBomb && !o.isRainbow && !o.isGolden && !o.isChest && trapRoll < 1) {
                            const oldTier = o.tier;
                            let nt = spawnBaseTier() + Math.floor(Math.random() * 7);
                            if (nt === oldTier) nt = Math.max(0, nt + (Math.random() < 0.5 ? -1 : 1));
                            o.tier = nt;
                            o.radius = getOrbRadius(nt);
                            o.frozen = 0;
                            o.unmergedTime = 0;
                            spawnParticles(o.x, o.y, getOrbColors(nt).color1, 12);
                            playWheelTick();
                            addFloatingScore(bmp.x + bmp.side * 60, bmp.y - 18, `🎲 ${formatOrbNumber(oldTier)} → ${formatOrbNumber(nt)}`, nt > oldTier ? '#4ade80' : '#fca5a5', 15);
                            if (nt > maxUnlockedTier) maxUnlockedTier = nt;
                        }
                        if (wMode === 1) {
                            // Вегас: Золотая фишка дает +1 звезду!
                            spawnSubtleStarburst(bmp.x, bmp.y, 1);
                            addFloatingScore(bmp.x + bmp.side * 46, bmp.y, t.gizmoVegasMsg, '#fde047', 13.5, true);
                        } else if (wMode === 3 && o.frozen > 0) {
                            // Атлантида: Снимает лед при ударе о раковину!
                            o.frozen = 0;
                            addFloatingScore(bmp.x + bmp.side * 46, bmp.y, t.iceBrokenMsg, '#2dd4bf', 13.5, true);
                        } else if (wMode === 4) {
                            // Токио: Нитро-дрифт ускорение!
                            o.vx = bmp.side * 440;
                            addFloatingScore(bmp.x + bmp.side * 46, bmp.y, t.nitroMsg, '#f43f5e', 13.5, true);
                        } else {
                            addFloatingScore(bmp.x + bmp.side * 42, bmp.y, t.bumperHitMsg, '#38bdf8', 13.5, true);
                        }
                    }
                });
            }

            if (o.x - o.radius < wallLeft) {
                o.x = wallLeft + o.radius;
                if (o.vx < -60) {
                    o.scaleX = 0.82; o.scaleY = 1.18;
                    if (step === 0 && o.vx < -130) wallRipples.push({ x: wallLeft, y: o.y, life: 0.35, col: getOrbColors(o.tier).color1 });
                }
                o.vx = -o.vx * 0.36;
            }
            if (o.x + o.radius > wallRight) {
                o.x = wallRight - o.radius;
                if (o.vx > 60) {
                    o.scaleX = 0.82; o.scaleY = 1.18;
                    if (step === 0 && o.vx > 130) wallRipples.push({ x: wallRight, y: o.y, life: 0.35, col: getOrbColors(o.tier).color1 });
                }
                o.vx = -o.vx * 0.36;
            }
            if (o.y + o.radius > floorY) {
                o.y = floorY - o.radius;
                if (o.vy > 90) {
                    const deform = Math.min(0.28, o.vy / 1150);
                    o.scaleX = 1 + deform;
                    o.scaleY = 1 - deform;
                }
                o.vy = -o.vy * 0.24;
                o.vx *= 0.92;
            }
        }

        for (let i = 0; i < orbs.length; i++) {
            for (let j = i + 1; j < orbs.length; j++) {
                const a = orbs[i];
                const b = orbs[j];
                if (!a || !b || a.merging || b.merging) continue;

                const dx = b.x - a.x;
                const dy = b.y - a.y;
                const dist = Math.hypot(dx, dy);
                const minDist = a.radius + b.radius;

                const canAttract = !a.isStone && !b.isStone && a.frozen === 0 && b.frozen === 0 && a.tier === b.tier;
                if (canAttract && dist < minDist * 1.14 && dist > minDist) {
                    const pull = 28 * (1 + perkLvl('magnet') * 2.5) * subDt;
                    a.vx += (dx / dist) * pull;
                    a.vy += (dy / dist) * pull;
                    b.vx -= (dx / dist) * pull;
                    b.vy -= (dy / dist) * pull;
                }

                if (dist < minDist && dist > 0.0001) {
                    if (a.isBomb || b.isBomb) {
                        const bomb = a.isBomb ? a : b;
                        detonateBombOrb(bomb.x, bomb.y);
                        a.merging = true;
                        b.merging = true;
                        continue;
                    }

                    const neitherBlocked = !a.isStone && !b.isStone && a.frozen === 0 && b.frozen === 0;
                    const canMerge = neitherBlocked && (a.tier === b.tier || a.isRainbow || b.isRainbow);

                    if (canMerge) {
                        a.merging = true;
                        b.merging = true;
                        if (mergeGhosts.length < 16) {
                            const mx0 = (a.x + b.x) / 2, my0 = (a.y + b.y) / 2;
                            [a, b].forEach(q => mergeGhosts.push({ x: q.x, y: q.y, tx: mx0, ty: my0, tier: q.tier, r: q.radius, rainbow: q.isRainbow, t: 0 }));
                        }
                        const hadChest = a.isChest || b.isChest;
                        const newTier = Math.max(a.tier, b.tier) + 1;
                        handleOrbMerge((a.x + b.x) / 2, (a.y + b.y) / 2, newTier, hadChest);
                        if (a.isGolden || b.isGolden) goldenJackpot((a.x + b.x) / 2, (a.y + b.y) / 2);
                        continue;
                    }

                    const nx = dx / dist;
                    const ny = dy / dist;
                    const overlap = minDist - dist;
                    const massA = a.radius * a.radius;
                    const massB = b.radius * b.radius;
                    const totalMass = massA + massB;

                    a.x -= nx * overlap * (massB / totalMass);
                    a.y -= ny * overlap * (massB / totalMass);
                    b.x += nx * overlap * (massA / totalMass);
                    b.y += ny * overlap * (massA / totalMass);

                    const rvx = b.vx - a.vx;
                    const rvy = b.vy - a.vy;
                    const velAlongNormal = rvx * nx + rvy * ny;

                    if (velAlongNormal < 0) {
                        const jImpulse = -(1 + 0.28) * velAlongNormal / (1 / massA + 1 / massB);
                        a.vx -= (jImpulse * nx) / massA;
                        a.vy -= (jImpulse * ny) / massA;
                        b.vx += (jImpulse * nx) / massB;
                        b.vy += (jImpulse * ny) / massB;
                    }
                }
            }
        }

        sanitizeOrbsArray();
    }

    orbs.forEach(o => {
        o.age += dt;
        o.unmergedTime += dt;
        o.breathPhase += dt * 3.5;
        if (o.bumperCooldown > 0) o.bumperCooldown -= dt;

        const speed = Math.hypot(o.vx, o.vy);
        if (speed > 150) {
            o.trail.push({ x: o.x, y: o.y, r: o.radius * 0.72 });
            if (o.trail.length > 4) o.trail.shift();
        } else if (o.trail.length > 0) {
            o.trail.shift();
        }

        // Пружина масштаба: мягкое «желе» без резких рывков
        const sdt = Math.min(dt, 0.033);
        o.svx = (o.svx || 0) + ((1 - o.scaleX) * 300 - (o.svx || 0) * 22) * sdt;
        o.svy = (o.svy || 0) + ((1 - o.scaleY) * 300 - (o.svy || 0) * 22) * sdt;
        o.scaleX += o.svx * sdt;
        o.scaleY += o.svy * sdt;

        if (o.exprTimer > 0) {
            o.exprTimer -= dt;
            if (o.exprTimer <= 0) o.expression = 'happy';
        }
        o.blinkTimer -= dt;
        if (o.blinkTimer <= 0) {
            o.isBlinking = !o.isBlinking;
            o.blinkTimer = o.isBlinking ? 0.14 : (2.0 + Math.random() * 3.5);
        }
        const targetLX = Math.max(-4, Math.min(4, (aimX - o.x) * 0.025));
        const targetLY = Math.max(-4, Math.min(4, (JAR.y - o.y) * 0.015));
        o.lookX += (targetLX - o.lookX) * 6 * dt;
        o.lookY += (targetLY - o.lookY) * 6 * dt;
    });
}

function detonateBombOrb(bx, by) {
    const t = I18N[currentLang];
    vibrateDevice(50);
    jarShakeY = 16;
    screenFlashAlpha = 0.4;
    shockRings.push({ x: bx, y: by, r: 15, maxR: 220, color: '#f43f5e' });

    shatterNearbyHazards(bx, by, 180, true);
    if (synActive('icebomb')) fireRivalMissile(bx, by, pctHp(0.025), '#bae6fd');

    orbs.forEach(o => {
        if (Math.hypot(o.x - bx, o.y - by) < 140 && o.tier < maxUnlockedTier) {
            o.merging = true;
            spawnParticles(o.x, o.y, '#fbbf24', 12);
            fireRivalMissile(o.x, o.y, 50, '#f43f5e');
        }
    });
    playJackpotFanfare();
    addFloatingScore(bx, by - 25, t.bombExplodedMsg, '#fbbf24', 16.5);
}

function handleOrbMerge(mx, my, newTier, hadChest = false) {
    const t = I18N[currentLang];
    const r = getOrbRadius(newTier);
    const pal = getOrbColors(newTier);
    const merged = createOrb(mx, my, newTier, false, true, false, false, false);
    merged.vy = -100;
    merged.expression = 'excited';
    merged.exprTimer = 1.8;
    orbs.push(merged);

    shatterNearbyHazards(mx, my, r * 3.5);

    orbs.forEach(other => {
        if (other.id === merged.id) return;
        const dx = other.x - mx;
        const dy = other.y - my;
        const d = Math.hypot(dx, dy);
        const blastRadius = r * 2.8;
        if (d > 1 && d < blastRadius) {
            const force = (1 - d / blastRadius) * (110 + Math.min(10, newTier) * 18);
            other.vx += (dx / d) * force;
            other.vy += (dy / d) * force - 45;
            other.scaleX = 1.18;
            other.scaleY = 0.82;
            other.unmergedTime = 0;
        }
    });

    vibrateDevice(15 + Math.min(10, newTier) * 3);
    jarShakeX = (Math.random() - 0.5) * 11;
    jarShakeY = 8;

    addShotEnergy(BALANCE.energyBase + BALANCE.energyPerTier * newTier);
    mergeFlashes.push({ x: mx, y: my, color: pal.color1, r, t: 0 });
    combo++;
    comboResetTimer = 2.5 + perkLvl('frenzy') * 0.8;
    mergeCount++;
    questEvent('merge', 1);
    questEvent('tier', newTier);
    questEvent('combo', combo);

    // Баннер комбо по центру экрана + звуковая «лесенка»
    if (combo >= 2) {
        const words = t.comboWords;
        comboBanner = {
            text: `${words[Math.min(words.length - 1, combo)]}  x${combo}`,
            t: 1.1,
            color: ['#fde047', '#4ade80', '#38bdf8', '#f472b6', '#f97316', '#c084fc'][combo % 6],
            combo
        };
        playComboSound(combo);
        if (combo >= 4) { screenFlashAlpha = Math.max(screenFlashAlpha, 0.12); burstRays.push({ x: mx, y: my, life: 0.7, color: comboBanner.color }); }
    }
    // Крупные слияния: короткое замедление времени и лучи
    if (newTier >= 6) {
        hitStopTimer = Math.max(hitStopTimer, 0.09 + Math.min(0.12, (newTier - 6) * 0.03));
        burstRays.push({ x: mx, y: my, life: 0.9, color: pal.color1 });
    }

    if (!tutorialDone && tutorialStep === 1) { tutorialStep = 2; tutorialHoldT = 0; }

    // Отбил атаку босса: собрал нужную сферу до конца таймера
    if (rival.tele && newTier >= rival.tele.needTier) counterSuccess();

    if (newTier > maxUnlockedTier) {
        maxUnlockedTier = newTier;
        stars += 10;
        fireFourCornerCannons();
        if (newTier >= 2) newHeroOverlay = { t: 3.2, tier: newTier };
    }
    if (newTier >= 12) {
        comboBanner = { text: L('✦ БОЖЕСТВЕННАЯ СФЕРА ✦', '✦ DIVINE ORB ✦'), t: 2.2, color: '#fde68a', combo: 6 };
        screenFlashAlpha = 0.5; playJackpotFanfare(); spawnConfettiShower(); vibrateDevice(120);
    }

    const hotMult = 1;

    // Заряд шкалы КЛУБНОГО КУРАЖА (FEVER MODE X2)
    if (feverActiveTimer <= 0) {
        feverMeter = Math.min(100, feverMeter + (4 + Math.min(6, newTier)) * (1 + perkLvl('fever') * 0.35));
        if (feverMeter >= 100) {
            feverMeter = 0;
            feverActiveTimer = 8.0 + perkLvl('fever') * 4;
            orbs.forEach(o => { o.frozen = 0; });
            playJackpotFanfare();
            fireFourCornerCannons();
            addFloatingScore(VW / 2, 215, t.feverStartMsg, '#fde047', 16.5);
        }
    }

    // В Неоновом Токио (Мир 5) комбо x3+ вызывает Удар Катаны по преградам!
    if ((themeIdx % WORLD_COUNT) === 4 && combo >= 3) {
        shatterNearbyHazards(VW / 2, JAR.y + JAR.h / 2, 260);
        addFloatingScore(mx, my - 34, t.gizmoKatanaMsg, '#f43f5e', 14.5, true);
    }

    // Шанс КРИТИЧЕСКОГО СЛИЯНИЯ Х3 при комбо!
    let critMult = 1;
    if (combo >= 3 && Math.random() < 0.10 + perkLvl('crit') * 0.08) {
        critMult = (synActive('crusher') && newTier >= 6) ? 3 : 2;
        shockRings.push({ x: mx, y: my, r: r * 0.4, maxR: r * 3.4, color: '#fde047' });
        addFloatingScore(mx, my - 36, t.critMergeMsg, '#fde047', 17.5);
    }

    const rawDmg = getCalibratedBossDamage(newTier);
    const comboMult = 1 + Math.min(0.6, (combo - 1) * 0.12);
    const upgMult = 1 + (Math.min(UPG_MAX.bossDmgLvl, metaUpgrades.bossDmgLvl) - 1) * 0.10;
    const heavyMult = newTier >= 6 ? 1 + perkLvl('heavy') * 0.25 : 1;
    const baseDmg = Math.ceil(rawDmg * BALANCE.mergeDmgMult * comboMult * upgMult * hotMult * critMult * heavyMult);
    fireRivalMissile(mx, my, baseDmg, critMult > 1 ? '#fde047' : pal.color1);
    // Перк «Эхо»: повтор удара
    if (perkLvl('echo') && mergeCount % perkDef('echo').n(perkLvl('echo')) === 0) fireRivalMissile(mx, my, baseDmg, '#c4b5fd');
    // Синергия «Грозовой кураж»
    if (synActive('storm') && feverActiveTimer > 0) fireRivalMissile(mx, my, pctHp(0.006), '#a5f3fc');
    // Перк «Цепная молния»
    if (perkLvl('bolt') && combo >= 4 && combo % 2 === 0) {
        fireRivalMissile(mx, my, pctHp(perkLvl('bolt') * 0.006), '#a5f3fc');
        laserLinkBeams.push({ ax: mx, ay: my, bx: 52, by: 88, color: '#a5f3fc', life: 0.5 });
    }

    if (newTier >= 7) {
        milestoneOverlay.timer = 1.15;
        milestoneOverlay.numStr = formatOrbNumber(newTier);
        milestoneOverlay.color = pal.color1;
        screenFlashAlpha = 0.28;
        floorLaserEffect = 0.75;
        fireFourCornerCannons();
    }

    addScoreAndCheckLeague(getOrbScore(newTier) * combo);

    if (newTier >= 7 || hadChest) {
        spawnSubtleStarburst(mx, my, hadChest ? 3 : 2);
    }

    playPopSound(newTier, combo);
    spawnParticles(mx, my, pal.color1, 12);
    shockRings.push({ x: mx, y: my, r: r * 0.5, maxR: r * 2.5, color: pal.glow });

    const labelTxt = combo > 1 ? `−${baseDmg}  ×${combo}` : `−${baseDmg}`;
    addFloatingScore(mx, my - 15, labelTxt, pal.light || '#ffffff', combo > 1 ? 17 : 14);
    saveGameState();
}

// ============================================================================
// 8. ГЛАВНЫЙ ЦИКЛ И СУПЕР-ЖИВАЯ ОТРИСОВКА ФИГУР (БЕЗ SHADOWBLUR!)
// ============================================================================
let lastFrame = performance.now();

function gameLoop(now) {
    requestAnimationFrame(gameLoop);
    let dt = (now - lastFrame) / 1000;
    lastFrame = now;
    if (dt > 0.05) dt = 0.05;
    const realDt = dt;

    // Хит-стоп: на крупных слияниях и нокауте время на миг замедляется
    if (hitStopTimer > 0) {
        hitStopTimer = Math.max(0, hitStopTimer - realDt);
        dt *= 0.2;
    }
    if (koTimer > 0) {
        koTimer = Math.max(0, koTimer - realDt);
        if (koTimer <= 0) {
            stageWinModalOpen = true;
            if (pendingEnding) { pendingEnding = false; endingModal.open = true; }
            victoryAnimT = 0;
            platformGameplayStop();
        }
    }
    if (stageWinModalOpen) {
        const before = victoryAnimT;
        victoryAnimT += realDt;
        for (let i = 0; i < victoryStars; i++) {
            const at = 0.35 + i * 0.35;
            if (before < at && victoryAnimT >= at) { playStarDing(i); vibrateDevice(25); spawnConfettiShower(); }
        }
    }
    if (fakeAd) {
        fakeAd.t -= realDt;
        if (fakeAd.t <= 0) { const ty = fakeAd.type; fakeAd = null; resumeAfterAd(); applyBoosterEffect(ty); }
    }
    if (comboBanner.t > 0) comboBanner.t = Math.max(0, comboBanner.t - realDt);
    if (newHeroOverlay.t > 0) newHeroOverlay.t = Math.max(0, newHeroOverlay.t - realDt);
    for (let i = bossDmgPops.length - 1; i >= 0; i--) {
        bossDmgPops[i].life -= realDt;
        bossDmgPops[i].y -= 30 * realDt;
        if (bossDmgPops[i].life <= 0) bossDmgPops.splice(i, 1);
    }
    for (let i = burstRays.length - 1; i >= 0; i--) {
        burstRays[i].life -= realDt;
        if (burstRays[i].life <= 0) burstRays.splice(i, 1);
    }
    if (!tutorialDone && !inStartMenu) {
        tutorialHoldT += realDt;
        if (tutorialStep === 2 && tutorialHoldT > 4.5) { tutorialDone = true; saveGameState(); }
    }

    beatPulse = Math.max(0, beatPulse - dt * 3.5);
    hudBounceScale += (1.0 - hudBounceScale) * 15 * dt;
    rival.hitScale += (1.0 - rival.hitScale) * 14 * dt;
    rival.shakeX *= 0.82;
    if (rival.flashTimer > 0) rival.flashTimer = Math.max(0, rival.flashTimer - dt);
    if (rival.beamTimer > 0) rival.beamTimer = Math.max(0, rival.beamTimer - dt);
    if (milestoneOverlay.timer > 0) milestoneOverlay.timer = Math.max(0, milestoneOverlay.timer - dt);
    if (screenFlashAlpha > 0) screenFlashAlpha = Math.max(0, screenFlashAlpha - dt * 1.5);
    if (floorLaserEffect > 0) floorLaserEffect = Math.max(0, floorLaserEffect - dt * 1.8);

    PINBALL_BUMPERS.forEach(b => { if (b.glowTimer > 0) b.glowTimer = Math.max(0, b.glowTimer - dt); });
    for (let i = 0; i < 16; i++) eqBars[i] = Math.max(0.1, eqBars[i] - dt * 0.9);

    if (!canDrop) {
        dropCooldown -= dt;
        if (dropCooldown <= 0) {
            dropCooldown = 0;
            canDrop = true;
        }
    }

    slotMachine.leverPull += (0 - slotMachine.leverPull) * 8 * dt;
    if (slotMachine.spinning) {
        slotMachine.spinTimer -= dt;
        if (Math.random() < 0.45) {
            slotMachine.reels = [
                SLOT_SYMBOLS[Math.floor(Math.random() * SLOT_SYMBOLS.length)],
                SLOT_SYMBOLS[Math.floor(Math.random() * SLOT_SYMBOLS.length)],
                SLOT_SYMBOLS[Math.floor(Math.random() * SLOT_SYMBOLS.length)]
            ];
        }
        if (slotMachine.spinTimer <= 0) finishSlotSpin();
    }

    updateShots(dt);
    for (let i = vaultMissiles.length - 1; i >= 0; i--) {
        const vm = vaultMissiles[i];
        vm.age += dt;
        const tx = 148;
        const ty = 88;
        const dx = tx - vm.x;
        const dy = ty - vm.y;
        const dist = Math.hypot(dx, dy);

        const pull = 16 + vm.age * 42;
        vm.vx += (dx * pull - vm.vx * 4) * dt;
        vm.vy += (dy * pull - vm.vy * 4) * dt;
        vm.x += vm.vx * dt;
        vm.y += vm.vy * dt;

        if (dist < 28 || vm.age > 1.1) {
            damageRival(vm.damage);
            vaultMissiles.splice(i, 1);
        }
    }

    const anyModal = inStartMenu || leaderboardModalOpen || dailyModalOpen || wheelModalOpen || empireModalOpen || stageWinModalOpen || upgModalOpen || pickerModalOpen || isGameOver || adConfirm.open || adPlaying || koTimer > 0 || chestModal.open || collectionModalOpen || perkModal.open || runEndModal.open || questsModalOpen || endingModal.open;
    if (perkModal.open) perkModal.t += realDt;
    if (chestModal.open) {
        chestModal.t += realDt;
        if (chestModal.phase === 1 && chestModal.t > 0.75) {
            chestModal.phase = 2; chestModal.t = 0;
            spawnConfettiShower(); fireFourCornerCannons(); playVictoryFanfare(); vibrateDevice(80);
            burstRays.push({ x: VW / 2, y: 330, life: 1.6, color: ['#fde047', '#38bdf8', '#e879f9'][chestModal.rarity] });
        }
    }

    if (wheelModalOpen) {
        updateWheelPhysics(dt);
    } else if (!anyModal) {
        if (feverActiveTimer > 0) {
            feverActiveTimer = Math.max(0, feverActiveTimer - dt);
        }
        levelTimer += dt;
        if (lavaTimer > 0) lavaTimer = Math.max(0, lavaTimer - dt);
        if (giftTimer > 0) giftTimer = Math.max(0, giftTimer - dt);
        if (levelIntroT > 0) levelIntroT = Math.max(0, levelIntroT - dt);
        if (rival.stunTimer > 0) rival.stunTimer = Math.max(0, rival.stunTimer - dt);
        tickBossDots(dt);
        if (rival.layerFlash > 0) rival.layerFlash = Math.max(0, rival.layerFlash - dt * 1.5);
        if (rival.armorFlash > 0) rival.armorFlash = Math.max(0, rival.armorFlash - dt);
        if (perkLvl('turret')) {
            perkTurretT -= dt;
            if (perkTurretT <= 0) {
                perkTurretT = 3;
                fireRivalMissile(JAR.x + JAR.w - 20, JAR.y, pctHp(perkLvl('turret') * 0.0025), '#4ade80');
            }
        }
        if (rival.tele) {
            rival.tele.t -= dt;
            if (rival.tele.t <= 0) { const mv = rival.tele.move; rival.tele = null; triggerSignatureMove(mv); }
        }
        if (rival.type === 'timer' && levelIntroT <= 0) {
            rival.timeLeft -= dt;
            if (rival.timeLeft <= 0) { rival.timeLeft = 0; endRun('time'); }
        }
        if (rival.type === 'drops' && rival.dropsLeft <= 0) {
            outOfDropsT += dt;
            if (outOfDropsT > 3) endRun('drops');
        } else {
            outOfDropsT = 0;
        }

        // Уникальная свистоплюшка локации внутри стакана каждые 7 секунд
        worldGizmoTimer -= dt;
        if (worldGizmoTimer <= 0) {
            worldGizmoTimer = 7.0;
            const wMode = themeIdx % WORLD_COUNT;
            const gx = VW / 2;
            const gy = JAR.y + 215;
            if (wMode === 0 && orbs.length > 0) {
                // Кибер-портал в центре стакана бьет молнией Босса от ближайшей сферы
                fireRivalMissile(gx, gy, 60 + currentLevel * 10, '#38bdf8');
                shockRings.push({ x: gx, y: gy, r: 8, maxR: 65, color: '#38bdf8' });
            } else if (wMode === 2 && orbs.length >= 2) {
                // Грави-пульсар Сатурна мягко стягивает одинаковые фигуры к центру
                orbs.forEach(o => {
                    o.vx += (gx - o.x) * 0.9;
                    o.vy -= 65;
                });
                shockRings.push({ x: gx, y: gy, r: 60, maxR: 65, color: '#c084fc' });
            } else if (wMode === 3 && orbs.length > 0) {
                // Гейзер Атлантиды со дна стакана подбрасывает шары и смывает лед!
                orbs.forEach(o => {
                    if (o.y > JAR.y + JAR.h - 140) {
                        o.vy = -260;
                        if (o.frozen > 0) o.frozen = Math.max(0, o.frozen - 1);
                    }
                });
                spawnParticles(VW / 2, JAR.y + JAR.h - 20, '#2dd4bf', 10);
            }
        }

        if (!rival.tele && rival.stunTimer <= 0 && (tutorialDone || currentLevel > 1)) {
            rival.trickTimer -= dt * (rival.enraged ? 1.35 : 1.0);
        }
        if (rival.trickTimer <= 0) {
            rival.trickTimer = rival.trickInterval;
            triggerRivalTrick();
        }

        if (metaUpgrades.turretLvl > 1) {
            autoTurretTimer -= dt;
            if (autoTurretTimer <= 0) {
                autoTurretTimer = 1.5;
                fireRivalMissile(JAR.x + 20, JAR.y, (metaUpgrades.turretLvl - 1) * 35, '#4ade80');
            }
        }

        if (comboResetTimer > 0) {
            comboResetTimer -= dt;
            if (comboResetTimer <= 0) combo = 0;
        }

        if (flyingDrone.active) {
            flyingDrone.phase += dt * 5;
            flyingDrone.x += flyingDrone.vx * dt;
            flyingDrone.y = 182 + Math.sin(flyingDrone.phase) * 12;
            if (flyingDrone.x > VW + 70) {
                flyingDrone.active = false;
                flyingDrone.timer = 70 + Math.random() * 40;
            }
        } else {
            flyingDrone.timer -= dt;
            if (flyingDrone.timer <= 0) {
                flyingDrone.active = true;
                flyingDrone.x = -50;
                flyingDrone.y = 182;
            }
        }

        stepPhysics(dt, now);

        const dY = getDangerY();
        const overflowing = orbs.some(o => o.age > 1.2 && !o.merging && (o.y - o.radius) < dY);
        if (overflowing) {
            dangerTimer += dt;
            if (dangerTimer >= BALANCE.dangerSeconds + metaUpgrades.wallLvl * 0.3 + perkLvl('guard') + (synActive('harbor') ? 1.5 : 0)) endRun('overflow');
        } else {
            dangerTimer = Math.max(0, dangerTimer - dt * 2);
        }
        // Насколько высоко куча (0 — дно, 1 — линия смерти): для звёзд и красной виньетки
        let topY = JAR.y + JAR.h;
        orbs.forEach(o => { if (o.age > 1.2 && !o.isStone) topY = Math.min(topY, o.y - o.radius); });
        const fill = Math.max(0, Math.min(1, (JAR.y + JAR.h - topY) / (JAR.y + JAR.h - dY)));
        peakDanger = Math.max(peakDanger, fill);
        dangerVignette += ((fill > 0.72 ? (fill - 0.72) / 0.28 : 0) - dangerVignette) * 4 * dt;
    }

    for (let i = flyingStars.length - 1; i >= 0; i--) {
        const fs = flyingStars[i];
        if (fs.delay > 0) { fs.delay -= dt; continue; }
        fs.age += dt;
        fs.rot += dt * 10;
        const targetX = 128;
        const targetY = 25;
        const dx = targetX - fs.x;
        const dy = targetY - fs.y;
        const dist = Math.hypot(dx, dy);

        const pull = 14 + fs.age * 36;
        fs.vx += (dx * pull - fs.vx * 4) * dt;
        fs.vy += (dy * pull - fs.vy * 4) * dt;
        fs.x += fs.vx * dt;
        fs.y += fs.vy * dt;

        if (dist < 24 || fs.age > 1.2) {
            stars += 1;
            hudBounceScale = 1.12;
            playCoinClink();
            flyingStars.splice(i, 1);
        }
    }

    for (let i = wallRipples.length - 1; i >= 0; i--) {
        wallRipples[i].life -= dt;
        if (wallRipples[i].life <= 0) wallRipples.splice(i, 1);
    }
    for (let i = cornerStreamers.length - 1; i >= 0; i--) {
        const cs = cornerStreamers[i];
        cs.vy += 260 * dt;
        cs.x += cs.vx * dt;
        cs.y += cs.vy * dt;
        cs.life -= dt;
        if (cs.life <= 0) cornerStreamers.splice(i, 1);
    }
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.vy += 520 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = confetti.length - 1; i >= 0; i--) {
        const c = confetti[i];
        c.vy += 420 * dt;
        c.x += c.vx * dt;
        c.y += c.vy * dt;
        c.rot += c.vRot * dt;
        c.life -= dt;
        if (c.life <= 0) confetti.splice(i, 1);
    }
    for (let i = shockRings.length - 1; i >= 0; i--) {
        const s = shockRings[i];
        s.r += 260 * dt;
        if (s.r >= s.maxR) shockRings.splice(i, 1);
    }
    for (let i = laserLinkBeams.length - 1; i >= 0; i--) {
        laserLinkBeams[i].life -= dt;
        if (laserLinkBeams[i].life <= 0) laserLinkBeams.splice(i, 1);
    }
    for (let i = floatingLabels.length - 1; i >= 0; i--) {
        const fl = floatingLabels[i];
        fl.y -= 48 * dt;
        fl.life -= dt;
        if (fl.life <= 0) floatingLabels.splice(i, 1);
    }

    jarShakeX *= 0.85;
    jarShakeY *= 0.85;

    renderScene(dt, now);
}

function traceWorldShapePath(ctx, r, worldType) {
    ctx.beginPath();
    if (worldType === 0) {
        // МИР 1 (Киберпанк): Идеальная неоновая Кибер-Сфера
        ctx.arc(0, 0, r, 0, Math.PI * 2);
    } else if (worldType === 1) {
        // МИР 2 (Вегас): Скругленный кубик (подогнан под круглую физику)
        const side = r * 1.62;
        ctx.roundRect(-side / 2, -side / 2, side, side, r * 0.46);
    } else if (worldType === 2) {
        // МИР 3 (Сатурн): Планета (кольцо рисуется отдельно)
        ctx.arc(0, 0, r * 0.94, 0, Math.PI * 2);
    } else if (worldType === 6) {
        // МИР 7 (Северное сияние): Ледяной кристалл-ромб со скруглениями
        const pts = [{ x: 0, y: -r * 1.08 }, { x: r * 0.98, y: 0 }, { x: 0, y: r * 1.08 }, { x: -r * 0.98, y: 0 }];
        ctx.moveTo((pts[0].x + pts[3].x) / 2, (pts[0].y + pts[3].y) / 2);
        for (let i = 0; i < 4; i++) {
            const next = pts[(i + 1) % 4];
            ctx.arcTo(pts[i].x, pts[i].y, next.x, next.y, r * 0.3);
        }
        ctx.closePath();
    } else if (worldType === 7) {
        // МИР 8 (Конфеты): Мармеладный цветок с 8 лепестками
        const petals = 8;
        for (let i = 0; i <= 64; i++) {
            const a = (i / 64) * Math.PI * 2;
            const rr = r * (0.93 + 0.08 * Math.cos(a * petals));
            const px = Math.cos(a) * rr;
            const py = Math.sin(a) * rr;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
    } else if (worldType === 3) {
        // МИР 4 (Атлантида): 5-гранный Аква-Кристалл (Пентагон)
        const pr = r * 1.06;
        const pts = [];
        for (let i = 0; i < 5; i++) {
            const a = -Math.PI / 2 + (i * Math.PI * 2) / 5;
            pts.push({ x: Math.cos(a) * pr, y: Math.sin(a) * pr });
        }
        ctx.moveTo((pts[0].x + pts[4].x) / 2, (pts[0].y + pts[4].y) / 2);
        for (let i = 0; i < 5; i++) {
            const next = pts[(i + 1) % 5];
            ctx.arcTo(pts[i].x, pts[i].y, next.x, next.y, r * 0.24);
        }
        ctx.closePath();
    } else if (worldType === 4) {
        // МИР 5 (Токио): 6-гранная Неоновая Сота (Гексагон)
        for (let i = 0; i < 6; i++) {
            const a = (i * Math.PI) / 3;
            const px = Math.cos(a) * (r * 1.04);
            const py = Math.sin(a) * (r * 1.04);
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
    } else {
        // МИР 6 (Вулкан Императора): 8-гранный Императорский Бриллиант (Октагон)
        for (let i = 0; i < 8; i++) {
            const a = (i * Math.PI) / 4 + Math.PI / 8;
            const px = Math.cos(a) * (r * 1.04);
            const py = Math.sin(a) * (r * 1.04);
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
    }
}

// 11 УНИКАЛЬНЫХ ЭФФЕКТОВ СВЕЧЕНИЯ И ГОРЕНИЯ ДЛЯ КАЖДОГО ЦВЕТА!
function drawUniqueTierAura(ctx, r, tier, pal, now, isHotTarget) {
    const colorIdx = Math.abs(tier) % 11;
    const tSec = now * 0.003;

    ctx.save();
    // Базовое мягкое свечение цвета
    ctx.fillStyle = isHotTarget ? '#fde047' : pal.color1;
    ctx.globalAlpha = isHotTarget ? 0.28 : 0.16;
    ctx.beginPath();
    ctx.arc(0, 0, r + 4.5 + Math.sin(tSec * 2) * 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.85;

    if (colorIdx === 0) {
        // 2 (Голубой): Бегущие по контуру электрические дуги
        ctx.strokeStyle = '#7dd3fc';
        ctx.lineWidth = 1.6;
        for (let k = 0; k < 3; k++) {
            const a = tSec * 2.5 + k * 2.1;
            ctx.beginPath();
            ctx.arc(0, 0, r + 3, a, a + 0.55);
            ctx.stroke();
        }
    } else if (colorIdx === 1) {
        // 4 (Изумрудный): Всплывающие неоновые био-пузырьки
        ctx.fillStyle = '#86efac';
        for (let k = 0; k < 4; k++) {
            const a = tSec * 1.6 + k * 1.57;
            const dist = r + 3 + Math.sin(tSec * 3 + k) * 2.5;
            ctx.beginPath();
            ctx.arc(Math.cos(a) * dist, Math.sin(a) * dist, 2.3, 0, Math.PI * 2);
            ctx.fill();
        }
    } else if (colorIdx === 2) {
        // 8 (Желтый): Пульсирующая солнечная корона из 8 лучей
        ctx.strokeStyle = '#fef08a';
        ctx.lineWidth = 2;
        for (let k = 0; k < 8; k++) {
            const a = tSec + (k * Math.PI) / 4;
            const len = r + 3 + ((k % 2 === 0) ? 4 : 2);
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * (r + 1), Math.sin(a) * (r + 1));
            ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len);
            ctx.stroke();
        }
    } else if (colorIdx === 3) {
        // 16 (Оранжевый): Живые языки пламени вокруг фигуры
        ctx.fillStyle = '#fb923c';
        for (let k = 0; k < 6; k++) {
            const a = -tSec * 2.2 + (k * Math.PI) / 3;
            const flameR = r + 4 + Math.sin(tSec * 5 + k) * 2.5;
            ctx.beginPath();
            ctx.arc(Math.cos(a) * flameR, Math.sin(a) * flameR, 3.2, 0, Math.PI * 2);
            ctx.fill();
        }
    } else if (colorIdx === 4) {
        // 32 (Рубиновый): Расходящийся неоновый пульс-сердцебиение
        const pulseR = r + 2 + ((now * 0.015) % 8);
        ctx.strokeStyle = '#fda4af';
        ctx.lineWidth = 2;
        ctx.globalAlpha = 1 - (((now * 0.015) % 8) / 8);
        ctx.beginPath();
        ctx.arc(0, 0, pulseR, 0, Math.PI * 2);
        ctx.stroke();
    } else if (colorIdx === 5) {
        // 64 (Фиолетовый): Вращающийся гравитационный вихрь
        ctx.strokeStyle = '#d8b4fe';
        ctx.lineWidth = 2.2;
        ctx.setLineDash([7, 5]);
        ctx.rotate(-tSec * 2);
        ctx.beginPath();
        ctx.arc(0, 0, r + 5, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
    } else if (colorIdx === 6) {
        // 128 (Бирюзовый): Сверкающие кристаллы льда на орбите
        ctx.fillStyle = '#99f6e4';
        for (let k = 0; k < 4; k++) {
            const a = tSec * 2 + (k * Math.PI) / 2;
            const cx = Math.cos(a) * (r + 5);
            const cy = Math.sin(a) * (r + 5);
            ctx.fillRect(cx - 2.5, cy - 2.5, 5, 5);
        }
    } else if (colorIdx === 7) {
        // 256 (Синий): Двойной плазменный радар-щит
        ctx.strokeStyle = '#93c5fd';
        ctx.lineWidth = 2.4;
        ctx.rotate(tSec * 2.6);
        ctx.beginPath(); ctx.arc(0, 0, r + 5, 0, Math.PI * 0.7); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, r + 5, Math.PI, Math.PI * 1.7); ctx.stroke();
    } else if (colorIdx === 8) {
        // 512 (Пурпурный): Звездные 4-конечные вспышки
        ctx.strokeStyle = '#f9a8d4';
        ctx.lineWidth = 2;
        for (let k = 0; k < 4; k++) {
            const a = -tSec * 1.5 + (k * Math.PI) / 2;
            const sx = Math.cos(a) * (r + 5);
            const sy = Math.sin(a) * (r + 5);
            ctx.beginPath();
            ctx.moveTo(sx - 4, sy); ctx.lineTo(sx + 4, sy);
            ctx.moveTo(sx, sy - 4); ctx.lineTo(sx, sy + 4);
            ctx.stroke();
        }
    } else if (colorIdx === 9) {
        // 1024 (Золотой): Королевский золотой нимб со спутниками
        ctx.strokeStyle = '#fde047';
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(0, 0, r + 5.5, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = '#ffffff';
        for (let k = 0; k < 3; k++) {
            const a = tSec * 3 + (k * Math.PI * 2) / 3;
            ctx.beginPath();
            ctx.arc(Math.cos(a) * (r + 5.5), Math.sin(a) * (r + 5.5), 3.2, 0, Math.PI * 2);
            ctx.fill();
        }
    } else {
        // 2048+ (Сверхновая): Радужная корона сверхновой!
        const hue = (now * 0.25) % 360;
        ctx.strokeStyle = `hsl(${hue}, 95%, 65%)`;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, r + 6, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
}

// ============================================================================
// СУПЕР-ЖИВЫЕ 3D-ШАРИКИ И ФИГУРКИ (6 Форм Миров + 11 Эффектов Свечения!)
// ============================================================================
// Кристальный стиль: лица выключены по умолчанию (включаются в меню или вместе с аксессуаром)
let facesOn = false;
const glowCache = {};
function hexToRgb(h) {
    if (typeof h !== 'string' || h[0] !== '#') return [255, 255, 255];
    let x = h.slice(1);
    if (x.length === 3) x = x[0] + x[0] + x[1] + x[1] + x[2] + x[2];
    const v = parseInt(x.slice(0, 6), 16);
    if (!Number.isFinite(v)) return [255, 255, 255];
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}
// Готовая «капля света» для свечения: рисуется один раз и переиспользуется
function getGlowSprite(color) {
    if (glowCache[color]) return glowCache[color];
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const g = c.getContext('2d');
    const [rr, gg, bb] = hexToRgb(color);
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, `rgba(${rr},${gg},${bb},0.75)`);
    gr.addColorStop(0.18, `rgba(${rr},${gg},${bb},0.5)`);
    gr.addColorStop(0.42, `rgba(${rr},${gg},${bb},0.17)`);
    gr.addColorStop(0.7, `rgba(${rr},${gg},${bb},0.04)`);
    gr.addColorStop(1, `rgba(${rr},${gg},${bb},0)`);
    g.fillStyle = gr;
    g.fillRect(0, 0, 128, 128);
    glowCache[color] = c;
    return c;
}

            c.fillStyle = rgbaHex(ACC, 0.6 + beatPulse * 0.4);
            c.fillRect(sd * 17 - (sd > 0 ? 3.5 : -2.3), -4, 1.2, 8);
        });
    } else if (mode === 2) {
        // Киборг: задняя половина кольца
        c.save(); c.rotate(-0.3);
        c.strokeStyle = rgbaHex(ACC, 0.5); c.lineWidth = 1.6;
        c.beginPath(); c.ellipse(0, 2, 27, 6.5, 0, Math.PI, Math.PI * 2); c.stroke();
        c.restore();
    } else if (mode === 3) {
        // Атлантида: плавники
        [-1, 1].forEach(sd => {
            c.fillStyle = bossMetal(c, -10, 10);
            c.beginPath(); c.moveTo(sd * 12, -8); c.quadraticCurveTo(sd * 26, -16, sd * 22, -2); c.quadraticCurveTo(sd * 24, 6, sd * 12, 8); c.closePath(); c.fill();
            c.strokeStyle = rgbaHex(ACC, 0.8); c.lineWidth = 0.8; c.stroke();
            c.beginPath(); c.moveTo(sd * 14, -4); c.lineTo(sd * 21, -9); c.moveTo(sd * 14, 1); c.lineTo(sd * 21, 0); c.stroke();
        });
    } else if (mode === 5) {
        // Вулкан: закрученные рога
        [-1, 1].forEach(sd => {
            const hg = c.createLinearGradient(sd * 8, -10, sd * 24, -28);
            hg.addColorStop(0, '#1f2533'); hg.addColorStop(1, '#94a3b8');
            c.fillStyle = hg;
            c.beginPath(); c.moveTo(sd * 7, -12); c.quadraticCurveTo(sd * 24, -14, sd * 23, -27); c.quadraticCurveTo(sd * 18, -19, sd * 11, -9); c.closePath(); c.fill();
        });
    }

    // --- Маска ---
    const W = mode === 2 ? 14.5 : 13, H = mode === 2 ? 16 : 17, CH = mode === 4 ? 0.95 : mode === 2 ? 0.75 : 0.88;
    bossFacePath(c, W, H, CH);
    c.fillStyle = bossMetal(c, -H, H);
    c.fill();
    c.strokeStyle = rgbaHex(ACC, 0.75); c.lineWidth = 0.9;
    c.stroke();
    // Скульптурный рельеф: центральное ребро и скулы
    c.strokeStyle = 'rgba(255, 255, 255, 0.12)'; c.lineWidth = 0.8;
    c.beginPath(); c.moveTo(0, -H + 2); c.lineTo(0, H - 3);
    c.moveTo(-W + 3, 4); c.quadraticCurveTo(-5, 7, -2, 12); c.moveTo(W - 3, 4); c.quadraticCurveTo(5, 7, 2, 12);
    c.stroke();
    // Блик сверху
    const sh = c.createRadialGradient(-4, -12, 0, -4, -12, 10);
    sh.addColorStop(0, 'rgba(255,255,255,0.28)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = sh;
    c.beginPath(); c.ellipse(-4, -11, 8, 5, -0.3, 0, Math.PI * 2); c.fill();

    // --- Орнамент НА маске ---
    if (mode === 4 && !rival.isFinal) {
        // Токио: алые полосы на щеках и маленькие рога
        c.strokeStyle = ACC; c.lineWidth = 1.1;
        [-1, 1].forEach(sd => {
            c.beginPath(); c.moveTo(sd * 5, 3); c.lineTo(sd * 11, 1); c.moveTo(sd * 5, 6); c.lineTo(sd * 10, 5); c.stroke();
            c.fillStyle = '#e2e8f0';
            c.beginPath(); c.moveTo(sd * 5, -15); c.quadraticCurveTo(sd * 9, -22, sd * 12, -25); c.quadraticCurveTo(sd * 9, -18, sd * 9, -13); c.closePath(); c.fill();
        });
    } else if (mode === 5) {
        // Вулкан: светящиеся трещины лавы
        c.save(); c.globalCompositeOperation = 'lighter';
        c.strokeStyle = rgbaHex(ACC, 0.7 + Math.sin(now * 0.006) * 0.25); c.lineWidth = 1;
        c.beginPath(); c.moveTo(-9, -10); c.lineTo(-5, -5); c.lineTo(-7, 1); c.moveTo(8, 6); c.lineTo(4, 10); c.lineTo(5, 14); c.moveTo(3, -14); c.lineTo(5, -9); c.stroke();
        c.restore();
    } else if (mode === 6) {
        // Северное сияние: ледяные узоры
        c.strokeStyle = rgbaHex(ACC, 0.55); c.lineWidth = 0.7;
        c.beginPath();
        [-1, 1].forEach(sd => { c.moveTo(sd * 3, 9); c.lineTo(sd * 8, 13); c.moveTo(sd * 5.5, 11); c.lineTo(sd * 5, 14); c.moveTo(sd * 6, 11); c.lineTo(sd * 9, 10); });
        c.stroke();
    } else if (mode === 7) {
        // Арлекин: ромбы на одной половине
        c.save();
        bossFacePath(c, W, H, CH); c.clip();
        c.fillStyle = rgbaHex(ACC, 0.22);
        for (let yy = -16; yy < 18; yy += 8) for (let xx = 0; xx < 16; xx += 8) {
            const ox = ((yy + 16) / 8) % 2 ? 4 : 0;
            c.beginPath(); c.moveTo(xx + ox, yy - 4); c.lineTo(xx + ox + 4, yy); c.lineTo(xx + ox, yy + 4); c.lineTo(xx + ox - 4, yy); c.closePath(); c.fill();
        }
        c.restore();
    } else if (mode === 3) {
        // Атлантида: трезубец на лбу
        c.strokeStyle = rgbaHex(ACC, 0.9); c.lineWidth = 0.9;
        c.beginPath(); c.moveTo(0, -6); c.lineTo(0, -14); c.moveTo(-3, -13); c.lineTo(-3, -10); c.quadraticCurveTo(0, -8, 3, -10); c.lineTo(3, -13); c.stroke();
    } else if (mode === 1 && !rival.isFinal) {
        // Вегас: камень на лбу
        c.fillStyle = '#ef4444';
        c.beginPath(); c.moveTo(0, -14); c.lineTo(2.5, -11); c.lineTo(0, -8); c.lineTo(-2.5, -11); c.closePath(); c.fill();
    }

    // --- Глаза ---
    const eyeA = stun ? 0.2 + Math.abs(Math.sin(now * 0.03)) * 0.25 : 1;
    if (mode === 0 && !rival.isFinal) {
        // Визор с эквалайзером
        c.fillStyle = '#020306';
        c.beginPath(); c.roundRect(-11, -7, 22, 7.5, 3); c.fill();
        c.save(); c.globalAlpha = eyeA;
        for (let b = 0; b < 6; b++) {
            const bh = 1.5 + ((Math.floor(now / 90) + b * 3) % 5) * (0.8 + beatPulse * 0.6);
            c.fillStyle = b % 2 ? eyeCol : (rage ? '#fca5a5' : '#f472b6');
            c.fillRect(-9 + b * 3.4, -1 - bh, 2, bh);
        }
        c.globalCompositeOperation = 'lighter'; c.globalAlpha = 0.5 * eyeA;
        c.drawImage(getGlowSprite(eyeCol), -16, -14, 32, 20);
        c.restore();
    } else {
        c.save();
        c.globalAlpha = eyeA;
        c.globalCompositeOperation = 'lighter';
        c.globalAlpha = 0.6 * eyeA * (tele ? 1.3 : 1);
        [-1, 1].forEach(sd => c.drawImage(getGlowSprite(eyeCol), sd * 6.5 - 8, -12, 16, 14));
        c.globalCompositeOperation = 'source-over';
        c.globalAlpha = eyeA;
        c.fillStyle = eyeCol;
        [-1, 1].forEach(sd => {
            c.beginPath();
            if (mode === 2) { c.arc(sd * 5.5, -4, 2.4, 0, Math.PI * 2); }
            else {
                c.moveTo(sd * 2, -3); c.quadraticCurveTo(sd * 6, -7.5 - (rage ? 1.5 : 0), sd * 11, -5.5);
                c.quadraticCurveTo(sd * 7, -1.5, sd * 2, -3);
            }
            c.fill();
        });
        c.fillStyle = '#ffffff';
        c.globalAlpha = eyeA * 0.85;
        [-1, 1].forEach(sd => { c.beginPath(); c.arc(sd * (mode === 2 ? 5.5 : 6), -4.5, 0.8, 0, Math.PI * 2); c.fill(); });
        c.restore();
    }

    // --- Орнамент ПОВЕРХ маски ---
    if (mode === 1 || rival.isFinal) {
        // Корона (у Императора — больше)
        const big = rival.isFinal ? 1.35 : 1;
        c.save(); c.scale(big, big);
        const cg = c.createLinearGradient(0, -28, 0, -14);
        cg.addColorStop(0, '#fef3c7'); cg.addColorStop(0.5, '#f59e0b'); cg.addColorStop(1, '#78350f');
        c.fillStyle = cg;
        c.beginPath();
        c.moveTo(-10, -14); c.lineTo(-12, -23); c.lineTo(-6, -18); c.lineTo(0, -27); c.lineTo(6, -18); c.lineTo(12, -23); c.lineTo(10, -14); c.closePath();
        c.fill();
        c.strokeStyle = 'rgba(255,255,255,0.4)'; c.lineWidth = 0.6; c.stroke();
        c.fillStyle = rival.isFinal ? '#ef4444' : '#22d3ee';
        c.beginPath(); c.arc(0, -19, 1.6, 0, Math.PI * 2); c.fill();
        c.restore();
    } else if (mode === 2) {
        c.save(); c.rotate(-0.3);
        c.strokeStyle = ACC; c.lineWidth = 1.6;
        c.beginPath(); c.ellipse(0, 2, 27, 6.5, 0, 0, Math.PI); c.stroke();
        c.restore();
        c.strokeStyle = '#94a3b8'; c.lineWidth = 1;
        c.beginPath(); c.moveTo(6, -15); c.lineTo(10, -24); c.stroke();
        c.save(); c.globalCompositeOperation = 'lighter';
        c.drawImage(getGlowSprite(ACC), 4, -30, 12, 12);
        c.restore();
    } else if (mode === 6) {
        // Ледяная корона
        c.fillStyle = 'rgba(224, 242, 254, 0.85)';
        [[-8, -14, -10, -22], [-4, -16, -4, -26], [0, -17, 0, -29], [4, -16, 4, -26], [8, -14, 10, -22]].forEach(([x0, y0, x1, y1]) => {
            c.beginPath(); c.moveTo(x0 - 1.8, y0); c.lineTo(x1, y1); c.lineTo(x0 + 1.8, y0); c.closePath(); c.fill();
        });
    } else if (mode === 7) {
        // Колпак шута
        [-1, 1].forEach(sd => {
            c.fillStyle = sd < 0 ? '#1f2533' : rgbaHex(ACC, 0.9);
            c.beginPath(); c.moveTo(sd * 3, -16); c.quadraticCurveTo(sd * 14, -26, sd * 19, -17); c.quadraticCurveTo(sd * 12, -20, sd * 9, -13); c.closePath(); c.fill();
            c.fillStyle = '#fde68a';
            c.beginPath(); c.arc(sd * 19, -16, 1.8, 0, Math.PI * 2); c.fill();
        });
    }
    // Ярость: багровые трещины
    if (rage) {
        c.save(); c.globalCompositeOperation = 'lighter';
        c.strokeStyle = `rgba(239, 68, 68, ${0.6 + Math.sin(now * 0.02) * 0.3})`; c.lineWidth = 0.9;
        c.beginPath(); c.moveTo(-6, -15); c.lineTo(-3, -9); c.lineTo(-6, -6); c.moveTo(7, 8); c.lineTo(3, 12); c.lineTo(4, 16); c.stroke();
        c.restore();
    }
    // Оглушение: искры по орбите
    if (stun) {
        c.save(); c.globalCompositeOperation = 'lighter';
        for (let k = 0; k < 3; k++) {
            const a = now * 0.006 + k * 2.09;
            c.drawImage(getGlowSprite('#fde68a'), Math.cos(a) * 15 - 4, -22 + Math.sin(a) * 4 - 4, 8, 8);
        }
        c.restore();
    }
}

// ПРОКАЧАННЫЕ АНИМИРОВАННЫЕ БОССЫ С ЭМОЦИЯМИ, АТРИБУТАМИ И АУРОЙ ЯРОСТИ!

function drawRivalBossPanel(t, now) {
    const mode = themeIdx % WORLD_COUNT;
    ctx.save();
    const bounceY = Math.sin(now * 0.005) * 2.5;
    ctx.translate(148 + rival.shakeX, 85 + bounceY);
    ctx.scale(rival.hitScale, rival.hitScale);
    ctx.translate(-148, -85);

    const isFlashing = rival.flashTimer > 0;
    drawRoundedPanel(14, 48, 274, 72, 16,
        isFlashing ? 'rgba(59, 130, 246, 0.85)' : 'rgba(15, 23, 42, 0.94)',
        rival.shieldActive ? '#38bdf8' : (isFlashing ? '#fef08a' : '#f43f5e'));

    const rx = 52;
    const ry = 88;
    ctx.save();
    // Замах перед атакой: босс дрожит и светится красным
    const teleShake = rival.tele ? Math.sin(now * 0.06) * (2 + (1 - rival.tele.t / rival.tele.total) * 3) : 0;
    ctx.translate(rx + teleShake, ry);
    if (rival.tele && facesOn) {
        ctx.fillStyle = `rgba(239, 68, 68, ${0.35 + Math.sin(now * 0.02) * 0.2})`;
        ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI * 2); ctx.fill();
    }
    ctx.scale(1.45, 1.45);
    drawBossMask(ctx, mode, now, isFlashing);

    // Оглушён: глаза-крестики и звёздочки над головой (мультяшный режим)
    if (rival.stunTimer > 0 && facesOn) {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.2;
        [-7, 7].forEach(ex => {
            ctx.beginPath();
            ctx.moveTo(ex - 3.5, -6.5); ctx.lineTo(ex + 3.5, 0.5);
            ctx.moveTo(ex + 3.5, -6.5); ctx.lineTo(ex - 3.5, 0.5);
            ctx.stroke();
        });
        ctx.font = '9px ' + UIF;
        ctx.textAlign = 'center';
        for (let k = 0; k < 3; k++) {
            const a = now * 0.006 + k * 2.09;
            ctx.fillText('⭐', Math.cos(a) * 16, -24 + Math.sin(a) * 5);
        }
    }

    if (rival.shieldActive) {
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        ctx.setLineDash([5, 4]);
        ctx.beginPath();
        ctx.arc(0, 0, 24, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
    }
    ctx.restore();

    const rName = rival.isFinal ? L('👑 ИМПЕРАТОР НОЧИ', '👑 NIGHT EMPEROR') : t.rivalNames[mode].split(' (')[0];
    ctx.fillStyle = '#fef08a';
    ctx.font = '900 12.5px ' + UIF;
    ctx.textAlign = 'left';
    ctx.fillText(`${t.lvlShort}${currentLevel} · ${rName}`, 98, 66);

    const hotStr = formatOrbNumber(rival.hotOrderTier);
    ctx.fillStyle = rival.shieldActive ? '#38bdf8' : '#4ade80';
    ctx.font = '900 11px ' + UIF;
    ctx.fillText(
        rival.shieldActive ? L('ЩИТ: бей выстрелом', 'SHIELD: shoot it') : L(`Заказ ×3: ${hotStr}`, `Order ×3: ${hotStr}`),
        98, 83
    );

    const hpRatio = Math.max(0, Math.min(1, rival.hp / rival.maxHp));
    ctx.fillStyle = '#090d16';
    ctx.beginPath();
    ctx.roundRect(98, 90, 160, 20, 8);
    ctx.fill();

    // Несколько полосок HP подряд: под текущей видна следующая
    const LAYER_COL = [['#fca5a5', '#dc2626', '#7f1d1d'], ['#fdba74', '#ea580c', '#7c2d12'], ['#fde68a', '#d97706', '#78350f'], ['#86efac', '#16a34a', '#14532d'],
        ['#67e8f9', '#0891b2', '#164e63'], ['#a5b4fc', '#4f46e5', '#1e1b4b'], ['#d8b4fe', '#9333ea', '#3b0764'], ['#f9a8d4', '#db2777', '#500724'], ['#e2e8f0', '#64748b', '#0f172a']];
    const nL = rival.layers || 1;
    const LH = rival.maxHp / nL;
    const li = Math.max(1, Math.ceil(rival.hp / LH - 1e-9));
    const inLayer = rival.hp <= 0 ? 0 : Math.max(0, Math.min(1, (rival.hp - (li - 1) * LH) / LH));
    const BW = 160;
    const barGrad = (cIdx) => {
        const c = LAYER_COL[Math.min(LAYER_COL.length - 1, cIdx)];
        const g = ctx.createLinearGradient(0, 90, 0, 110);
        g.addColorStop(0, c[0]); g.addColorStop(0.5, c[1]); g.addColorStop(1, c[2]);
        return g;
    };
    if (li > 1) {
        ctx.fillStyle = barGrad(li - 2);
        ctx.globalAlpha = 0.45;
        ctx.beginPath(); ctx.roundRect(98, 90, BW, 20, 8); ctx.fill();
        ctx.globalAlpha = 1;
    }
    // След урона: светлая полоска догоняет HP
    if (rival.hpTrail === undefined || rival.hpTrail < rival.hp || rival.hpTrail > rival.maxHp) rival.hpTrail = rival.hp;
    rival.hpTrail += (rival.hp - rival.hpTrail) * 0.06;
    const trailIn = Math.max(0, Math.min(1, (rival.hpTrail - (li - 1) * LH) / LH));
    if (trailIn > inLayer) {
        ctx.fillStyle = 'rgba(254, 242, 242, 0.7)';
        ctx.beginPath(); ctx.roundRect(98, 90, Math.max(8, Math.floor(BW * trailIn)), 20, 8); ctx.fill();
    }
    if (inLayer > 0) {
        ctx.fillStyle = barGrad(li - 1);
        ctx.beginPath();
        ctx.roundRect(98, 90, Math.max(8, Math.floor(BW * inLayer)), 20, 8);
        ctx.fill();
        // Стеклянный блик на полоске HP
        const hg = ctx.createLinearGradient(0, 90, 0, 100);
        hg.addColorStop(0, 'rgba(255, 255, 255, 0.35)'); hg.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = hg;
        ctx.beginPath(); ctx.roundRect(99, 91, Math.max(6, Math.floor(BW * inLayer) - 2), 9, [7, 7, 2, 2]); ctx.fill();
    }
    if (rival.layerFlash > 0) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = rival.layerFlash * 0.8;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.roundRect(98, 90, BW, 20, 8); ctx.fill();
        ctx.restore();
    }
    // Сколько полосок осталось
    drawRoundedPanel(262, 89, 24, 22, 7, 'rgba(5, 7, 15, 0.95)', LAYER_COL[Math.min(LAYER_COL.length - 1, li - 1)][1]);
    ctx.fillStyle = LAYER_COL[Math.min(LAYER_COL.length - 1, li - 1)][0];
    ctx.font = '800 11px ' + UIF;
    ctx.textAlign = 'center';
    ctx.fillText(`×${li}`, 274, 104.5);

    ctx.fillStyle = '#ffffff';
    ctx.font = '800 11px ' + UIF;
    ctx.textAlign = 'center';
    ctx.fillText(`${Math.ceil(rival.hp).toLocaleString('ru-RU')}`, 178, 104.5);
    // Полоска брони: пустая — значит урон сейчас гасится
    {
        const aRate = rival.maxHp / armorFightSec();
        const aCap = aRate * BALANCE.armorBurstSeconds;
        const aNow = Math.min(aCap, (rival.armor ?? aCap) + Math.max(0, levelTimer - (rival.armorT || 0)) * aRate);
        const ak = Math.max(0, Math.min(1, aNow / aCap));
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(98, 112.5, 188, 3);
        ctx.fillStyle = ak < 0.15 ? '#94a3b8' : '#38bdf8';
        ctx.fillRect(98, 112.5, 188 * ak, 3);
        if (rival.armorFlash > 0) {
            ctx.globalAlpha = Math.min(1, rival.armorFlash * 2);
            ctx.font = '15px ' + UIF;
            ctx.textAlign = 'center';
            ctx.fillText('🛡️', 268, 105);
            ctx.globalAlpha = 1;
        }
    }

    ctx.restore();

    // Всплывающие цифры урона у полоски HP
    bossDmgPops.forEach(p => {
        ctx.save();
        ctx.globalAlpha = Math.min(1, p.life * 2);
        ctx.font = `900 ${p.big ? 17 : 13}px ${UIF}`;
        ctx.textAlign = 'center';
        ctx.fillStyle = '#090d16';
        ctx.fillText(p.txt, p.x + 1.5, p.y + 1.5);
        ctx.fillStyle = p.color || (p.big ? '#fde047' : '#ffffff');
        ctx.fillText(p.txt, p.x, p.y);
        ctx.restore();
    });

    if (rival.beamTimer > 0) {
        ctx.save();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(45, 85);
        ctx.lineTo(rival.beamX, rival.beamY);
        ctx.stroke();
        ctx.restore();
    }
}
